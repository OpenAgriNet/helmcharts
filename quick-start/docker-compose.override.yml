# Apple Silicon only.
#
# ghcr.io/sunbird-rc/sunbird-rc-core publishes amd64 and nothing else, so on an
# arm64 host `docker compose up` fails with "no matching manifest for
# linux/arm64/v8" before anything starts. Pinning the platform runs it under
# Rosetta: slower to boot, correct behaviour.
#
# Only this service. Every other image in the stack -- the adapter, discovery,
# postgres, pgvector -- publishes arm64, and forcing them to amd64 would
# emulate them for no reason.
services:
  sunbird-registry-service:
    platform: linux/amd64

  # Image pins.
  #
  # dev.env carries ADAPTER_IMAGE/DISCOVERY_IMAGE at 0.0.1, but this checkout of
  # quick-start is newer than that: its last config commit is "pin the 0.2.0
  # images and the core-v2.1.0-lts spec" (0772b02). Against 0.0.1 the adapter
  # dies on boot with `unrecognized step: checkCrossNetworkRequester` -- a step
  # the config names and that build does not have.
  #
  # Overridden here rather than in .env only because .env is not ours to edit.
  # Move these into .env and drop this block when the pilot is folded back in.
  network-adapter:
    image: ghcr.io/openagrinet/network-adapter:0.2.0
  discovery-service:
    image: ghcr.io/openagrinet/discovery-service:0.2.0
