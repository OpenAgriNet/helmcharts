# The whole OAN stack in one file: registry, discovery, the three adapters, the
# telemetry stack and the public edge.
#
# Every service name is <tier>-<role>, and every container_name matches it, so
# what `docker ps` shows is what `docker logs` and the in-stack DNS name take.
# The sunbird-registry-* three are Sunbird RC's, not OAN's; the keycloak among
# them authenticates nothing but that registry, and shares its postgres.
#
# Read it in tiers -- the banner comments below are the structure:
#
#   registry        sunbird-registry-postgres, sunbird-registry-keycloak,
#                   sunbird-registry-service
#   discovery       discovery-postgres, discovery-service
#   adapters        provider, network, consumer
#   observability   clickhouse, otel-collector, grafana   profile: observability
#   edge            nginx-proxy-manager          profile: reverse-proxy
#
# The last two are behind profiles because neither is needed to exercise the
# stack, and ClickHouse is the heaviest thing here.
#
# ---------------------------------------------------------------- bringing up
#
#   1. cp .env.example .env               change every credential -- they are
#                                         shipped defaults
#   2. docker compose up -d sunbird-registry-service discovery-service
#                                         everything EXCEPT the adapters
#   3. python3 bin/setup.py               keys, the three adapter entries, and
#                                         the adapter configs they mount
#   4. docker compose up -d               now the adapters
#   5. docker compose --profile reverse-proxy --profile observability up -d
#                                         the edge and the telemetry stack
#
# Naming registry and discovery in step 2 is not tidiness. An adapter config
# is a bind-mounted FILE, and Docker creates a DIRECTORY at any bind-mount
# source that does not exist yet -- so starting an adapter before step 3 both
# wedges that container on a directory it cannot parse and leaves a directory
# where step 3 needs to write a file.
#
# Nothing is built here. Every image is pulled from the tags named in .env.
#
# ------------------------------------------------------------- what is public
#
# Exactly one container publishes on a routable interface: Nginx Proxy
# Manager, on 80 and 443. Everything else -- both Postgres instances,
# Keycloak, the registry, discovery, ClickHouse, the Grafana UI, and NPM's own
# admin UI on 81 -- publishes on 127.0.0.1 and is reachable only through an
# SSH tunnel:
#
# The Grafana UI is the one item on that list with a second way in: it also has
# a proxy host, so it is readable at https://<your grafana name>/ with its own
# login (and, in front of that, the Access List's username and password). Its
# loopback publish is unchanged -- routing it did not open a port here.
#
#   ssh -L 81:127.0.0.1:81   -L 8080:127.0.0.1:8080 \
#       -L 8081:127.0.0.1:8081 -L 8085:127.0.0.1:8085 -N you@the-vm
#
# The loopback binds are written literally rather than taken from a BIND_ADDR
# variable, which is what they used to be. One variable that moves the whole
# stack onto a public interface is a footgun once an edge exists to do that
# job deliberately for the one tier that should be reachable: behind those
# ports are a Keycloak whose admin password ships as a default and a registry
# whose write token anyone who has read .env.example can mint.
#
# ------------------------------------------------------------------- networks
#
# Two, and with a UI-configured proxy at the edge the split stops being
# decoration and becomes the actual control. NPM's "Forward Hostname" is a
# free-text field, so anyone with the admin password can point a public route
# at `sunbird-registry-service` or `sunbird-registry-keycloak`. NPM sits only on
# oan-edge, where neither name resolves and neither address is routable -- the three adapters and grafana
# are the only containers it shares a network with. Those four straddle both
# networks; everything else is internal-only. ClickHouse and the collector stay
# oan-internal ONLY -- Grafana's ClickHouse plugin queries server-side, so
# unlike the old hyperdx container there is no browser-facing ClickHouse port
# that needs a route.
#
# Neither is `internal: true`: the adapters and discovery fetch the Beckn spec
# from raw.githubusercontent.com at boot, the provider adapter calls an
# upstream API that lives outside this VM, and NPM has to reach Let's Encrypt.
# Cutting egress would break all three.

# The stack's name, pinned rather than derived from the directory. Compose
# labels every container with it and prefixes every volume with it, so without
# this line the deployment is named after whatever the checkout is called:
# `quick-start_registry-data` names a directory, not a network. Pinning it also
# means the directory can be renamed without orphaning the registry's data.
name: openagrinet

networks:
  oan-internal:
    name: oan-internal
  oan-edge:
    name: oan-edge

volumes:
  sunbird-registry-postgres-data:
  discovery-postgres-data:
  clickhouse-data:
  grafana-data:
  nginx-proxy-manager-data:
  nginx-proxy-manager-letsencrypt:

x-logging: &logging
  # Every container's stdout, tagged so the log console can name it.
  #
  # The driver is unchanged -- json-file is what Docker was already using. The
  # two additions are:
  #
  # `labels`, which makes the json-file driver write the compose service name
  # into each line's `attrs` field. Compose sets that label on every container
  # already; without this opt it stays in the container's metadata, where the
  # collector reading the log FILE cannot see it. config/otel-collector/config.yaml
  # turns it into service.name, and it is the only reason Grafana can show
  # "discovery-service" rather than 64 hex characters.
  #
  # `max-size`/`max-file`, which bound the files those logs accumulate in.
  # Docker's default is unbounded, so today a chatty service fills the disk and
  # takes Postgres down with it. Unrelated to telemetry and fixed here because
  # this is the change that made the log files matter.
  driver: json-file
  options:
    labels: com.docker.compose.service
    max-size: "10m"
    max-file: "3"

x-adapter: &adapter
  # Pulled, never built. Set ADAPTER_IMAGE in .env to the tag published for
  # this environment -- `docker compose up -d` is the whole deployment step.
  image: ${ADAPTER_IMAGE}
  pull_policy: missing
  restart: unless-stopped
  # The adapters are the only services on oan-edge, and therefore the only
  # ones NPM can reach. They still need oan-internal to read the registry and
  # to call discovery, so they sit on both.
  networks: [oan-internal, oan-edge]
  logging: *logging

x-adapter-env: &adapter-env
  CONFIG_FILE: /app/config/adapter.yaml
  # OpenTelemetry. These ARE read: the otelsetup plugin builds gRPC exporters
  # and the SDK applies its OTEL_EXPORTER_OTLP_* environment config before any
  # option the plugin passes.
  #
  # OTEL_EXPORTER_OTLP_INSECURE IS LOAD-BEARING, and the reason is worth
  # knowing because the symptom names TLS and the cause does not.
  #
  # The SDK derives transport security from the endpoint's SCHEME:
  #
  #     switch u.Scheme { case "http", "unix": WithInsecure(); default: WithSecure() }
  #
  # "default" includes an EMPTY scheme. OTLP_ENDPOINT is a bare host:port,
  # because that is what the plugin's own otlpEndpoint config field takes --
  # so without the scheme prefix below, or this flag, the exporter dials TLS
  # at otel-collector's plaintext 4317 and logs, once per export interval:
  #
  #     failed to upload metrics: ... authentication handshake failed:
  #     tls: first record does not look like a TLS handshake
  #
  # The flag is set explicitly rather than left to the scheme, so a future
  # edit to the URL cannot silently turn TLS back on.
  #
  # This does not weaken anything that was encrypted: the collector is on
  # oan-internal, reachable from nowhere else, and serves plaintext OTLP.
  #
  # There is also a bug underneath, in the plugin rather than here: it passes
  # insecure credentials via WithDialOption, and NewGRPCConfig appends its own
  # default TLS credentials AFTER user options, so gRPC takes the TLS ones and
  # the plugin's setting is silently discarded. The env var is what actually
  # controls this until that is fixed upstream.
  #
  # OTEL_EXPORTER_OTLP_PROTOCOL is deliberately absent. The plugin constructs
  # gRPC exporters in code, so a protocol preference here is ignored and only
  # suggests the transport is configurable from this file.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://${OTLP_ENDPOINT:-otel-collector:4317}
  OTEL_EXPORTER_OTLP_INSECURE: "true"

services:
  # ==========================================================================
  # registry -- who is on the network, their public keys, and which upstream
  # API answers which capability.
  # ==========================================================================
  sunbird-registry-postgres:
    image: postgres:14
    container_name: sunbird-registry-postgres
    restart: unless-stopped
    logging: *logging
    networks: [oan-internal]
    environment:
      POSTGRES_DB: ${REGISTRY_DB_NAME}
      POSTGRES_USER: ${REGISTRY_DB_USER}
      POSTGRES_PASSWORD: ${REGISTRY_DB_PASSWORD}
    volumes:
      - sunbird-registry-postgres-data:/var/lib/postgresql/data
    # No published port at all, not even on loopback: psql runs through
    # `docker compose exec sunbird-registry-postgres`, so publishing one would only widen
    # the surface without adding a way in.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REGISTRY_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20

  sunbird-registry-keycloak:
    image: ghcr.io/sunbird-rc/sunbird-rc-keycloak:latest
    container_name: sunbird-registry-keycloak
    restart: unless-stopped
    logging: *logging
    networks: [oan-internal]
    volumes:
      - ./config/registry/imports:/opt/jboss/keycloak/imports
    environment:
      - DB_VENDOR=postgres
      - DB_ADDR=sunbird-registry-postgres
      - DB_PORT=5432
      - DB_DATABASE=${REGISTRY_DB_NAME}
      - DB_USER=${REGISTRY_DB_USER}
      - DB_PASSWORD=${REGISTRY_DB_PASSWORD}
      - KEYCLOAK_USER=${KEYCLOAK_ADMIN_USER}
      - KEYCLOAK_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KEYCLOAK_IMPORT=/opt/jboss/keycloak/imports/realm-export.json
      - PROXY_ADDRESS_FORWARDING=true
    ports:
      # Loopback only. This is an admin console with an imported realm, and
      # the tunnel is how you reach it.
      - "127.0.0.1:${KEYCLOAK_PORT}:8080"
      - "127.0.0.1:${KEYCLOAK_ADMIN_PORT}:9990"
    depends_on:
      sunbird-registry-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9990/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  sunbird-registry-service:
    image: ghcr.io/sunbird-rc/sunbird-rc-core:${REGISTRY_IMAGE_TAG}
    container_name: sunbird-registry-service
    restart: unless-stopped
    logging: *logging
    # oan-internal ONLY, and that is the decision, not an omission. NPM sits
    # on oan-edge alone, so it cannot resolve the name `registry` -- a proxy
    # host pointed here fails to start rather than quietly working. Attaching
    # oan-edge is the one edit that would make the registry publishable, so it
    # is the one edit to refuse.
    #
    # Why not route it. POST /api/v1/Participant/search takes NO token, which
    # makes it tempting: it is the one call a network peer needs. But
    # SunbirdRC uses POST for both reads and writes -- /Participant/search
    # reads, /Participant creates -- so no method rule separates them, and a
    # route publishes the write surface the moment anything can mint a token.
    # Today nothing can, for one reason only: Keycloak publishes on
    # 127.0.0.1. That is a decision forty lines up, and a route here would
    # silently depend on it.
    #
    # What this costs: nothing outside the VM can write a registry row, which
    # is why bin/setup.py seeds all seven participants and all four bindings from
    # inside. It is also why the Postman collection has no registry request --
    # there is no way for one to work.
    #
    # Reaching it for debugging is an SSH tunnel to ${REGISTRY_PORT}.
    networks: [oan-internal]
    volumes:
      # Schemas are read at startup, so a change here needs this service
      # restarted before the registry will honour it.
      - ./config/registry/schemas:/home/sunbirdrc/config/public/_schemas
    environment:
      - connectionInfo_uri=jdbc:postgresql://sunbird-registry-postgres:5432/${REGISTRY_DB_NAME}
      - connectionInfo_username=${REGISTRY_DB_USER}
      - connectionInfo_password=${REGISTRY_DB_PASSWORD}
      - search_providerName=dev.sunbirdrc.registry.service.NativeSearchService
      - authentication_enabled=true
      - sunbird_sso_realm=${KEYCLOAK_REALM}
      - sunbird_sso_url=http://sunbird-registry-keycloak:8080/auth
      # Without this the service resolves its issuer to localhost -- which
      # inside the container is itself -- and the security filter chain fails
      # to build, so the whole registry never starts.
      - OAUTH2_RESOURCES_0_URI=http://sunbird-registry-keycloak:8080/auth/realms/${KEYCLOAK_REALM}
      - OAUTH2_RESOURCES_0_PROPERTIES_ROLES_PATH=realm_access.roles
      - identity_provider=dev.sunbirdrc.auth.keycloak.KeycloakProviderImpl
      - sunbird_sso_admin_client_id=${KEYCLOAK_ADMIN_CLIENT_ID}
      - sunbird_sso_client_id=${KEYCLOAK_CLIENT_ID}
      - sunbird_sso_admin_client_secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
      - sunbird_keycloak_user_set_password=true
      - sunbird_keycloak_user_password=${KEYCLOAK_DEFAULT_USER_PASSWORD}
      - encryption_enabled=false
      - event_enabled=false
      - idgen_enabled=false
      - claims_enabled=false
      - did_enabled=false
      - signature_enabled=false
      - certificate_enabled=false
      - filestorage_enabled=false
      - notification_enabled=false
      - notification_async_enabled=false
      - async_enabled=false
      - webhook_enabled=false
      - registry_base_apis_enable=false
      - manager_type=DefinitionsManager
      - expand_reference=false
      - swagger_title=OAN Registry
      - logging.level.root=INFO
    ports:
      # Loopback only, and bin/setup.py talks to exactly this: it derives
      # http://localhost:${REGISTRY_PORT} and runs on the VM.
      - "127.0.0.1:${REGISTRY_PORT}:8081"
    depends_on:
      sunbird-registry-postgres:
        condition: service_healthy
      sunbird-registry-keycloak:
        condition: service_healthy
    healthcheck:
      # This image ships no curl, wget, nc or bash, so the check reads the
      # kernel's own table instead: 1F91 is 8081 in hex, and the service binds
      # v6, hence tcp6. It proves the port is accepting connections, which is
      # what everything downstream waits for.
      test: ["CMD-SHELL", "grep -q ':1F91' /proc/net/tcp6"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 40s

  # ==========================================================================
  # discovery -- catalogue search, and its own Postgres.
  # ==========================================================================
  discovery-postgres:
    # pgvector rather than plain postgres: the discovery service's HNSW index
    # options arrived in 0.8.
    image: pgvector/pgvector:0.8.0-pg16
    container_name: discovery-postgres
    restart: unless-stopped
    logging: *logging
    networks: [oan-internal]
    environment:
      # Not read from .env, unlike the registry's pair, and so not covered by
      # the credential rotation .env.example asks for. That is tolerable only
      # because this database publishes no port and sits on an internal
      # network; if it ever needs to be reachable, these move to .env first.
      POSTGRES_USER: discovery
      POSTGRES_PASSWORD: discovery
      POSTGRES_DB: discovery
    volumes:
      - discovery-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discovery -d discovery"]
      interval: 5s
      timeout: 5s
      retries: 20

  discovery-service:
    image: ${DISCOVERY_IMAGE}
    pull_policy: missing

    # THE ONLY SERVICE HERE THAT CAN BE BUILT, and the exception is earned. It
    # is never built by `make up` -- `image:` above still decides what runs, and
    # a build only happens when you ask for one:
    #
    #   DISCOVERY_IMAGE=discovery-service:local docker compose build discovery-service
    #
    # Why this one and not the adapters or the mocks: the published tag went
    # stale in a way no error reports. Measured on 2026-09-10,
    # ghcr.io/nisargabd/discovery-service:latest was built before the telemetry
    # package existed -- its embedded build info lists no go.opentelemetry.io
    # dependency at all. Against that image every OTEL_* setting below is
    # accepted, nothing is exported, and the stack looks entirely healthy. A
    # build you can run locally is what makes that falsifiable.
    #
    # The context defaults to a sibling checkout because that is where it sits
    # for anyone who has both repos; point DISCOVERY_CONTEXT elsewhere if yours
    # differs. Without that checkout the build fails on a missing directory,
    # which is the correct failure -- there is no source to build.
    build:
      context: ${DISCOVERY_CONTEXT:-../../discovery-service}

      # PUBLIC BASE IMAGES, deliberately overriding the Dockerfile's own
      # defaults. It defaults to dhi.io/* -- Docker Hardened Images, what CI
      # and every shipped image use -- and those 401 on an anonymous pull. A
      # quick-start reader is precisely the person without that subscription,
      # so the public equivalents the Dockerfile documents are the right
      # default HERE and the wrong one there. INSTALL_BUILD_TOOLS comes with
      # them and is not optional: h3-go is a cgo binding around Uber's C
      # library, DHI's -dev variant bundles a C toolchain and golang:alpine
      # does not.
      args:
        BUILD_IMAGE: ${DISCOVERY_BUILD_IMAGE:-golang:1.27-alpine}
        RUNTIME_IMAGE: ${DISCOVERY_RUNTIME_IMAGE:-gcr.io/distroless/static-debian12:nonroot}
        INSTALL_BUILD_TOOLS: "true"

        # Bare names, so each is passed through from the environment if set and
        # left to the Dockerfile's own default if not. No values invented here:
        # compose cannot run `git describe`, and a stamp this file made up would
        # be worse than an absent one.
        #
        # Unset, the binary reports `dev unknown 1970-01-01T00:00:00Z unknown`
        # and its telemetry Resource carries that verbatim in build.commit,
        # build.date and build.tree_state. Honest for a local build. To stamp
        # one, build it in the discovery-service repo instead -- `make docker`
        # is what derives all four -- or set them in the environment first.
        #
        # A key with NO VALUE is compose's pass-through form. It is not the same
        # as `VERSION: ""`, which would pass an empty string and defeat the
        # Dockerfile's default.
        VERSION:
        COMMIT:
        BUILD_DATE:
        TREE_STATE:

    container_name: discovery-service
    restart: unless-stopped
    logging: *logging
    networks: [oan-internal]
    environment:
      DATABASE_URL: postgres://discovery:discovery@discovery-postgres:5432/discovery?sslmode=disable
      DATABASE_AUTO_MIGRATE: "true"
      # APP_NETWORK_ID is the discovery image's own variable, so the left side
      # cannot be renamed with the rest -- only the .env name it reads from.
      APP_NETWORK_ID: ${BECKN_NETWORK_ID}
      SERVER_PORT: 8080
      VALIDATION_SPEC_URL: ${BECKN_SPEC_URL}

      # ---- the publish geometry budget --------------------------------------
      #
      # How many GeoJSON shapes ONE catalog may contribute to the spatial index.
      # Past it the publish still answers 200, with status PARTIAL and a fault
      # per shape naming its path -- so nothing is dropped in silence, but those
      # shapes are not searchable. Set here rather than left to the image's own
      # 256 because it is the one discovery setting whose right value depends
      # entirely on what you publish, and the failure it causes reads as missing
      # data rather than as configuration.
      #
      # Count SHAPES, not resources: the walker recognises GeoJSON by shape and
      # not by field name, at any depth. A mandi catalog carrying a Point under
      # both coverageAreas and market.location spends TWO per market -- 273
      # Maharashtra markets published that way need 546, and under 256 only the
      # first 128 markets are findable by place.
      GEO_MAX_GEOMETRIES_PER_CATALOG: ${DISCOVERY_MAX_GEOMETRIES_PER_CATALOG:-256}

      # ---- search -----------------------------------------------------------
      #
      # OFF, against the image's own default of true. With it off a search
      # matches on the structured index alone -- domain, capability and
      # geometry -- and free-text terms stop contributing to what comes back.
      # SEARCH_ENABLE_TEXT_SEARCH is the image's variable name, so the left
      # side is its contract and only the value here is ours.
      SEARCH_ENABLE_TEXT_SEARCH: "false"

      # ---- rate limit -------------------------------------------------------
      #
      # EFFECTIVELY OFF, against the image's own default of 20 rps / burst 40.
      # That default is right for a shared deployment and wrong for this one:
      # a quick-start is read by someone running a scripted sweep -- setup.py,
      # a Postman collection, a bulk publish, a benchmark loop -- and 20 rps is
      # under all of them. What they get is AUT_RATE_LIMITED, and a 429 NACK
      # carries no `catalogs`, so a throttled sweep reads as an empty result
      # rather than as backpressure. Measured on 2026-09-12: a plain 20-request
      # loop against /discover tripped it.
      #
      # NOT ZERO, and it cannot be: the boot requires burst >= rps > 0, on the
      # same argument as the geometry budget above -- zero reads either as
      # "unlimited" or as "refuse everything", and the config layer will not
      # guess which. A number nothing reaches is the honest way to say off.
      RATE_LIMIT_RPS: ${DISCOVERY_RATE_LIMIT_RPS:-100000}
      RATE_LIMIT_BURST: ${DISCOVERY_RATE_LIMIT_BURST:-100000}

      # ---- telemetry --------------------------------------------------------
      #
      # This block used to say the exporter was parsed and unread, and that
      # `none` was therefore the honest default. That stopped being true when
      # the telemetry package landed: the service exports spans and two pgxpool
      # instruments over OTLP/gRPC, straight to otel-collector like the adapters.
      #
      # WHAT DOES NOT ARRIVE, so nobody goes looking for it: the five OAN
      # `metric.code` streams -- the two *_total_count and the three *_percent.
      # They are not instrumented in the service at all; they are derived from
      # the exported span stream by a collector running the discovery-service
      # repo's otel/collector.yaml, and this stack does not run one. Traces
      # arrive, everything looks healthy, and those five are simply absent.
      # That is a quick-start simplification, not the deployment shape -- see
      # Appendix H.
      OTEL_EXPORTER: ${DISCOVERY_OTEL_EXPORTER:-otlp}

      # NO SCHEME, and that is the opposite of the adapters two screens up --
      # worth reading beside the note on the x-adapter anchor, because the same
      # bare host:port means opposite things on either side.
      #
      # This service does not consult the SDK's env lookup; it passes the
      # endpoint in explicitly, having branched on whether it has a scheme:
      #
      #     if hasScheme(endpoint) { WithEndpointURL(endpoint) }
      #     else                   { WithEndpoint(endpoint), WithInsecure() }
      #
      # So a bare host:port is plaintext HERE, where on the adapters a bare
      # host:port is what silently selects TLS. Adding http:// to this line
      # would not make it more explicit; it would route through the URL branch.
      # OTEL_EXPORTER_OTLP_INSECURE is absent for the same reason: unread.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTLP_ENDPOINT:-otel-collector:4317}

      # BOTH ARE REQUIRED once the exporter is otlp, and their absence fails
      # the boot rather than degrading -- the service refuses to export a
      # stream it cannot attribute. That refusal is why they are here: before
      # this, flipping DISCOVERY_OTEL_EXPORTER=otlp would have stopped the container
      # starting, naming a variable this file never set.
      #
      # APP_SUBSCRIBER_ID is the Resource's `producer` and every span's
      # recipient.id. Empty means the whole stream lands under no participant,
      # which is worse than no stream: an empty grouping key reads as data
      # rather than as an absence.
      #
      # APP_DOMAIN is checked against the sector list the build declares, so a
      # typo fails the boot instead of splitting this deployment's telemetry
      # into a group of one.
      APP_SUBSCRIBER_ID: ${DISCOVERY_SUBSCRIBER_ID}
      APP_DOMAIN: ${DISCOVERY_DOMAIN:-Agriculture}

      # OTEL_SERVICE_NAME is deliberately absent, and it WAS SET HERE on both
      # sides of this merge -- to `oan-discovery` before the container rename
      # and to `discovery` after it. The service reads neither: `service.name`
      # is a compile-time constant, `discovery-service`, because it says what
      # SOFTWARE this is and so must not vary by deployment. Confirmed against
      # a live stack on 2026-09-10 -- spans arrived as `discovery-service` with
      # nothing set. The variable was worse than inert: it named a value you
      # would then go hunting for in Grafana and never find, and the rename
      # gave it a second wrong value to hunt for. What varies per deployment is
      # `producer`, from APP_SUBSCRIBER_ID above.
    # config/common.yaml is baked into the image and is the reviewed default.
    # To override a setting, copy config/discovery/instance.yaml.example to
    # config/discovery/instance.yaml and uncomment the mount below -- compose
    # creates a DIRECTORY if you mount a file that does not exist, which the
    # service then fails to parse, so the file has to be there first.
    # volumes:
    #   - ./config/discovery/instance.yaml:/app/config/instance.yaml:ro
    ports:
      # Loopback only. Discovery is reached by the network adapter over
      # oan-internal; this publish exists for curl through the tunnel.
      - "127.0.0.1:${DISCOVERY_PORT}:8080"
    depends_on:
      discovery-postgres:
        condition: service_healthy

  # ==========================================================================
  # adapters -- consumer, network and provider. Same image, three configs.
  #
  # Their configs are bind-mounted FILES that do not exist until bin/setup.py
  # renders them from the .tmpl beside them, which is what the step ordering
  # above is about.
  # ==========================================================================

  # ==========================================================================
  # mock upstreams -- stand-ins for the real provider APIs, so the stack can be
  # exercised without their credentials.
  #
  # Pulled like everything else. The sources are in mock-server/ to be built and
  # published once, not built here -- see mock-server/README.md.
  #
  # oan-internal only: an upstream is called BY the provider adapter and is
  # never reached from outside, so NPM has no business seeing it. The published
  # ports are for looking at the mock directly while debugging.
  #
  # Both reproduce the awkward parts of the services they stand in for on
  # purpose. A tidy mock would let a mapping pass here and fail in the real
  # deployment.
  # ==========================================================================
  mock-imd:
    image: ${MOCKIMD_IMAGE}
    pull_policy: missing
    container_name: mock-imd
    restart: unless-stopped
    logging: *logging
    networks: [oan-internal]
    command:
      - "-addr=:9100"
      # How many forecast days it answers with. The mapping reads however many
      # arrive, so this is the knob for checking that it does.
      - "-days=${MOCKIMD_DAYS:-3}"
    ports:
      - "127.0.0.1:${MOCKIMD_PORT}:9100"

  mock-agmarknet:
    image: ${MOCKAGMARKNET_IMAGE}
    pull_policy: missing
    container_name: mock-agmarknet
    restart: unless-stopped
    logging: *logging
    networks: [oan-internal]
    command:
      - "-addr=:9101"
      # It answers 401 without this token, which is what proves the adapter
      # sent one rather than the call happening to work anyway.
      - "-token=${MOCKAGMARKNET_TOKEN:-local-mandi-token}"
      - "-days=${MOCKAGMARKNET_DAYS:-2}"
    ports:
      - "127.0.0.1:${MOCKAGMARKNET_PORT}:9101"

  # Verifies the caller, calls the upstream provider, answers synchronously.
  # It has no provider address of its own: it reads the ProviderSchema row,
  # so repointing it at a different upstream is a registry write, not a
  # change here or a restart.
  provider-adapter:
    <<: *adapter
    container_name: provider-adapter
    # Registry only. The mocks are deliberately NOT dependencies: every
    # capability points at a real external upstream, and depends_on would start
    # both containers on any `docker compose up -d provider-adapter` even though
    # nothing calls them. They stay defined below so they can still be started
    # by name for debugging.
    depends_on:
      sunbird-registry-service:
        condition: service_healthy
    environment:
      <<: *adapter-env
      OTEL_SERVICE_NAME: provider-adapter
      # The weather upstream's credential, as ONE ready-made header value --
      # "Basic <token>", prefix included. IMD Mausamgram issues a single opaque
      # token rather than a user/password pair, so the adapter sends this
      # verbatim (authScheme header) instead of building the header from two
      # halves. Named here and read at call time, so the value is in neither a
      # config file nor the registry.
      MAUSAMGRAM_AUTH: ${MAUSAMGRAM_AUTH}
      # The mandi upstream's credentials. Agmarknet issues its own token, so
      # these two are exchanged for one at call time. Named here and read then,
      # so neither is in a config file or in the registry.
      AGMARKNET_ACCESS_NAME: ${AGMARKNET_ACCESS_NAME}
      AGMARKNET_PASSWORD: ${AGMARKNET_PASSWORD}
      # Read only when MandiPrice is pointed back at mock-agmarknet, which takes
      # a static token instead of issuing one.
      MOCKAGMARKNET_TOKEN: ${MOCKAGMARKNET_TOKEN:-local-mandi-token}
      # The knowledge provider's OAuth2 client credentials, exchanged for a
      # token at call time. Here for the same reason: the adapter config names
      # these two VARIABLES and never their values, so nothing secret is in a
      # config file or in a registry row.
      #
      # The step fails fast and permanently when either is unset -- it is a
      # configuration fault, not a transient one, so it is not retried.
      VISTAAR_CLIENT_ID: ${VISTAAR_CLIENT_ID}
      VISTAAR_CLIENT_SECRET: ${VISTAAR_CLIENT_SECRET}
    volumes:
      - ./config/adapters/provider.yaml:/app/config/adapter.yaml:ro
      - ./config/adapters/routing-provider.yaml:/app/config/routing-provider.yaml:ro
    ports:
      - "127.0.0.1:${PROVIDER_ADAPTER_PORT}:9200"

  # Verifies the caller, hands discovery on, re-signs as itself.
  network-adapter:
    <<: *adapter
    container_name: network-adapter
    depends_on:
      sunbird-registry-service:
        condition: service_healthy
      discovery-service:
        condition: service_started
    environment:
      <<: *adapter-env
      OTEL_SERVICE_NAME: network-adapter
    volumes:
      - ./config/adapters/network.yaml:/app/config/adapter.yaml:ro
      - ./config/adapters/routing-network.yaml:/app/config/routing-network.yaml:ro
    ports:
      - "127.0.0.1:${NETWORK_ADAPTER_PORT}:9201"

  # The caller, and the only one that takes unsigned requests: the consumer
  # app is inside the trust boundary, so there is no network signature to
  # check. This is what makes the stack testable with a plain curl -- and it
  # is also why the edge rate-limits this host and nothing else.
  consumer-adapter:
    <<: *adapter
    container_name: consumer-adapter
    depends_on:
      network-adapter:
        condition: service_started
      provider-adapter:
        condition: service_started
    environment:
      <<: *adapter-env
      OTEL_SERVICE_NAME: consumer-adapter
    volumes:
      - ./config/adapters/consumer.yaml:/app/config/adapter.yaml:ro
      - ./config/adapters/routing-consumer.yaml:/app/config/routing-consumer.yaml:ro
    ports:
      - "127.0.0.1:${CONSUMER_ADAPTER_PORT}:9202"

  # ==========================================================================
  # observability -- ClickHouse (storage), an OpenTelemetry Collector (OTLP
  # ingest and container-log collection), and Grafana (the UI over both).
  #
  #   docker compose --profile observability up -d
  #
  # Three containers where HyperDX/ClickStack used to be one, because Grafana
  # is a query layer, not a telemetry backend -- it needs something to query.
  # ClickHouse is that backend, and the collector is what gets data into it:
  # it replaces the collector that used to live inside the HyperDX image, so
  # it is also what config/observability/filelog.yaml used to be an OVERLAY
  # on -- config/otel-collector/config.yaml is the whole config now, not a
  # fragment merged into an image we did not otherwise control.
  #
  # Sizing unchanged from before: ClickHouse alone wants 2-4 GB, so with this
  # profile on the VM needs 16 GB (t3.xlarge or m6i.xlarge); without it, 8 GB
  # is workable.
  # ==========================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    restart: unless-stopped
    logging: *logging
    profiles: ["observability"]

    # oan-internal ONLY. Unlike the old hyperdx container, nothing here queries
    # ClickHouse from a BROWSER -- Grafana's ClickHouse plugin runs server-side
    # inside the grafana container, so the query never has to leave this
    # network. That is what lets ClickHouse stay off oan-edge entirely: there
    # is no "Team Settings -> Host" step where a browser needs its own route or
    # tunnel to 8123, which was the reason clickstack-local's HTTP port had to
    # be published on oan-edge at all.
    networks: [oan-internal]
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-otel}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-otel}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      # Loopback only, and only for debugging with clickhouse-client or a
      # one-off SQL query over a tunnel. Nothing in the stack needs this
      # published -- the collector and Grafana both reach `clickhouse` by
      # service name over oan-internal.
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Everything HyperDX's own embedded collector used to do: OTLP ingest from
  # the adapters and discovery-service, plus the filelog pipeline that reads
  # every container's stdout. One self-owned config,
  # config/otel-collector/config.yaml, replaces both the base config HyperDX
  # supplied and the filelog.yaml overlay that used to be merged into it over
  # OpAMP -- there is no longer an upstream image's own naming to stay
  # coupled to.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    logging: *logging
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

    # oan-internal ONLY. Nothing on oan-edge ever needs to resolve this name --
    # NPM does not route to it, and README Appendix B says why 4317/4318 must
    # never get a proxy host: they take telemetry with no credential at all.
    networks: [oan-internal]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_ENDPOINT: tcp://clickhouse:9000?dial_timeout=10s
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-otel}
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USER:-otel}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./config/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro

      # Docker's own log files, READ-ONLY -- same file HyperDX's collector read
      # for the same reason: it is the only way to see every OTHER container's
      # stdout without a per-service exporter, and Postgres, Keycloak and NPM
      # will never speak OTLP. Same macOS/rootless-Docker caveat as before: see
      # config/otel-collector/config.yaml for the two-cause "no logs arrive"
      # checklist.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      # Loopback only, so a reverse tunnel can carry telemetry from a provider
      # API running on someone's laptop. In-stack senders reach
      # otel-collector:4317/4318 over oan-internal and do not need these.
      - "127.0.0.1:${OTEL_COLLECTOR_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_COLLECTOR_OTLP_HTTP_PORT:-4318}:4318"
    # No healthcheck: the contrib image is built FROM SCRATCH -- the binary,
    # its config and CA certificates, nothing else. No shell and no wget/curl,
    # so neither a CMD-SHELL probe nor a CMD exec-form one can run inside this
    # container at all (verified against the image's own Dockerfile, which
    # ends `FROM scratch`). The health_check extension in
    # config/otel-collector/config.yaml still binds 13133 for a manual check
    # from another container on oan-internal; Docker just cannot be the one
    # asking. depends_on below is `service_started`, not `service_healthy`,
    # for the same reason.

  # The UI. Queries ClickHouse through the grafana-clickhouse-datasource
  # plugin, provisioned automatically from config/grafana/provisioning -- no
  # click-through needed, unlike HyperDX's Team Settings step.
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    logging: *logging
    profiles: ["observability"]

    # oan-edge in addition to oan-internal, so NPM can resolve `grafana` and
    # serve the UI on a hostname instead of an `ssh -L`. Unlike the old
    # hyperdx container, this does NOT also expose ClickHouse on oan-edge:
    # the datasource plugin runs server-side, inside this container, so there
    # is no browser-facing ClickHouse port to accidentally route. That was
    # HyperDX's `hyperdx:8123` problem, and moving the query server-side is
    # what removes it rather than documenting around it.
    networks: [oan-internal, oan-edge]
    depends_on:
      clickhouse:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      # UNLIKE HyperDX, Grafana ships a real login -- so this credential is
      # what guards it, not only the NPM Access List in front. Both are worth
      # keeping: the Access List keeps the login prompt itself off the public
      # internet, same as it did for HyperDX.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Not bundled with the base image -- it is a community-maintained
      # datasource plugin, so it has to be installed at boot. That needs
      # egress, on the same argument as the "why isn't this internal: true"
      # note at the top of this file.
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Substituted into config/grafana/provisioning/datasources/clickhouse.yaml
      # so the datasource is wired up on first boot with no click-through --
      # the same property HyperDX had for the opposite reason (it had nothing
      # to configure).
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-otel}
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USER:-otel}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      # Loopback only, same reasoning as every other UI in this file: the
      # public path is the NPM proxy host, not this publish.
      - "127.0.0.1:${GRAFANA_UI_PORT:-8085}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ==========================================================================
  # edge -- Nginx Proxy Manager.
  #
  #   docker compose --profile reverse-proxy up -d
  #
  # NPM rather than a hand-written nginx.conf because it owns the part that is
  # genuinely tedious to do by hand -- ACME. It requests, installs and renews
  # Let's Encrypt certificates from a UI rather than from a certbot invocation
  # someone has to remember. In exchange, the routing table stops being a file
  # in this repo and becomes rows in NPM's SQLite database under the nginx-proxy-manager-data
  # volume: reviewable only by opening the UI, and restorable only from that
  # volume. See README for the proxy hosts to create.
  # ==========================================================================
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    logging: *logging
    profiles: ["reverse-proxy"]

    # oan-edge ONLY, and this is the whole security argument for putting a
    # UI-configured proxy in front of this stack.
    #
    # NPM's "Forward Hostname" is a free-text field. Anyone with the admin
    # password can type `sunbird-registry-service`, `sunbird-registry-keycloak` or `discovery-postgres` into it. On
    # this network none of those names resolve and none of those addresses are
    # routable from here -- the three adapters, and grafana when the
    # observability profile is up, are the only containers NPM shares a network
    # with. So the blast radius of a wrong click, or of the admin UI being
    # reached by someone who should not have it, is bounded to that set.
    # clickhouse and otel-collector stay oan-internal only and are never
    # reachable from here at all, routed or not.
    #
    # Putting NPM on oan-internal to "make things easier" would remove that
    # bound entirely and put the registry's write API one form field away from
    # the internet. Do not.
    networks: [oan-edge]

    ports:
      # Public. Both of these must be reachable from anywhere, not just from
      # your address: Let's Encrypt validates HTTP-01 by fetching
      # http://<name>/.well-known/acme-challenge/... from its own servers, and
      # those come from addresses you do not get to enumerate. An SG rule
      # scoped to your IP will make certificate issuance fail with a challenge
      # timeout. Use DNS-01 instead if 80 must stay closed -- see README.
      - "0.0.0.0:${REVERSE_PROXY_HTTP_PORT:-80}:80"
      - "0.0.0.0:${REVERSE_PROXY_HTTPS_PORT:-443}:443"

      # The admin UI, on loopback -- deliberately not the "publish it and
      # restrict it in the firewall" arrangement. Two reasons. It ships with
      # a known default login (admin@example.com / changeme) that is live from
      # first boot until someone changes it, and it is the one surface here
      # that can mint certificates and re-point every public route. A security
      # group is a second system to keep in step with that; a loopback bind is
      # not. Reach it over the tunnel:
      #
      #   ssh -L 81:127.0.0.1:81 -N you@the-vm   then http://127.0.0.1:81
      - "127.0.0.1:${NPM_ADMIN_PORT:-81}:81"

    volumes:
      - nginx-proxy-manager-data:/data
      - nginx-proxy-manager-letsencrypt:/etc/letsencrypt

      # Version-controlled nginx that NPM includes on its own. /data is a
      # named volume and this bind mounts over one directory inside it, which
      # works because the more specific mount wins.
      #
      # Only what is genuinely context-wide belongs here -- see the README for
      # which of these NPM loads automatically and which is a paste job.
      #
      # NOT :ro, however much it wants to be. NPM's s6 init runs 50-ipv6.sh
      # over everything under /data/nginx, which writes a .tmp beside each file
      # and then chowns it. On a read-only mount both fail, the `prepare`
      # service exits 1, s6 aborts the rest of the chain, and nginx never
      # starts -- the container still reports Up, because s6 itself is alive,
      # so the symptom is an empty reply on 81 and a healthcheck that never
      # passes rather than anything that says "permissions".
      #
      # What NPM actually rewrites is `listen` directives, and neither file
      # here has one, so the pass is a no-op on content. It does take
      # ownership of the files, which is cosmetic and not tracked by git.
      - ./config/reverse-proxy/npm-custom:/data/nginx/custom

    depends_on:
      # Ordering only; the adapter image has no healthcheck.
      #
      # And ordering is not the whole problem. NPM writes a literal
      # proxy_pass hostname per proxy host, which nginx resolves at reload and
      # then caches -- so if you RECREATE an adapter (not merely restart it;
      # a restart keeps the address) NPM keeps proxying to an address nothing
      # answers on. The fix is one command, and it is worth knowing before you
      # spend an afternoon on a 502:
      #
      #   docker compose restart nginx-proxy-manager
      #
      # grafana is deliberately absent even though it is routed: it is behind
      # the `observability` profile, and a depends_on would make it start
      # whenever NPM does. That means the restart above is not optional after
      # `make observability` -- NPM was started before the name existed, so the
      # Grafana host 502s until it re-resolves.
      consumer-adapter:
        condition: service_started
      network-adapter:
        condition: service_started
      provider-adapter:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:81/api/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
