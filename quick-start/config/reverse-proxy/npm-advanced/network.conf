# NOT loaded automatically. This is a paste job.
#
# NPM UI -> Hosts -> Proxy Hosts -> the network host -> Advanced -> paste this
# into "Custom Nginx Configuration" -> Save.
#
# Another network calls /discover; the adapter serves it at /network/discover.
# Without this the call is a 404 and a crawl of this network collects nothing,
# with nothing on either side naming the proxy as the cause.
#
# It applies to the network host ONLY, which is why it is not in
# npm-custom/server_proxy.conf: that file is included by every proxy host, and
# a host fronting a different deployment has a different upstream.
#
# The headers are set here rather than inherited: a location block of our own
# does not pick up the ones NPM generates for the host's main location.

location = /discover {
    proxy_pass http://network-adapter:9201/network/discover;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
