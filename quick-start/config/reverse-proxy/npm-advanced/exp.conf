# NOT loaded automatically. This is a paste job.
#
# NPM UI -> Hosts -> Proxy Hosts -> the experience-layer host -> Advanced ->
# paste this into "Custom Nginx Configuration" -> Save.
#
# It lives in a file, in this repo, because NPM's Advanced field is a textarea
# in a SQLite row: nothing diffs it, nothing reviews it, and a restore from the
# npm-data volume is the only thing that remembers it. Keeping the source here
# means the rule can be read and reviewed even though the running copy cannot.
#
# It applies to the experience host ONLY, which is the reason it is not in
# npm-custom/server_proxy.conf: /exp is app-facing and unsigned, while the
# network and provider hosts carry signed peer traffic that a 10 r/s ceiling
# would throttle for no security gain.
#
# The zone itself is declared in npm-custom/http_top.conf, which IS loaded
# automatically. If nginx rejects this paste with "unknown limit_req zone",
# that mount is missing rather than this snippet being wrong.

limit_req zone=exp burst=20 nodelay;
