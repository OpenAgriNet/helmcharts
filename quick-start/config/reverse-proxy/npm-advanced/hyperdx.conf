# NOT loaded automatically. This is a paste job.
#
# NPM UI -> Hosts -> Proxy Hosts -> the HyperDX host -> Advanced -> paste this
# into "Custom Nginx Configuration" -> Save.
#
# Same reasoning as npm-advanced/exp.conf: NPM's Advanced field is a textarea
# in a SQLite row, so the running copy is reviewable only by opening the UI and
# recoverable only from the npm-data volume. The source lives here instead.
#
# It applies to the HyperDX host ONLY. None of it belongs in
# npm-custom/server_proxy.conf, which every proxy host includes -- these are
# timeouts sized for ClickHouse scans, and putting them on the adapters would
# turn a hung upstream into a request that sits for five minutes instead of
# failing in sixty seconds.
#
# ---------------------------------------------------------------------- AUTH
#
# NOT IN THIS FILE, AND THAT IS THE PART TO GET RIGHT.
#
# clickstack-local has no login of its own -- no team, no user, no ingestion
# key. That is what makes `make observability` a single command, and it means
# a proxy host with no Access List attached publishes every trace, log and
# metric this stack has emitted to anyone who resolves the name. Request URLs,
# participant IDs, adapter payload fragments and the registry calls in between.
#
# The credential is an NPM **Access List** (Access Lists -> Add -> Authorization
# -> username + password; Satisfy Any; then Proxy Host -> Details -> Access
# List). It is not here because htpasswd in git is worse than htpasswd in a
# volume, and because NPM bcrypts and reloads it for you.
#
# Verify BOTH directions after attaching it -- a missing Access List fails
# open, and 200-without-credentials looks exactly like success:
#
#   curl -s -o /dev/null -w '%{http_code}\n' https://hyperdx.oan.example.com/ -u user:pass   # 200
#   curl -s -o /dev/null -w '%{http_code}\n' https://hyperdx.oan.example.com/                # 401
#
# ------------------------------------------------------------------------------

# ClickHouse scans outlive nginx's 60s default. A search over a few days of
# spans on a small VM takes minutes, and the failure it produces without this
# is a 504 from the edge while the query is still running happily underneath --
# which reads as "HyperDX is broken", not "the proxy gave up first".
proxy_read_timeout    300s;
proxy_send_timeout    300s;
proxy_connect_timeout 30s;

# Live tail streams. With nginx buffering the response, it accumulates instead
# of arriving, so the tail shows nothing for a while and then dumps -- the
# symptom is a UI that looks stalled rather than one that looks buffered.
proxy_buffering     off;
proxy_request_buffering off;

# The UI ships source maps and chunky JS bundles, and saved-search and alert
# payloads go the other way. NPM's 1m default client_max_body_size is fine for
# Beckn envelopes and tight here.
client_max_body_size 32m;

# Belt and braces on top of the Access List. This host is a read surface for
# telemetry and there is no reason for a search engine to have indexed it, or
# for a browser to be framing it -- and unlike the Access List, these two
# survive someone detaching the Access List by mistake. They are not a
# substitute for it: they stop indexing and framing, not reading.
add_header X-Robots-Tag  "noindex, nofollow, noarchive" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# OTLP ingest is NOT routed and must not be added to this host. 4317/4318 take
# telemetry with no credential at all -- an Access List in front of them would
# break every in-stack sender (they speak gRPC, not HTTP Basic) while an open
# route would let anyone write into the same tables the stack under test uses.
# Senders inside the stack reach hyperdx:4317 over oan-internal; a sender
# outside gets a reverse tunnel to the loopback publish. See README Appendix H.
