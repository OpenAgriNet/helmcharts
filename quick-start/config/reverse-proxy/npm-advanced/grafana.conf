# NOT loaded automatically. This is a paste job.
#
# NPM UI -> Hosts -> Proxy Hosts -> the Grafana host -> Advanced -> paste this
# into "Custom Nginx Configuration" -> Save.
#
# Same reasoning as npm-advanced/exp.conf: NPM's Advanced field is a textarea
# in a SQLite row, so the running copy is reviewable only by opening the UI and
# recoverable only from the npm-data volume. The source lives here instead.
#
# It applies to the Grafana host ONLY. None of it belongs in
# npm-custom/server_proxy.conf, which every proxy host includes -- these are
# timeouts sized for ClickHouse-backed queries and a WebSocket upgrade Grafana
# needs and the adapters do not.
#
# ---------------------------------------------------------------------- AUTH
#
# DIFFERENT FROM THE OLD hyperdx.conf, AND WORTH READING EVEN IF YOU KNOW THAT
# ONE.
#
# Grafana ships a real login (GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD
# in docker-compose.yml's `grafana` service) -- unlike clickstack-local, which
# had none of its own. So this host is not a bare read surface the moment it is
# routed the way hyperdx was.
#
# That does not make an Access List optional, only a second layer rather than
# the only one. It still keeps the login prompt itself off the public internet,
# and it still stops an attacker who has guessed or brute-forced the Grafana
# password from being asked for a second, unrelated credential first. Attach
# one the same way: Access Lists -> Add -> Authorization -> username + password;
# then Proxy Host -> Details -> Access List.
#
# LEAVE "Satisfy Any" UNCHECKED, for the same reason as before -- it maps to
# nginx's `satisfy any`, which is at best pointless and at worst the reason the
# browser is never asked for the Access List's password. Only check it if you
# have IP rules AND want either the address or the password to be sufficient.
#
# Verify BOTH directions after attaching it:
#
#   curl -s -o /dev/null -w '%{http_code}\n' https://grafana.oan.example.com/ -u user:pass   # 200 (then Grafana's own login)
#   curl -s -o /dev/null -w '%{http_code}\n' https://grafana.oan.example.com/                # 401
#
# ------------------------------------------------------------------------------

# ClickHouse-backed queries outlive nginx's 60s default. A search over a few
# days of logs on a small VM takes minutes, and the failure it produces
# without this is a 504 from the edge while the query is still running
# happily underneath -- which reads as "Grafana is broken", not "the proxy
# gave up first".
proxy_read_timeout    300s;
proxy_send_timeout    300s;
proxy_connect_timeout 30s;

# Grafana Live -- the WebSocket connection dashboards use for streaming
# panels and live-tailing logs. Without the upgrade headers nginx proxies it
# as a plain HTTP request, the handshake fails, and the panel falls back to
# polling (or shows nothing) with no error that names the proxy as the cause.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";

# Log/trace panels stream results in as a query runs. With nginx buffering
# the response, it accumulates instead of arriving, so a panel looks stalled
# rather than looks like it is loading.
proxy_buffering     off;
proxy_request_buffering off;

# The UI ships chunky JS bundles, and dashboard JSON and alert payloads go
# the other way. NPM's 1m default client_max_body_size is tight for a
# dashboard import.
client_max_body_size 32m;

# Belt and braces on top of the Access List and Grafana's own login. There is
# no reason for a search engine to have indexed this host, or for a browser
# to be framing it -- and unlike either credential, these two survive someone
# detaching the Access List by mistake. They are not a substitute for it:
# they stop indexing and framing, not reading.
add_header X-Robots-Tag  "noindex, nofollow, noarchive" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# OTLP ingest is NOT routed and must not be added to this host. 4317/4318 take
# telemetry with no credential at all -- an Access List in front of them would
# break every in-stack sender (they speak gRPC, not HTTP Basic) while an open
# route would let anyone write into the same tables the stack under test uses.
# Senders inside the stack reach otel-collector:4317 over oan-internal; a
# sender outside gets a reverse tunnel to the loopback publish. See README
# Appendix H.
