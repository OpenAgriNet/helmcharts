# Included by NPM inside EVERY proxy host's server block, automatically, from
# /data/nginx/custom/server_proxy.conf. No UI step.
#
# Because it applies to every host, only rules that are correct everywhere
# belong here. There are two, and they matter more than the rest of this
# stack's edge configuration combined.

# The provider adapter mounts TWO modules. / is its Beckn surface and
# verifies the sender's signature against the registry. But the publish module
# is mounted at `/publish` with NO validateSign at all, because its intended caller is
# the provider's own catalogue system, inside the trust boundary -- the same
# reason the consumer adapter takes unsigned calls.
#
# So a proxy host pointed at provider-adapter:9200 exposes, at <host>/publish,
# an unauthenticated "write anything into the catalogue" endpoint. NPM's UI
# gives no way to route a host while withholding one path, and this is not a
# thing to leave to remembering an Advanced-tab paste on one host.
#
# An exact-match location beats NPM's generated `location /`, so this wins
# without conflicting with it. On the consumer and network hosts it denies a path
# their adapters do not serve, which costs nothing.
# In single mode network-adapter:9201 serves /publish itself, so the deny matters there.
#
# To open it for a real catalogue system outside this VM, do NOT edit this to
# `allow`. Give that caller a tunnel, or put it in the VPC and reach
# provider-adapter directly -- an endpoint with no credential to check does not
# belong on the public edge, and an address allowlist in front of it is a
# statement about the network, which is where it should be made.
location = /publish {
    deny all;
}

# The /discover -> /network/ mapping is in npm-advanced/network.conf, not here:
# this file is included in every server block and the upstream differs per host.
# It is pasted onto the network proxy host, in its Advanced tab.
#
# What is true everywhere: no mount is reachable under its own name. /consumer/
# and /publish take UNSIGNED calls, /crawl is an operator surface.
location ^~ /consumer {
    deny all;
}

location ^~ /network {
    deny all;
}

location ^~ /provider {
    deny all;
}

location ^~ /crawl {
    deny all;
}

# Federation documents from `make host-descriptor`. Public, so every host may
# serve them; exact matches leave /.well-known/acme-challenge/ alone.
location = /.well-known/openagrinet {
    alias /srv/well-known/openagrinet;
    default_type application/json;
    add_header Cache-Control "no-cache";
}

location = /.well-known/jwks.json {
    alias /srv/well-known/jwks.json;
    default_type application/json;
    add_header Cache-Control "no-cache";
}

location = /.well-known/schema-packs.json {
    alias /srv/well-known/schema-packs.json;
    default_type application/json;
    add_header Cache-Control "no-cache";
}
