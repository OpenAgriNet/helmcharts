# What the consumer layer does with each action, in the Network Adapter Layer
# (consumer, network and provider as modules of one adapter).
#
# Both targets are THIS SAME adapter on another path. In the multi-adapter
# stack they are two other containers; here the hop is a call from one module
# to another inside the same container. It stays a real HTTP hop rather than an in-process call
# because that keeps the two shapes the same config: split these across
# containers and only the host in these URLs changes.
#
# targetType "url" appends the action to the path, so the base here is the
# module mount point and /discover or /select is added to it. localhost:9201 is
# the container's own listener and must match `http.port` in network-adapter.yaml.tmpl.
routingRules:
  # Discovery is answered from this network's own discovery service, which the
  # network module fronts.
  - version: "2.0.0"
    targetType: "url"
    target:
      url: "http://localhost:9201/_internal/network"
    endpoints:
      - discover

  # Everything transactional goes to the provider layer, and this layer decides
  # nothing about where it ends up. context.bppUri travels onward in the body
  # untouched.
  - version: "2.0.0"
    targetType: "url"
    target:
      url: "http://localhost:9201/_internal/provider"
    endpoints:
      - select
      - init
      - confirm
      - status
