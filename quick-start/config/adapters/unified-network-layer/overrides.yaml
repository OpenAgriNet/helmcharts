# Unified network layer: the consumer, network and provider tiers as modules of
# ONE adapter process (the unified single adapter).
#
# This file holds only what differs from the three tier templates beside it
# (consumer.yaml.tmpl, network.yaml.tmpl, provider.yaml.tmpl). bin/setup.py
# builds unified-network-layer.yaml from those templates plus this file, so a
# change to a tier template reaches both the multi-adapter stack and this one
# on the next run -- there is no second copy of any module to keep in step.
#
# Every module keeps its own tier identity (__CONSUMER_*__, __NETWORK_*__,
# __PROVIDER_*__): the same keys and registry rows the multi-adapter stack
# uses, so either stack can run against the same registry.

appName: network-layer-adapter
otelServiceName: network-layer-adapter
# Inside the container; published on 127.0.0.1:9200 (docker-compose.unified-network-layer.yml).
port: 9200


# Extended schema validation on for every module that validates schemas.
extendedSchemaEnabled: "true"

# Which tier-template module becomes which module here. `index` is the
# module's position in that template's `modules:` list. `routingConfig` is the
# path (inside the container) of that module's routing file; compose mounts:
#   consumer          unified-network-layer/single-network-layer-consumer-routing.yaml
#   network           routing-network.yaml (the multi-adapter file, unchanged)
#   provider-publish  unified-network-layer/single-network-layer-publish-routing.yaml
# The provider module has no router: it answers requests itself.
modules:
  - from: consumer
    index: 0
    name: consumer
    # Mounted at /, so the app calls /discover, /select, ... as it does on the
    # multi-adapter consumer-adapter. The more specific /network/, /provider/
    # and /provider/publish paths still go to their own modules.
    path: /
    routingConfig: /app/config/single-network-layer-consumer-routing.yaml
  - from: network
    index: 0
    name: network
    path: /network/
    routingConfig: /app/config/routing-network.yaml
  - from: provider
    index: 0
    name: provider
    path: /provider/
  # The provider's catalogue publishing. An exact path: stripping it leaves the
  # empty endpoint, which the routing file keys on with excludeAction.
  - from: provider
    index: 1
    name: provider-publish
    path: /provider/publish
    routingConfig: /app/config/single-network-layer-publish-routing.yaml
