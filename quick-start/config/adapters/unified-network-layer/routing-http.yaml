# Routing for the unified network layer: tier hops over HTTP to this same
# container (http://localhost), instead of in-process. Works with any adapter
# image. Selected with HTTP=1 (make up-unified-network-layer HTTP=1), which adds
# the overlay docker-compose.unified-network-layer-http.yml.
#
# localhost:9200 is the container's own listener -- it must match `port` in
# overrides.yaml. Discovery is a separate container either way.
routingRules:
  # consumer discover, and publish arriving at /network/publish
  - version: "2.0.0"
    targetType: "url"
    target:
      url: "http://discovery-service:8080"
    endpoints:
      - discover
      - publish

  # consumer -> provider tier, over loopback HTTP
  - version: "2.0.0"
    targetType: "url"
    target:
      url: "http://localhost:9200/provider"
    endpoints:
      - select
      - init
      - confirm
      - status

  # provider publish module (/provider/publish, endpoint "") -> network publish, over loopback HTTP
  - version: "2.0.0"
    targetType: "url"
    target:
      url: "http://localhost:9200/network/publish"
      excludeAction: true
    endpoints:
      - ""
