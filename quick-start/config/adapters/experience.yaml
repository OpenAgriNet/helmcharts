# consumer-adapter
#
# The caller. Signs outbound requests as oan-caller and routes them by action:
# discovery to the network layer, transactions straight to the provider adapter.
# No validateSign -- the experience app calling it is inside the trust boundary,
# so there is no network signature to check on the way in.
appName: "consumer-adapter"

log:
  level: debug
  destinations:
    - type: stdout
  contextKeys: [transaction_id, message_id, subscriber_id, module_id]

http:
  port: 9202
  timeout:
    read: 30
    write: 30
    idle: 30

pluginManager:
  root: ./plugins

# ---------------------------------------------------------------------------
# OpenTelemetry. An application-level plugin rather than a module one: it runs
# its own background lifecycle -- an exporter and a periodic flush -- instead
# of being loaded per request by a step.
#
# It ships metrics, traces and logs over OTLP/gRPC to the collector named
# below. In this stack that is ClickStack, on the observability profile, which
# `make up` starts as step 5 and `make up-core` deliberately does not.
#
# WHICH IS WHY THE ENABLE FLAGS ARE A SWITCH. With all three false the plugin
# builds no exporter at all and returns a no-op provider -- it does not dial,
# so it cannot log a connection failure every few seconds. Point a stack with
# no collector at one and that is exactly what you get, so OTEL_ENABLED=false
# is the right setting for `make up-core`.
#
# serviceVersion is deliberately absent: left empty the plugin fills in the
# adapter's own build version, which is truer than anything written here and
# does not go stale.
#
# Not set, and worth knowing they exist:
#   auditFieldsConfig  a YAML file of masking rules and field selection for
#                      audit logs -- payloads are emitted whole without it.
#   networkMetricsGranularity / networkMetricsFrequency
#                      network-level metric windows.
#   timeInterval       metric export period in seconds; defaults to 5.
plugins:
  otelsetup:
    id: otelsetup
    config:
      serviceName: "consumer-adapter"
      environment: "dev"
      otlpEndpoint: "hyperdx:4317"
      enableMetrics: "true"
      enableTracing: "true"
      enableLogs: "true"

modules:
  - name: consumer-adapter
    # A subtree: every action lands here and the payload says which one it is.
    path: /
    handler:
      type: std
      role: bap
      subscriberId: exp.oan.dev

      plugins:
        registry:
          id: sunbirdRegistry
          config:
            url: http://registry:8081/api/v1
            entity: Participant
            providerEntity: ProviderSchema

        keyManager:
          id: simplekeymanager
          config:
            subscriberId: exp.oan.dev
            # The KEY's osid, not a friendly name: that is what the registry
            # indexes keys by, and what a verifier looks up.
            keyId: 1-57ff3e99-a058-45fc-acce-fe74d3c66a8b
            signingPrivateKey: "CitM7Fp5QIjYMW8Or16dq0LDmIL/5l1wyBL6i/zRVXo="
            signingPublicKey: "gKRU8m8hlML81PSufCN1DMHKt49ebyuLnFUhI7YNo6g="
            encrPrivateKey: "EGoRQK5+ApKGNhpj80NKD4GFOn8U/WVMTgs7Oh3LhVM="
            encrPublicKey: "DU4yC1jYDPGL/U3KL0sQP4EDXvgzi7uUlFeuiQ2AkWg="

        signer:
          id: signer
        signValidator:
          id: signvalidator

        # Base Beckn v2 schema validation, against the pinned LTS spec. The
        # extended layer is off: it fetches a resource's own @context and
        # validates against that, which is a network call per payload and a
        # second failure mode, and nothing here needs it yet. The allowed
        # domains and cache settings below only take effect if it is turned on.
        schemaValidator:
          id: schemav2validator
          config:
            type: url
            location: "https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/tags/core-v2.0.0-lts/api/v2.0.0/beckn.yaml"
            cacheTTL: "3600"
            extendedSchema_enabled: "false"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "raw.githubusercontent.com,schema.beckn.io,schema.nfh.global,openagrinet.github.io"

        router:
          id: router
          config:
            routingConfig: /app/config/routing-experience.yaml

      steps:
        - validateSchema
        - addRoute
        - sign
