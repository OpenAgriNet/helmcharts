# The whole OpenTelemetry Collector for this stack: OTLP ingest from the
# adapters and discovery-service, container-log collection, and the
# ClickHouse export both land in. Unlike the HyperDX image this replaces,
# there is no base config supplied by an upstream vendor and merged with this
# one over OpAMP -- this file is the entire pipeline, so nothing here is
# coupled to a name some other party's release could rename out from under
# it.
#
# docker-compose.yml mounts this read-only and passes it with
# --config=/etc/otelcol-contrib/config.yaml.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Container stdout, read straight from Docker's own json-file driver output
  # -- the same approach config/observability/filelog.yaml used against
  # HyperDX's embedded collector, carried over almost unchanged. See
  # docker-compose.yml's `otel-collector` service for the bind mount this
  # reads and its two-cause "no logs arrive" checklist.
  filelog/containers:
    # IDs in the path, not names -- which is the whole reason
    # docker-compose.yml's x-logging anchor sets the `labels` log-opt: the
    # container name is nowhere in this file, and a log console keyed by 64
    # hex characters is not a log console.
    include: [/var/lib/docker/containers/*/*-json.log]

    # Rotated files. Without this the collector re-reads a whole rotation as
    # if it were new output every time the driver rolls one over.
    exclude: [/var/lib/docker/containers/*/*-json.log.*]

    # END, not beginning. `up -d` on a stack that has been running for days
    # would otherwise replay every line any container ever wrote, all
    # stamped correctly, all arriving at once -- which reads as an incident.
    #
    # The cost is that lines written while the collector is down are lost.
    # That is the right trade for a console: the recovery is `docker logs`,
    # which still works, because this reads the same files it reads.
    start_at: end

    operators:
      # Docker wraps each line: {"log":"...","stream":"stdout","time":"..."}.
      - type: json_parser
        timestamp:
          parse_from: attributes.time
          # Docker writes RFC3339 with nanoseconds. gotime rather than
          # strptime because %f is microseconds and would truncate.
          layout_type: gotime
          layout: '2006-01-02T15:04:05.999999999Z07:00'

      # The collector's own output, dropped BEFORE anything downstream sees
      # it.
      #
      # Not tidiness: this collector logs a line per export, and exporting
      # that line is another export. Left in, the loop is self-sustaining
      # and the only symptom is that ClickHouse fills up. The service name
      # to exclude is `otel-collector` -- this container's own compose
      # service name -- not `hyperdx`, which is what the old overlay
      # excluded.
      - type: filter
        # Bracket access throughout, and the nil guard spelled out. `?.` does
        # not parse against a bracket index in this expression language --
        # the collector refuses to build the pipeline without this guard,
        # which the (absent, on this image) health_check-based Docker probe
        # would otherwise be what catches.
        expr: 'attributes["attrs"] != nil and attributes["attrs"]["com.docker.compose.service"] == "otel-collector"'

      # The compose service name becomes service.name, which is what a
      # Grafana panel filters on. Everything else is an attribute you have
      # to know to search for.
      - type: move
        from: attributes.attrs["com.docker.compose.service"]
        to: resource["service.name"]
        if: 'attributes["attrs"] != nil and attributes["attrs"]["com.docker.compose.service"] != nil'

      # stdout or stderr. Kept, and kept OUT of severity: a Go service
      # writing its structured logs to stderr is not a service in trouble,
      # and mapping the stream onto a level is how every line from such a
      # service becomes an error. The `transform/logs` processor below reads
      # the real level out of the JSON body, which is where it actually is.
      - type: move
        from: attributes.stream
        to: attributes["log.iostream"]

      # The raw line becomes the body. LAST of the moves, because
      # `transform/logs` parses JSON out of the body -- so a Go service's
      # zap output arrives with its own fields promoted to attributes, and a
      # plain-text line from Postgres arrives as text.
      - type: move
        from: attributes.log
        to: body

      # Already on the record as its timestamp; a second copy is a column
      # that disagrees with itself the moment either is rewritten.
      - type: remove
        field: attributes.time

  # ---------------------------------------------------------------------
  # Pull-based receivers. Unlike otlp and filelog above, these two go and ask
  # rather than being sent to -- which is the only way to get numbers out of
  # components that will never speak OTLP: Postgres and the container runtime
  # itself. Neither needs a change to any service.
  #
  # Both are deliberately slower than the 10s default. A metric is a level
  # sampled on a clock, and at 10s across eleven containers the sample rate
  # dominates the storage bill without making any graph more truthful.
  # ---------------------------------------------------------------------

  # Two instances because the receiver takes one endpoint each, and this stack
  # runs two unrelated databases. Answers the half of "is the pool about to
  # fall over" that the in-process pgxpool counter cannot see: pgxpool measures
  # waits inside discovery-service, this measures what the server thinks is
  # connected.
  postgresql/discovery:
    endpoint: discovery-postgres:5432
    # Hardcoded in docker-compose.yml rather than read from .env -- see the
    # comment on the discovery-postgres service for why that is tolerable.
    username: discovery
    password: discovery
    databases: [discovery]
    collection_interval: 30s
    tls:
      # No TLS between containers on oan-internal, and the receiver refuses to
      # connect rather than silently downgrading, so this has to be explicit.
      insecure: true

  postgresql/registry:
    endpoint: sunbird-registry-postgres:5432
    username: ${env:REGISTRY_DB_USER}
    password: ${env:REGISTRY_DB_PASSWORD}
    databases: ["${env:REGISTRY_DB_NAME}"]
    collection_interval: 30s
    tls:
      insecure: true

  # Per-container CPU, memory, network and block IO for everything compose is
  # running -- the resource envelope that neither a span nor a log line can
  # describe. Reads the same Docker API `docker stats` does.
  #
  # This needs the Docker socket mounted into this container, which is a real
  # privilege: the socket is root-equivalent on the host, and read-only on the
  # bind mount does NOT constrain what the API allows. It is defensible here
  # because this is a local quick-start on a developer machine. Do not carry
  # this receiver into a deployed environment without replacing it with
  # something scoped -- cAdvisor, or kubelet's own stats endpoint under
  # Kubernetes, where this receiver is the wrong tool anyway.
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s
    # Names only, so a series is keyed by something a human recognises rather
    # than by 64 hex characters -- the same reason the filelog receiver above
    # needs the compose `labels` log-opt.
    container_labels_to_metric_labels:
      com.docker.compose.service: container.name
    metrics:
      container.cpu.utilization:
        enabled: true
      container.memory.percent:
        enabled: true

  # hostmetrics is deliberately NOT enabled, and this is a note rather than an
  # omission. On Docker Desktop for macOS -- what this stack is developed on --
  # there is no host to measure from in here: the container runs inside a Linux
  # VM, so the receiver reports the VM's CPU and memory, not the Mac's. Making
  # it accurate needs `- /:/hostfs:ro` (the entire root filesystem, read-only)
  # plus `root_path: /hostfs`, which is a much broader mount than docker.sock
  # in exchange for a number that is still about the VM. On a Linux host it is
  # worth enabling; uncomment both this and the mount then.
  #
  # hostmetrics:
  #   collection_interval: 30s
  #   root_path: /hostfs
  #   scrapers:
  #     cpu: {}
  #     memory: {}
  #     load: {}
  #     filesystem: {}

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  batch: {}

  # Parses a JSON body into attributes and lifts a `level` field into
  # severity, so a structured log from a Go service arrives searchable by
  # severity rather than as an unparsed blob. A line that is not JSON (a
  # plain Postgres or Keycloak line) fails the `ParseJSON` guard and passes
  # through unchanged -- this is additive, not a requirement every log meet.
  transform/logs:
    log_statements:
      - context: log
        statements:
          - 'set(cache["parsed"], ParseJSON(body)) where IsMatch(body, "^\\s*\\{")'
          - 'merge_maps(attributes, cache["parsed"], "insert") where cache["parsed"] != nil'
          - 'set(severity_text, attributes["level"]) where attributes["level"] != nil'
          - 'set(severity_number, SEVERITY_NUMBER_DEBUG) where severity_text == "debug"'
          - 'set(severity_number, SEVERITY_NUMBER_INFO) where severity_text == "info"'
          - 'set(severity_number, SEVERITY_NUMBER_WARN) where severity_text == "warn" or severity_text == "warning"'
          - 'set(severity_number, SEVERITY_NUMBER_ERROR) where severity_text == "error"'
          - 'set(severity_number, SEVERITY_NUMBER_FATAL) where severity_text == "fatal" or severity_text == "panic"'

  # Pull-based receivers set no service.name -- they have no service to ask.
  # docker_stats identifies a series by container.name, postgresql by
  # server.address, and neither lands in the ServiceName column every log and
  # trace query in this stack filters on. The effect is metrics that exist but
  # are unfindable by the one key everything else is keyed by.
  #
  # `where ... == nil` matters: OTLP metrics from discovery-service already
  # carry a real service.name and must not be overwritten by the container
  # they happen to run in.
  transform/metrics_service_name:
    metric_statements:
      - context: resource
        statements:
          - 'set(attributes["service.name"], attributes["container.name"]) where attributes["service.name"] == nil and attributes["container.name"] != nil'
          - 'set(attributes["service.name"], attributes["server.address"]) where attributes["service.name"] == nil and attributes["server.address"] != nil'

extensions:
  # Docker cannot probe this on the otel-collector container -- see the "No
  # healthcheck" comment on that service in docker-compose.yml for why -- but
  # it still binds 13133 for a manual check from another container on
  # oan-internal, and it is what turns a pipeline that failed to build into
  # something observable at all rather than a silent gap in the data.
  health_check:
    endpoint: 0.0.0.0:13133

exporters:
  clickhouse:
    endpoint: ${env:CLICKHOUSE_ENDPOINT}
    database: ${env:CLICKHOUSE_DATABASE}
    username: ${env:CLICKHOUSE_USERNAME}
    password: ${env:CLICKHOUSE_PASSWORD}
    ttl: 720h
    create_schema: true
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    metrics_table_name: otel_metrics
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
    metrics:
      receivers: [otlp, postgresql/discovery, postgresql/registry, docker_stats]
      processors: [memory_limiter, transform/metrics_service_name, batch]
      exporters: [clickhouse]
    logs:
      receivers: [otlp, filelog/containers]
      processors: [memory_limiter, transform/logs, batch]
      exporters: [clickhouse]
