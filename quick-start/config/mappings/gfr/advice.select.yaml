# GFR recommendation, openagrinet:AgricultureResource, select. resourceAttributes carries
# the request fields of GFR's advice OpenAPI beside the pack's @context and @type.

required:
  - check: |
      (
        $ra := beckn.message.contract.commitments[0].resources[0].resourceAttributes;
        $v := $ra.variables;
        $exists($ra.query) and $exists($v.state) and $exists($v.results)
          and $exists($v.crops) and $exists($v.naturalFarming)
      )
    message: "this capability needs query and variables state, results, crops and naturalFarming in resourceAttributes"

# The body is SHC's GraphQL request as sent. No login is needed for it.
request: |
  (
    $ra := beckn.message.contract.commitments[0].resources[0].resourceAttributes;
    {
      "query": $ra.query,
      "variables": $ra.variables
    }
  )

# SHC's answer goes back unchanged inside resourceAttributes, the doses under
# data.getRecommendations.
response: |
  (
    $selected := beckn.message.contract.commitments[0];
    $asked := $selected.resources[0];
    {
      "context": {
        "version": beckn.context.version,
        "action": "on_select",
        "networkId": beckn.context.networkId,
        "transactionId": beckn.context.transactionId,
        "messageId": beckn.context.messageId,
        "timestamp": $now()
      },
      "message": {
        "contract": {
          "commitments": [
            {
              "status": { "descriptor": { "code": "ACTIVE", "name": "active" } },
              "resources": [
                {
                  "id": $asked.id,
                  "quantity": { "count": 1 },
                  "resourceAttributes": $merge([
                    {
                      "@context": $asked.resourceAttributes.`@context`,
                      "@type": $asked.resourceAttributes.`@type`
                    },
                    response
                  ])
                }
              ],
              "offer": $selected.offer
            }
          ]
        }
      }
    }
  )
