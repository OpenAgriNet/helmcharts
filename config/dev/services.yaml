# dev: every service in install order. ${name} reads global.yaml.
# Deploy: ./scripts/deploy.sh dev

# TLS certificates. Its CRDs are applied first (config/README.md).
cert-manager:
  chart: charts/cert-manager
  namespace: cert-manager
  values:
    cainjector:
      replicaCount: 1
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 10m
          memory: 64Mi
    crds:
      enabled: false
      keep: true
    prometheus:
      enabled: false
    replicaCount: 1
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 64Mi
    startupapicheck:
      enabled: true
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 32Mi
    webhook:
      replicaCount: 1
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 32Mi

# OpenBao's CA and server certificate.
openbao-tls:
  chart: charts/openbao-tls
  namespace: openbao
  values:
    commonLabels:
      oan.in/environment: ${environment}

# Secret store. Not ready until unsealed: first deploy with --no-wait.
openbao:
  chart: charts/openbao
  namespace: openbao
  values:
    global:
      tlsDisable: false
    injector:
      enabled: false
    server:
      auditStorage:
        enabled: true
        size: 2Gi
      authDelegator:
        enabled: true
      dataStorage:
        enabled: true
        size: 5Gi
        storageClass: null
      extraContainers:
      - args:
        - |
          f=/openbao/tls/tls.crt
          last="$(sha256sum "$f")"
          while sleep 60; do
            now="$(sha256sum "$f")"
            # -o: the oldest bao is the server; probes and `kubectl exec`
            # run short-lived bao processes too, which must not be hit.
            if [ "$now" != "$last" ] && pkill -HUP -o -x bao; then
              echo "certificate changed; sent SIGHUP to bao"
              last="$now"
            fi
          done
        command:
        - /bin/sh
        - -c
        image: quay.io/openbao/openbao:2.6.3@sha256:a60afafda36337abe833c4a63894bf1095098f29abea4091e7e555a33dd52889
        name: tls-reloader
        resources:
          limits:
            memory: 32Mi
          requests:
            cpu: 5m
            memory: 8Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /openbao/tls
          name: tls
          readOnly: true
      extraEnvironmentVars:
        BAO_CACERT: /openbao/tls/ca.crt
      image:
        registry: quay.io
        repository: openbao/openbao
        tag: 2.6.3@sha256:a60afafda36337abe833c4a63894bf1095098f29abea4091e7e555a33dd52889
      networkPolicy:
        enabled: true
        ingress:
        - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: external-secrets
          - podSelector: {}
          ports:
          - port: 8200
            protocol: TCP
        - from:
          - podSelector: {}
          ports:
          - port: 8201
            protocol: TCP
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 256Mi
      shareProcessNamespace: true
      standalone:
        config: |
          ui = true

          listener "tcp" {
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_cert_file = "/openbao/tls/tls.crt"
            tls_key_file = "/openbao/tls/tls.key"
          }

          storage "raft" {
            path = "/openbao/data"
          }

          seal "static" {
            current_key_id = "oan-${environment}-1"
            current_key = "file:///openbao/unseal/unseal.key"
          }

          audit "file" "file" {
            description = "Every request, to the audit volume"
            options {
              file_path = "/openbao/audit/audit.log"
            }
          }

          audit "file" "stdout" {
            description = "Every request, to the pod log"
            options {
              file_path = "stdout"
            }
          }
        enabled: true
      updateStrategyType: OnDelete
      volumeMounts:
      - mountPath: /openbao/unseal
        name: unseal-key
        readOnly: true
      - mountPath: /openbao/tls
        name: tls
        readOnly: true
      volumes:
      - name: unseal-key
        secret:
          defaultMode: 256
          secretName: openbao-unseal-key
      - name: tls
        secret:
          defaultMode: 288
          secretName: openbao-server-tls
    snapshotAgent:
      config:
        baoAuthPath: kubernetes
        baoRole: snapshot
        s3Bucket: oan-openbao-snapshots-${environment}
        s3ExpireDays: '14'
        s3Host: ${snapshotS3Host}
        s3Uri: s3://oan-openbao-snapshots-${environment}
      enabled: false
      extraEnvironmentVars:
        BAO_CACERT: /openbao/tls/ca.crt
      extraVolumeMounts:
      - mountPath: /openbao/tls
        name: openbao-ca
        readOnly: true
      extraVolumes:
      - name: openbao-ca
        secret:
          items:
          - key: ca.crt
            path: ca.crt
          secretName: openbao-server-tls
      image:
        repository: ghcr.io/openbao/openbao-snapshot-agent
        tag: 0.4.5@sha256:ef2c80770e30bba3fcf4d7911cb829607efcea7e7c1a917210c9fa1ba55a8249
      schedule: 0 * * * *
      serviceAccount:
        create: true
        name: openbao-snapshot
    ui:
      enabled: true
      serviceType: ClusterIP

# Copies secrets from OpenBao into Kubernetes Secrets.
external-secrets:
  chart: charts/external-secrets
  namespace: external-secrets
  values:
    commonLabels:
      oan.in/environment: ${environment}
    installCRDs: true
    serviceAccount:
      create: true
      name: external-secrets

# Mirrors a Secret into the other namespaces that read it.
reflector:
  chart: charts/reflector
  namespace: external-secrets
  values:
    commonLabels:
      oan.in/environment: ${environment}

# How external-secrets logs in to OpenBao.
openbao-cluster-secret-store:
  chart: charts/openbao-cluster-secret-store
  namespace: external-secrets
  values:
    allowedNamespaces:
    - external-secrets
    auth:
      mountPath: kubernetes
      role: external-secrets
      serviceAccount:
        name: external-secrets
        namespace: external-secrets
    caProvider:
      key: ca.crt
      name: openbao-server-tls
      namespace: openbao
      type: Secret
    commonLabels:
      oan.in/environment: ${environment}
    name: openbao
    path: secret
    server: ${openbaoUrl}
    version: v2

# Which secrets to pull, and the namespaces that get them.
openbao-secrets:
  chart: charts/openbao-secrets
  namespace: external-secrets
  values:
    prefix: oan/${environment}
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: openbao
    secrets:
    - name: registry-db
      namespaces:
      - postgres
      - registry
    - name: keycloak-db
      namespaces:
      - postgres
      - keycloak
    - name: discovery-db
      namespaces:
      - postgres
      - discovery
    - name: postgres-superuser
      namespaces:
      - postgres
    - name: keycloak-admin
      namespaces:
      - keycloak
    - name: keycloak-admin-api
      namespaces:
      - keycloak
      - registry
    - name: registry-seed
      namespaces:
      - keycloak
      - registry
    - name: registry-default-user
      namespaces:
      - registry
    - name: network-adapter-keys
      namespaces:
      - network-adapter
      - federation
    - name: provider-upstream
      namespaces:
      - network-adapter
    - name: provider-pmfby
      namespaces:
      - network-adapter
    - name: provider-pmkisan
      namespaces:
      - network-adapter
    - name: clickstack-clickhouse
      namespaces:
      - observability
    - name: grafana-admin
      namespaces:
      - observability

# Postgres operator. Its CRDs are applied first (config/README.md).
cloudnative-pg:
  chart: cloudnative-pg
  repository: https://cloudnative-pg.github.io/charts
  version: 0.29.0
  namespace: postgres
  values:
    crds:
      create: false

# Gateway and ingress controller: the public load balancer.
kong:
  chart: charts/kong
  namespace: kong
  values:
    commonLabels:
      oan.in/environment: ${environment}
    env:
      database: 'off'
    fullnameOverride: kong
    ingressController:
      enabled: true
      env:
        feature_gates: RewriteURIs=true
    proxy:
      annotations: ${loadBalancerAnnotations}
      enabled: true
      externalTrafficPolicy: Local
      type: LoadBalancer
    replicaCount: 2
    topologySpreadConstraints:
    - labelSelector:
        matchLabels:
          app.kubernetes.io/component: app
          app.kubernetes.io/instance: kong
          app.kubernetes.io/name: kong
      maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule

# Telemetry store (ClickHouse) and the HyperDX UI.
clickstack:
  chart: charts/clickstack
  namespace: observability
  values:
    clickhouse:
      config:
        users:
          existingSecret: clickstack-clickhouse
      persistence:
        dataSize: 20Gi
        enabled: true
        logSize: 5Gi
      resources:
        limits:
          cpu: '2'
          memory: 8Gi
        requests:
          cpu: 500m
          memory: 2Gi
    global:
      keepPVC: false
      storageClassName: ${storageClass}
    hyperdx:
      apiKey: ${hyperdxApiKey}
      appUrl: https://hyperdx.${domain}
      frontendUrl: https://hyperdx.${domain}
      ingress:
        annotations:
          cert-manager.io/cluster-issuer: ${clusterIssuer}
        enabled: true
        host: hyperdx.${domain}
        ingressClassName: ${ingressClassName}
        path: /
        pathType: Prefix
        tls:
          enabled: true
          secretName: hyperdx-tls
    mongodb:
      persistence:
        dataSize: 5Gi
        enabled: true
    otel:
      replicas: 1
      resources:
        limits:
          cpu: '1'
          memory: 1Gi
        requests:
          cpu: 200m
          memory: 256Mi

# Per-node collector for pod metrics.
otel-agent:
  chart: charts/otel-agent
  namespace: observability
  values:
    apiKey: ${hyperdxApiKey}
    collectionInterval: 15s
    exporter:
      endpoint: ${otelEndpoint}
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 96Mi

# Let's Encrypt issuers.
cert-manager-issuers:
  chart: charts/cert-manager-issuers
  namespace: cert-manager
  values:
    email: ${acmeEmail}
    ingressClassName: ${ingressClassName}
    issuers:
      letsencrypt-prod:
        enabled: true
        server: https://acme-v02.api.letsencrypt.org/directory
      letsencrypt-staging:
        enabled: false
        server: https://acme-staging-v02.api.letsencrypt.org/directory

# Database cluster for the registry and keycloak.
postgres:
  chart: charts/postgresql-cnpg
  namespace: postgres
  values:
    backup:
      enabled: false
    bootstrap:
      database: registry
      owner: registry
      ownerSecret: registry-db
    commonLabels:
      oan.in/environment: ${environment}
    databases:
    - name: keycloak
      owner: keycloak
    enableSuperuserAccess: false
    fullnameOverride: postgres
    image:
      registry: ''
      repository: ''
      tag: ''
    instances: 1
    managed:
      roles:
      - name: keycloak
        passwordSecret:
          name: keycloak-db

# Database for discovery, with pgvector.
discovery-db:
  chart: charts/postgresql-cnpg
  namespace: postgres
  values:
    backup:
      enabled: false
    bootstrap:
      database: discovery
      owner: discovery
      ownerSecret: discovery-db
      postInitApplicationSQL:
      - CREATE EXTENSION IF NOT EXISTS vector;
      - CREATE EXTENSION IF NOT EXISTS pg_trgm;
    commonLabels:
      oan.in/environment: ${environment}
    enableSuperuserAccess: false
    fullnameOverride: discovery-db
    image:
      registry: ghcr.io
      repository: cloudnative-pg/postgresql
      tag: 16-standard-trixie
    instances: 1
    resources:
      limits:
        cpu: '3'
        memory: 6Gi
      requests:
        cpu: '3'
        memory: 6Gi

# Login for the registry.
keycloak:
  chart: charts/keycloak
  namespace: keycloak
  values:
    admin:
      passwordSecret:
        key: keycloakAdminPassword
        name: keycloak-admin
      username: admin
    commonLabels:
      oan.in/environment: ${environment}
    database:
      host: ${postgresHost}
      name: keycloak
      passwordSecret:
        key: password
        name: keycloak-db
      port: 5432
      user: keycloak
      vendor: postgres
    realmImport:
      adminClientSecret:
        key: keycloakAdminClientSecret
        name: keycloak-admin-api
      enabled: true
      seedUserSecret:
        key: registrySeedPassword
        name: registry-seed

# Participant registry.
registry:
  chart: charts/registry
  namespace: registry
  values:
    authenticationEnabled: false
    commonLabels:
      oan.in/environment: ${environment}
    database:
      host: ${postgresHost}
      name: registry
      passwordSecret:
        key: password
        name: registry-db
      port: 5432
      user: registry
    defaultUserPasswordSecret:
      key: registryDefaultUserPassword
      name: registry-default-user
    image:
      registry: ghcr.io
      repository: sunbird-rc/sunbird-rc-core
      tag: v2.0.0
    ingress:
      annotations:
        cert-manager.io/cluster-issuer: ${clusterIssuer}
      className: ${ingressClassName}
      enabled: true
      hosts:
      - host: registry.${domain}
        paths:
        - path: /
          pathType: Prefix
      tls:
      - hosts:
        - registry.${domain}
        secretName: registry-tls
    keycloak:
      adminClientId: admin-api
      adminClientSecret:
        key: keycloakAdminClientSecret
        name: keycloak-admin-api
      clientId: registry-frontend
      realm: sunbird-rc
      url: ${keycloakUrl}
    keycloakUserSetPassword: false
    waitFor:
      keycloak: false

# Discover and publish service.
discovery:
  chart: charts/discovery
  namespace: discovery
  values:
    app:
      networkId: oan-${environment}
    becknSpec:
      url: https://raw.githubusercontent.com/OpenAgriNet/protocol-specifications-v2/refs/heads/release-0.2.0/api/v2.0.0/beckn.yaml
    commonLabels:
      oan.in/environment: ${environment}
    database:
      autoMigrate: true
      urlSecret:
        key: uri
        name: discovery-db
    envConfig:
      APP_DOMAIN: Agriculture
      APP_SUBSCRIBER_ID: discovery.oan.${environment}
      GEO_MAX_GEOMETRIES_PER_CATALOG: '131072'
      RATE_LIMIT_BURST: '4000'
      RATE_LIMIT_RPS: '2000'
      SEARCH_DEFAULT_PAGE_SIZE: '100'
      SEARCH_MAX_RADIUS_METERS: '600000'
      SEARCH_READ_DEADLINE: 10s
    extraEnv:
    - name: OTEL_EXPORTER_OTLP_HEADERS
      value: authorization=${hyperdxApiKey}
    image:
      registry: ghcr.io
      repository: openagrinet/discovery-service
      tag: 0.2.0
    ingress:
      annotations:
        cert-manager.io/cluster-issuer: ${clusterIssuer}
      className: ${ingressClassName}
      enabled: false
      hosts:
      - host: discovery.${domain}
        paths:
        - path: /
          pathType: Prefix
      tls:
      - hosts:
        - discovery.${domain}
        secretName: discovery-tls
    otel:
      endpoint: ${otelEndpoint}
      exporter: otlp
    replicaCount: 1
    resources:
      limits:
        cpu: '1'
        memory: 1Gi
      requests:
        cpu: '1'
        memory: 1Gi

# Seeds the registry: identity, upstreams, bindings, schemas.
registry-seed:
  chart: charts/registry-seed
  namespace: registry
  values:
    adapters:
    - baseUrl: https://${domain}
      name: OpenAgriNet
      networkRole:
      - consumer
      - network
      - provider
      participantId: ${domain}
      role: network
      signingPublicKey: ${adapterSigningPublicKey}
    authenticationEnabled: false
    bindings:
    - capability: openagrinet:MandiPrice
      mappingUrl: https://raw.githubusercontent.com/OpenAgriNet/helmcharts/0.1.0/quick-start/config/mappings/agmarknet/mandi-price.select.yaml
      method: GET
      participantId: agmarknet
      path: /v1/fetch-agmarknet-vistaar
      retryMax: 2
      timeoutMs: 15000
    - actions:
      - action: support
        mappingUrl: https://raw.githubusercontent.com/OpenAgriNet/helmcharts/${helmchartsRevision}/quick-start/config/mappings/pmfby/grievance.support.yaml
        method: POST
        path: /krphapi/FGMS/AddKRPHNCIPGrievenceSupportTicket
        retryMax: 0
        timeoutMs: 30000
      - action: status
        mappingUrl: https://raw.githubusercontent.com/OpenAgriNet/helmcharts/${helmchartsRevision}/quick-start/config/mappings/pmfby/grievance.status.yaml
        method: POST
        path: /krphapi/FGMS/GetGrievenceTicketsStatus
        retryMax: 2
        timeoutMs: 30000
      capability: openagrinet:Grievance
      participantId: pmfby
    - actions:
      - action: init
        mappingUrl: https://raw.githubusercontent.com/OpenAgriNet/helmcharts/${helmchartsRevision}/quick-start/config/mappings/pmkisan/grievance.init.yaml
        method: POST
        path: /ChatbotOTP
        retryMax: 0
        timeoutMs: 20000
      - action: support
        mappingUrl: https://raw.githubusercontent.com/OpenAgriNet/helmcharts/${helmchartsRevision}/quick-start/config/mappings/pmkisan/grievance.support.yaml
        method: POST
        path: /LodgeGrievance
        retryMax: 0
        timeoutMs: 30000
      - action: status
        mappingUrl: https://raw.githubusercontent.com/OpenAgriNet/helmcharts/${helmchartsRevision}/quick-start/config/mappings/pmkisan/grievance.status.yaml
        method: POST
        path: /GrievanceStatusCheck
        retryMax: 2
        timeoutMs: 30000
      capability: openagrinet:Grievance
      participantId: pmkisan
    - actions:
      - action: init
        mappingUrl: https://raw.githubusercontent.com/OpenAgriNet/helmcharts/${helmchartsRevision}/quick-start/config/mappings/pmkisan/application-status.init.yaml
        method: POST
        path: /ChatbotOTP
        retryMax: 0
        timeoutMs: 20000
      - action: status
        mappingUrl: https://raw.githubusercontent.com/OpenAgriNet/helmcharts/${helmchartsRevision}/quick-start/config/mappings/pmkisan/application-status.status.yaml
        method: POST
        path: /ChatbotUserDetails
        retryMax: 0
        timeoutMs: 30000
      baseUrl: http://mock-pmkisan-chatbot.mock-pmkisan.svc.cluster.local:9106/services/chatbotservice.asmx
      capability: openagrinet:SchemeApplication
      participantId: pmkisan
    - capability: openagrinet:WeatherObservation
      mappingUrl: https://raw.githubusercontent.com/OpenAgriNet/helmcharts/0.1.0/quick-start/config/mappings/mausamgram/weather-observation.select.yaml
      method: GET
      participantId: mausamgram
      path: /nwpapi/get-daily
      retryMax: 2
      timeoutMs: 15000
    - capability: openagrinet:KnowledgeAdvisory
      mappingUrl: https://raw.githubusercontent.com/OpenAgriNet/helmcharts/0.1.0/quick-start/config/mappings/knowledge/knowledge-advisory.select.yaml
      method: POST
      participantId: bharat-vistaar
      path: /docs-pipeline-api/search
      retryMax: 2
      timeoutMs: 15000
    - capability: openagrinet:AgricultureFacility
      mappingUrl: https://raw.githubusercontent.com/OpenAgriNet/helmcharts/0.1.0/quick-start/config/mappings/pocra/agriculture-facility.select.yaml
      method: POST
      participantId: pocra
      path: /search
      retryMax: 2
      timeoutMs: 15000
    commonLabels:
      oan.in/environment: ${environment}
    keycloak:
      clientId: registry-frontend
      realm: sunbird-rc
      url: ${keycloakUrl}
    registry:
      url: ${registryUrl}
    schemaPackRef: main
    schemas:
    - capability: openagrinet:WeatherObservation
      name: Weather Observation
      version: v0.1
    - capability: openagrinet:MandiPrice
      name: Mandi Price
      version: v0.1
    - capability: openagrinet:KnowledgeAdvisory
      name: Knowledge Advisory
      version: v0.1
    - capability: openagrinet:AgricultureFacility
      name: Agriculture Facility
      version: v0.1
    seedUser:
      passwordSecret:
        key: registrySeedPassword
        name: registry-seed
      username: no-user
    upstreams:
    - baseUrl: http://mock-upstream.mock-upstream.svc.cluster.local
      name: Agmarknet Vistaar
      participantId: agmarknet
    - baseUrl: https://pmfbydemo.amnex.co.in
      name: PMFBY grievance
      participantId: pmfby
    - baseUrl: http://mock-pmkisan.mock-pmkisan.svc.cluster.local:9102
      name: PM-KISAN
      participantId: pmkisan
    - baseUrl: http://mock-upstream.mock-upstream.svc.cluster.local
      name: IMD Mausamgram NWP
      participantId: mausamgram
    - baseUrl: http://mock-upstream.mock-upstream.svc.cluster.local
      name: Bharat Vistaar knowledge retrieval
      participantId: bharat-vistaar
    - baseUrl: http://mock-upstream.mock-upstream.svc.cluster.local
      name: POCRA agriculture facilities
      participantId: pocra

# Beckn adapter. single-adapter mode runs all three tiers here.
network-adapter:
  chart: charts/adapter-service
  namespace: network-adapter
  values:
    adapterKeys:
      extraSubstitutions:
        __AGMARKNET_TOKEN_URL__: provider/agmarknetTokenUrl
        __PMFBY_TOKEN_URL__: provider/pmfbyTokenUrl
        __VISTAAR_TOKEN_URL__: provider/vistaarTokenUrl
    commonLabels:
      oan.in/environment: ${environment}
    deploymentMode: single-adapter
    envFromSecrets:
    - provider-pmfby
    - provider-pmkisan
    extraEnv:
    - name: OTEL_EXPORTER_OTLP_HEADERS
      value: authorization=${hyperdxApiKey}
    - name: OTEL_EXPORTER_OTLP_INSECURE
      value: 'true'
    federation:
      enabled: true
      intent: '{"filters": {"type": "jsonpath", "expression": "$.catalogs[*] ? (@.isActive == true)"}}'
      refreshSeconds: 60
    fullnameOverride: network-adapter
    image:
      registry: ghcr.io
      repository: openagrinet/network-adapter
      tag: 0.2.0
    ingress:
      allowUnsignedMounts: true
      className: ${ingressClassName}
      enabled: true
      routes:
      - annotations:
          cert-manager.io/cluster-issuer: ${clusterIssuer}
          konghq.com/rewrite: /network/discover
        hosts:
        - host: ${domain}
          paths:
          - path: /discover
            pathType: Exact
        name: network
        tls:
        - hosts:
          - ${domain}
          secretName: network-adapter-tls
      - annotations:
          konghq.com/rewrite: /publish
        hosts:
        - host: ${domain}
          paths:
          - path: /publish
            pathType: Exact
        name: network-publish
      - annotations:
          konghq.com/rewrite: /consumer/discover
        hosts:
        - host: ${domain}
          paths:
          - path: /consumer/discover
            pathType: Exact
        name: consumer-discover
      - annotations:
          konghq.com/rewrite: /consumer/select
        hosts:
        - host: ${domain}
          paths:
          - path: /consumer/select
            pathType: Exact
        name: consumer-select
      - annotations:
          konghq.com/rewrite: /consumer/init
        hosts:
        - host: ${domain}
          paths:
          - path: /consumer/init
            pathType: Exact
        name: consumer-init
      - annotations:
          konghq.com/rewrite: /consumer/confirm
        hosts:
        - host: ${domain}
          paths:
          - path: /consumer/confirm
            pathType: Exact
        name: consumer-confirm
      - annotations:
