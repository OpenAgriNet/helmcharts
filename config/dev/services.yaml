# Publishes this network's identity to other networks.
federation:
  chart: charts/federation
  namespace: federation
  values:
    admissions: []
    commonLabels:
      oan.in/environment: ${environment}
    ingress:
      className: ${ingressClassName}
      enabled: true
      hosts:
      - host: ${domain}
        paths:
        - path: /.well-known/openagrinet
          pathType: Exact
        - path: /.well-known/jwks.json
          pathType: Exact
        - path: /.well-known/schema-packs.json
          pathType: Exact
    keys:
      existingSecret:
        name: network-adapter-keys
    networkId: ${domain}
    operator: OpenAgriNet
    projectionTtl: '86400'
    registryUrl: ${registryUrl}

# Dashboards over ClickHouse.
grafana:
  chart: charts/grafana
  namespace: observability
  values:
    admin:
      existingSecret: grafana-admin
      passwordKey: admin-password
      userKey: admin-user
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
        - access: proxy
          editable: false
          isDefault: true
          jsonData:
            defaultDatabase: default
            host: ${clickhouseHost}
            logs:
              contextColumns:
              - ServiceName
              - TraceId
              defaultDatabase: default
              defaultTable: otel_logs
              levelColumn: SeverityText
              messageColumn: Body
              otelEnabled: true
              otelVersion: latest
              selectContextColumns: true
              timeColumn: Timestamp
            port: 9000
            protocol: native
            traces:
              defaultDatabase: default
              defaultTable: otel_traces
              durationTimeColumn: Duration
              durationUnit: nanoseconds
              flattenNested: false
              instrumentationLibraryNameColumn: ScopeName
              instrumentationLibraryVersionColumn: ScopeVersion
              kindColumn: SpanKind
              operationNameColumn: SpanName
              otelEnabled: true
              otelVersion: latest
              parentSpanIdColumn: ParentSpanId
              serviceNameColumn: ServiceName
              serviceTagsColumn: ResourceAttributes
              spanIdColumn: SpanId
              startTimeColumn: Timestamp
              statusCodeColumn: StatusCode
              statusMessageColumn: StatusMessage
              tagsColumn: SpanAttributes
              traceEventsColumnPrefix: Events
              traceIdColumn: TraceId
              traceLinksColumnPrefix: Links
            username: app
          name: ClickHouse
          secureJsonData:
            password: $__env{CLICKHOUSE_PASSWORD}
          type: grafana-clickhouse-datasource
          uid: clickhouse
        deleteDatasources:
        - name: ClickHouse
          orgId: 1
    deploymentStrategy:
      type: Recreate
    envValueFrom:
      CLICKHOUSE_PASSWORD:
        secretKeyRef:
          key: appUserPassword
          name: clickstack-clickhouse
    grafana.ini:
      server:
        root_url: https://grafana.${domain}/
    ingress:
      annotations:
        cert-manager.io/cluster-issuer: ${clusterIssuer}
      enabled: true
      hosts:
      - grafana.${domain}
      ingressClassName: ${ingressClassName}
      tls:
      - hosts:
        - grafana.${domain}
        secretName: grafana-tls
    persistence:
      enabled: true
      size: 5Gi
      type: pvc
    plugins:
    - grafana-clickhouse-datasource@4.21.3
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    sidecar:
      alerts:
        enabled: true
        label: grafana_alert
        labelValue: '1'
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: '1'
        provider:
          folder: OAN

# OAN dashboards and alerts for grafana.
grafana-provisioning:
  chart: charts/grafana-provisioning
  namespace: observability
  values:
    alerting:
      files:
        notifications:
          enabled: false
