# OTel Collector, the only writer to ClickHouse. Replaces clickstack and
# otel-agent: turn those off when this is on.
otel-collector:
  chart: charts/opentelemetry-collector
  namespace: observability
  values:
    config:
      exporters:
        clickhouse:
          create_schema: true
          database: otel
          endpoint: tcp://clickhouse.observability.svc.cluster.local:9000
          logs_table_name: otel_logs
          metrics_table_name: otel_metrics
          password: ${env:CLICKHOUSE_PASSWORD}
          retry_on_failure:
            enabled: true
            initial_interval: 5s
            max_elapsed_time: 300s
            max_interval: 30s
          timeout: 10s
          traces_table_name: otel_traces
          ttl: 720h
          username: otel
      processors:
        transform/logs:
          error_mode: ignore
          log_statements:
          - context: log
            statements:
            - set(cache["parsed"], ParseJSON(body)) where IsMatch(body, "^\\s*\\{")
            - merge_maps(attributes, cache["parsed"], "insert") where cache["parsed"] != nil
            - set(severity_text, attributes["level"]) where attributes["level"] != nil
            - set(severity_number, SEVERITY_NUMBER_DEBUG) where severity_text == "debug"
            - set(severity_number, SEVERITY_NUMBER_INFO) where severity_text == "info"
            - set(severity_number, SEVERITY_NUMBER_WARN) where severity_text == "warn" or severity_text == "warning"
            - set(severity_number, SEVERITY_NUMBER_ERROR) where severity_text == "error"
            - set(severity_number, SEVERITY_NUMBER_FATAL) where severity_text == "fatal" or severity_text == "panic"
      receivers:
        kubeletstats:
          collection_interval: 30s
          insecure_skip_verify: true
          metric_groups:
          - node
          - pod
          - container
      service:
        pipelines:
          logs:
            exporters:
            - clickhouse
            processors:
            - memory_limiter
            - transform/logs
            - batch
            receivers:
            - otlp
          metrics:
            exporters:
            - clickhouse
            processors:
            - memory_limiter
            - batch
            receivers:
            - otlp
          traces:
            exporters:
            - clickhouse
            processors:
            - memory_limiter
            - batch
            receivers:
            - otlp
    extraEnvs:
    - name: CLICKHOUSE_PASSWORD
      valueFrom:
        secretKeyRef:
          key: password
          name: clickhouse-otel
    fullnameOverride: otel-collector
    image:
      repository: otel/opentelemetry-collector-contrib
    mode: daemonset
    ports:
      jaeger-compact:
        enabled: false
      jaeger-grpc:
        enabled: false
      jaeger-thrift:
        enabled: false
      otlp:
        hostPort: 0
      otlp-http:
        hostPort: 0
      zipkin:
        enabled: false
    presets:
      kubeletMetrics:
        enabled: true
      kubernetesAttributes:
        enabled: true
      logsCollection:
        enabled: true
    service:
      enabled: true

# Dashboards over ClickHouse.
grafana:
  chart: charts/grafana
  namespace: observability
  values:
    admin:
      existingSecret: grafana-admin
      passwordKey: admin-password
      userKey: admin-user
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
        - access: proxy
          editable: false
          isDefault: true
          jsonData:
            defaultDatabase: default
            host: *clickhouseHost
            logs:
              contextColumns:
              - ServiceName
              - TraceId
              defaultDatabase: default
              defaultTable: otel_logs
              levelColumn: SeverityText
              messageColumn: Body
              otelEnabled: true
              otelVersion: latest
              selectContextColumns: true
              timeColumn: Timestamp
            port: 9000
            protocol: native
            traces:
              defaultDatabase: default
              defaultTable: otel_traces
              durationTimeColumn: Duration
              durationUnit: nanoseconds
              flattenNested: false
              instrumentationLibraryNameColumn: ScopeName
              instrumentationLibraryVersionColumn: ScopeVersion
              kindColumn: SpanKind
              operationNameColumn: SpanName
              otelEnabled: true
              otelVersion: latest
              parentSpanIdColumn: ParentSpanId
              serviceNameColumn: ServiceName
              serviceTagsColumn: ResourceAttributes
              spanIdColumn: SpanId
              startTimeColumn: Timestamp
              statusCodeColumn: StatusCode
              statusMessageColumn: StatusMessage
              tagsColumn: SpanAttributes
              traceEventsColumnPrefix: Events
              traceIdColumn: TraceId
              traceLinksColumnPrefix: Links
            username: app
          name: ClickHouse
          secureJsonData:
            password: $__env{CLICKHOUSE_PASSWORD}
          type: grafana-clickhouse-datasource
          uid: clickhouse
        deleteDatasources:
        - name: ClickHouse
          orgId: 1
    deploymentStrategy:
      type: Recreate
    envValueFrom:
      CLICKHOUSE_PASSWORD:
        secretKeyRef:
          key: appUserPassword
          name: clickstack-clickhouse
    grafana.ini:
      server:
        root_url: https://grafana.${domain}/
    ingress:
      annotations:
        cert-manager.io/cluster-issuer: *clusterIssuer
      enabled: true
      hosts:
      - grafana.${domain}
      ingressClassName: *ingressClassName
      tls:
      - hosts:
        - grafana.${domain}
        secretName: grafana-tls
    persistence:
      enabled: true
      size: 5Gi
      type: pvc
    plugins:
    - grafana-clickhouse-datasource@4.21.3
    sidecar:
      alerts:
        enabled: true
        label: grafana_alert
        labelValue: '1'
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: '1'
        provider:
          folder: OAN

# OAN dashboards and alerts for grafana.
grafana-provisioning:
  chart: charts/grafana-provisioning
  namespace: observability
  values:
    alerting:
      files:
        notifications:
          enabled: false

# --- knowledge-provider: document ingestion (OCR, translation, chunking, vector
#     indexing), orchestrated by Temporal. Auth off and no ingress until the
#     domain is set.

# Keycloak's database. CNPG writes the password into knowledge-provider-keycloak-db-app.
knowledge-provider-keycloak-db:
  chart: charts/postgresql-cnpg
  namespace: knowledge-provider
  values:
    fullnameOverride: knowledge-provider-keycloak-db
    image:
      registry: ''
      repository: ''
      tag: ''
    instances: 1
    affinity:
      enablePodAntiAffinity: false
    storage:
      size: 1Gi
      storageClass: ''
    walStorage:
      enabled: false
    bootstrap:
      database: keycloak
      owner: keycloak
    commonLabels:
      oan.in/environment: *environment

# Temporal's database. temporal_visibility is created by Temporal on first
# boot, hence CREATEDB.
knowledge-provider-temporal-db:
  chart: charts/postgresql-cnpg
  namespace: knowledge-provider
  values:
    fullnameOverride: knowledge-provider-temporal-db
    image:
      registry: ''
      repository: ''
      tag: ''
    instances: 1
    affinity:
      enablePodAntiAffinity: false
    storage:
      size: 1Gi
      storageClass: ''
    walStorage:
      enabled: false
    bootstrap:
      database: temporal
      owner: temporal
      postInitApplicationSQL:
      - ALTER ROLE temporal CREATEDB;
    commonLabels:
      oan.in/environment: *environment

# knowledge-provider's own Keycloak (email-OTP 2FA image), separate from the registry's.
knowledge-provider-keycloak:
  chart: charts/knowledge-provider-keycloak
  namespace: knowledge-provider
  values:
    image:
      registry: ghcr.io
      repository: openagrinet/knowledge-provider-keycloak
      tag: v0.2.0
    hostname: localhost
    database:
      host: knowledge-provider-keycloak-db-rw
    commonLabels:
      oan.in/environment: *environment

knowledge-provider-temporal:
  chart: charts/knowledge-provider-temporal
  namespace: knowledge-provider
  values:
    database:
      host: knowledge-provider-temporal-db-rw
    commonLabels:
      oan.in/environment: *environment

# Release name minio: the api and worker reach it as `minio`. The bucket is a
# directory made before the server starts (the bucket-init Job needs minio/mc,
# which is no longer pullable).
knowledge-provider-minio:
  chart: charts/minio
  namespace: knowledge-provider
  releaseName: minio
  values:
    command:
    - sh
    - -c
    - mkdir -p /data/documents && exec minio server /data --console-address ":9001"
    persistence:
      size: 10Gi
    commonLabels:
      oan.in/environment: *environment

# Release name qdrant: the api and worker reach it as `qdrant`. The DEV vector index.
knowledge-provider-qdrant:
  chart: charts/qdrant
  namespace: knowledge-provider
  releaseName: qdrant
  values:
    persistence:
      size: 5Gi
    commonLabels:
      oan.in/environment: *environment

# Owns the sqlite, documents and hf-cache volumes the worker mounts too.
knowledge-provider-api:
  chart: charts/knowledge-provider-api
  namespace: knowledge-provider
  values:
    image:
      registry: ghcr.io
      repository: openagrinet/knowledge-provider
      tag: v0.2.0
    keycloak:
      authDisabled: true
    envConfig:
      LOG_LEVEL: debug
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      OCR_PROVIDER: mock
    ingress:
      enabled: false
    commonLabels:
      oan.in/environment: *environment

# Same image as the api, as a Temporal worker. Pinned to the api's node: the
# shared volumes are ReadWriteOnce (gp3), which two pods share only on one node.
knowledge-provider-worker:
  chart: charts/knowledge-provider-worker
  namespace: knowledge-provider
  values:
    image:
      registry: ghcr.io
      repository: openagrinet/knowledge-provider
      tag: v0.2.0
    envConfig:
      LOG_LEVEL: debug
      OCR_PROVIDER: mock
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: knowledge-provider-api
              app.kubernetes.io/instance: knowledge-provider-api
          topologyKey: kubernetes.io/hostname
    commonLabels:
      oan.in/environment: *environment

knowledge-provider-ui:
  chart: charts/knowledge-provider-ui
  namespace: knowledge-provider
  values:
    image:
      registry: ghcr.io
      repository: openagrinet/knowledge-provider-ui
      tag: v0.2.0
    ingress:
      enabled: false
    commonLabels:
      oan.in/environment: *environment

# --- langfuse: LLM observability. Every credential is pinned from OpenBao: left
#     to the chart they are generated with `lookup`, which Argo CD cannot see,
#     so they would rotate on every sync. The ClickHouse operator's CRDs are
#     too large for a client-side apply and are applied once, server side
#     (config/README.md).
langfuse:
  chart: charts/langfuse
  namespace: langfuse
  values:
    langfuse:
      salt:
        secretKeyRef:
          name: langfuse-app-keys
          key: salt
      encryptionKey:
        secretKeyRef:
          name: langfuse-app-keys
          key: encryption-key
      nextauth:
        secret:
          secretKeyRef:
            name: langfuse-app-keys
            key: nextauth-secret
    clickhouse:
      crdCheck: false
      auth:
        existingSecret: langfuse-clickhouse
        existingSecretKey: password
      cluster:
        storage:
          size: 20Gi
    clickhouse-operator:
      crd:
        enabled: false
    redis:
      auth:
        existingSecret: langfuse-redis
        existingSecretPasswordKey: default
        usersExistingSecret: langfuse-redis
    objectStorage:
      credentialsSecret:
        name: langfuse-minio-credentials
    s3:
      accessKeyId:
        secretKeyRef:
          name: langfuse-minio-credentials
          key: access-key
      secretAccessKey:
        secretKeyRef:
          name: langfuse-minio-credentials
          key: secret-key
