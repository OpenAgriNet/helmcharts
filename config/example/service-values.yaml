# Every service, in install order (that order is the sync wave).
#
#   chart        path in helmcharts, or the chart name with repository + version
#   namespace    where it is installed
#   values       its Helm values; *name and ${name} read global-values.yaml
#
# Optional: releaseName, targetRevision, syncWave, serverSideApply,
# ignoreDifferences. Resources go in resource-values.yaml.

# A chart from this repo.
kong:
  chart: charts/kong
  namespace: kong
  values:
    commonLabels:
      oan.in/environment: *environment
    proxy:
      type: LoadBalancer
      annotations: *loadBalancerAnnotations

# A chart from a Helm repository.
cloudnative-pg:
  chart: cloudnative-pg
  repository: https://cloudnative-pg.github.io/charts
  version: 0.29.0
  namespace: postgres
  values:
    crds:
      create: false

# ${name} inside a longer string, where an alias cannot reach.
discovery:
  chart: charts/discovery
  namespace: discovery
  values:
    app:
      networkId: oan-${environment}
    otel:
      endpoint: *otelEndpoint
    ingress:
      enabled: true
      className: *ingressClassName
      annotations:
        cert-manager.io/cluster-issuer: *clusterIssuer
      hosts:
      - host: ${domain}
        paths:
        - path: /
          pathType: Prefix
      tls:
      - hosts:
        - discovery.${domain}
        secretName: discovery-tls
