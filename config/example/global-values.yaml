# example: values many services share. Each is an anchor: service-values.yaml
# reads it as *name, or ${name} inside a longer string.
#
# A template, not an environment. Copy it and fill in the placeholders:
#
#   cp -r config/example config/dev     # config/*/ is gitignored, except example/
global:
  # Names the environment: labels, and the OpenBao path secret/oan/<environment>/.
  environment: &environment example
  # Every public hostname is built from this, e.g. <nlb-ip>.sslip.io.
  domain: &domain oan.example.org
  # The helmcharts revision the seeded mapping URLs read from.
  helmchartsRevision: &helmchartsRevision main

  # In-cluster addresses, one per service other services call.
  registryUrl: &registryUrl http://registry.registry.svc.cluster.local:8081
  keycloakUrl: &keycloakUrl http://keycloak.keycloak.svc.cluster.local:8080/auth
  postgresHost: &postgresHost postgres-rw.postgres.svc.cluster.local
  openbaoUrl: &openbaoUrl https://openbao.openbao.svc.cluster.local:8200
  otelEndpoint: &otelEndpoint clickstack-otel-collector.observability.svc.cluster.local:4317
  clickhouseHost: &clickhouseHost clickstack-clickhouse.observability.svc.cluster.local

  ingressClassName: &ingressClassName kong
  clusterIssuer: &clusterIssuer letsencrypt-prod
  # Let's Encrypt sends expiry notices here.
  acmeEmail: &acmeEmail ops@example.org
  # Placeholder. Set the real key under global: in argocd.yaml.
  hyperdxApiKey: &hyperdxApiKey xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  # Public half of network-adapter-keys (signingPublicKey in the secrets file),
  # seeded into the registry.
  adapterSigningPublicKey: &adapterSigningPublicKey REPLACE-with-signingPublicKey

  # --- Cloud specific. On a k3s VM see config/README.md.
  # Only clickstack names it; the rest use the cluster default.
  storageClass: &storageClass gp3
  loadBalancerAnnotations: &loadBalancerAnnotations
    # Elastic IPs pin the NLB address, one per AZ, ordered by AZ. Without them
    # AWS assigns the IPs for the life of the load balancer.
    # service.beta.kubernetes.io/aws-load-balancer-eip-allocations: eipalloc-aaaa,eipalloc-bbbb
    service.beta.kubernetes.io/aws-load-balancer-internal: 'false'
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
  # OpenBao snapshots go to S3.
  snapshotS3Host: &snapshotS3Host s3.ap-south-1.amazonaws.com
