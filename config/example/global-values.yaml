# Values many services share. Each is an anchor: service-values.yaml reads it
# as *name, or ${name} inside a longer string.
global:
  # Labels, and the OpenBao path secret/oan/<environment>/.
  environment: &environment example
  # Every public hostname is built from this.
  domain: &domain oan.example.org

  # In-cluster addresses other services call.
  otelEndpoint: &otelEndpoint otel-collector.observability.svc.cluster.local:4317

  ingressClassName: &ingressClassName kong
  clusterIssuer: &clusterIssuer letsencrypt-prod

  # A map works too, used as the whole value.
  loadBalancerAnnotations: &loadBalancerAnnotations
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
