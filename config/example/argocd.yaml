# Argo CD settings and which services run. Copy this folder to config/<env>
# (gitignored), fill it in, then: ./scripts/deploy.sh <env>
environment: example

# On/off per service. Not listed means on; turning one off deletes it (prune).
applications:
  kong: true
  cloudnative-pg: true
  discovery: false

argocd:
  # The helmcharts branch or tag the charts are read from.
  targetRevision: main
