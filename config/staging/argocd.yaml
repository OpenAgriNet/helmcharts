# staging: the root Argo CD Application. It renders the config/ chart for staging,
# which creates one Application per service in config/staging/service-values.yaml.
#
#   kubectl apply -f config/staging/argocd.yaml
#
# staging tracks main.
# Both targetRevision lines must match: one is where this chart is read from,
# the other where the service charts are.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oan-staging
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/OpenAgriNet/helmcharts.git
    targetRevision: main
    path: config
    helm:
      valuesObject:
        environment: staging
        # On/off per service, in install order. Turning one off deletes it
        # (prune). Not listed means on.
        applications:
          cert-manager: true
          openbao-tls: true
          openbao: true
          external-secrets: true
          reflector: true
          metrics-server: false  # kubectl top; the benchmark needs it
          openbao-cluster-secret-store: true
          openbao-secrets: true
          cloudnative-pg: true
          kong: true
          clickstack: true
          otel-agent: true
          cert-manager-issuers: true
          postgres: true
          discovery-db: true
          keycloak: true
          registry: true
          discovery: true
          registry-seed: true
          consumer-adapter: false  # multi-adapter only: needs network-adapter's multi-adapter values
          network-adapter: true
          provider-adapter: false  # multi-adapter only: needs network-adapter's multi-adapter values
          federation: true
          otel-collector: false  # replaces clickstack and otel-agent; turn those off with it
          grafana: true
          grafana-provisioning: true
        argocd:
          targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
