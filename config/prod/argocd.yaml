# prod: the root Argo CD Application. It renders the config/ chart for prod,
# which creates one Application per service in config/prod/service-values.yaml.
#
#   kubectl apply -f config/prod/argocd.yaml
#
# prod should track a TAG, so a deploy is deliberate. Pin it to the first
# release tag that contains config/.
# Both targetRevision lines must match: one is where this chart is read from,
# the other where the service charts are.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oan-prod
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/OpenAgriNet/helmcharts.git
    targetRevision: main
    path: config
    helm:
      valuesObject:
        environment: prod
        # On/off per service, in install order. Turning one off deletes it
        # (prune). Not listed means on.
        applications:
          cert-manager: true
          openbao-tls: true
          openbao: true
          external-secrets: true
          reflector: true
          metrics-server: true  # kubectl top; the benchmark needs it
          openbao-cluster-secret-store: true
          openbao-secrets: true
          cloudnative-pg: true
          kong: true
          clickstack: true
          otel-agent: true
          cert-manager-issuers: true
          postgres: true
          discovery-db: true
          keycloak: true
          registry: true
          discovery: true
          registry-seed: true
          consumer-adapter: true  # multi-adapter only: needs network-adapter's multi-adapter values
          network-adapter: true
          provider-adapter: true  # multi-adapter only: needs network-adapter's multi-adapter values
          federation: true
          otel-collector: false  # replaces clickstack and otel-agent; turn those off with it
          grafana: false
          grafana-provisioning: false
        argocd:
          targetRevision: main
        # Not committed: set once known (see config/README.md).
        global:
          adapterSigningPublicKey: null
          snapshotRoleArn: null
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
