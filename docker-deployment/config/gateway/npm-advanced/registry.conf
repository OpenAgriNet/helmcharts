# NOT loaded automatically. Paste into the registry proxy host's Advanced tab
# ("Custom Nginx Configuration"), then Save.
#
# It reduces a host that would otherwise forward the whole registry API to the
# two endpoints a network peer actually needs, and 403s everything else.
#
# ---------------------------------------------------------- why an allowlist
#
# Because a denylist here fails open. SunbirdRC uses POST for both search and
# create -- POST /api/v1/Participant/search reads, POST /api/v1/Participant
# writes -- so no method rule separates them, and a list of paths to block is
# a list someone has to keep complete forever.
#
# NPM gives no clean way to say "only these paths". Its generated `location /`
# catches everything, and a second `location /` in this box is a duplicate
# that nginx refuses to start on. Exact-match `location =` blocks can only
# subtract, which is the denylist again.
#
# So the decision happens in the rewrite phase, before location matching, with
# the one `if` construction that is documented as safe: `if` containing
# nothing but `return`. Default deny, then name what is allowed.
#
# --------------------------------------------------------------- what is not
#
# This is a path filter, not authentication. It does not stop anyone who
# reaches it from reading the full participant list -- public keys, baseUrls,
# who is on this network -- because that is precisely what search returns.
# Pair it with an NPM Access List (Satisfy Any OFF) if that list is not
# something you would publish.

set $registry_allowed 0;

# The Beckn-facing reads. Both are POST with a filter body; the (\?|$) anchor
# keeps /searchsomething from matching the prefix.
if ($request_uri ~ "^/api/v1/(Participant|ProviderSchema)/search(\?|$)") {
    set $registry_allowed 1;
}

# Belt and braces: search is POST, and anything else arriving at that path is
# not the call this host exists to serve.
if ($request_method != POST) {
    set $registry_allowed 0;
}

if ($registry_allowed = 0) {
    return 403;
}
