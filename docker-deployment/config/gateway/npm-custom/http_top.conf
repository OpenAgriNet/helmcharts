# Included by NPM at the TOP of its http block, automatically, from
# /data/nginx/custom/http_top.conf. No UI step -- this file being mounted is
# the whole configuration.
#
# http_top rather than http.conf because a limit_req_zone has to be declared
# before any server block that references it, and NPM's generated proxy hosts
# are server blocks.

# The rate-limit bucket for the experience layer. Declaring the zone costs
# nothing until a server block opts in with `limit_req` -- which is a per-host
# decision and therefore lives in that host's Advanced tab, not here. See
# config/gateway/npm-advanced/exp.conf.
#
# 10 r/s per address with a burst of 20 absorbs a Postman collection run while
# still bounding what is, at bottom, an open relay into the network: /exp/
# takes UNSIGNED requests, so anyone who reaches it can originate one as this
# deployment's consumer.
limit_req_zone $binary_remote_addr zone=exp:10m rate=10r/s;

# 503 says "the server is unwell"; 429 says "you are going too fast", which is
# what actually happened and the only one of the two a client can act on.
limit_req_status 429;
