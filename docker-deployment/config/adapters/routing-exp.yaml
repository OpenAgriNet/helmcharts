# Experience layer adapter routing.
#
# Branches by action: discovery goes to the network layer, everything
# transactional goes straight to the provider adapter. For v2.x the router
# ignores domain and matches on version and endpoint alone.
#
# targetType "url" appends the action to the path, so the base here is the
# module mount point and /discover or /select is added to it.
routingRules:
  - version: "2.0.0"
    targetType: "url"
    target:
      url: "http://network-adapter:9201/oan"
    endpoints:
      - discover
      # Publishing a catalogue also goes to the network layer, which is what
      # fronts the discovery service. It enters here so a publisher does not
      # have to sign for itself: this adapter takes unsigned calls from inside
      # the trust boundary and signs on the way out. A publisher that can sign
      # may post to the network adapter's /oan/publish directly instead.
      - publish

  - version: "2.0.0"
    targetType: "url"
    target:
      url: "http://provider-adapter:9200/oan"
    endpoints:
      - select
      - init
      - confirm
      - status
