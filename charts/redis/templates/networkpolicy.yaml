{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.from }}
{{- fail (printf "%s: networkPolicy.enabled is true but networkPolicy.from is empty - an ingress rule with no peers would let every pod in the cluster connect. Name the clients, or set networkPolicy.enabled=false." .Chart.Name) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "redis.fullname" . }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "redis.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.from | nindent 8 }}
      ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
{{- end }}
