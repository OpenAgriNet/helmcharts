{{/*
Every model call passes through here, so an eviction that takes the last replica
stops the assistant outright.
*/}}
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "model-gateway.fullname" . }}
  labels:
    {{- include "model-gateway.labels" . | nindent 4 }}
spec:
  {{- with .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ . }}
  {{- end }}
  {{- with .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "model-gateway.selectorLabels" . | nindent 6 }}
{{- end }}
