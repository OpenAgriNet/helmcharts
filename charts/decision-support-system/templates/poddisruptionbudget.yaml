{{- if .Values.podDisruptionBudget.enabled }}
{{/*
Caps how many pods can be voluntarily disrupted at once - node drains, cluster
upgrades, autoscaler scale-down.

With replicaCount: 1 a PDB of minAvailable: 1 blocks drains entirely, because
evicting the only pod would breach it. That is why this is disabled by default
and should be enabled together with replicaCount >= 2 or autoscaling.
*/}}
{{- if and (eq (int .Values.replicaCount) 1) (not .Values.autoscaling.enabled) (not .Values.podDisruptionBudget.allowSingleReplica) }}
{{- fail (printf "%s: podDisruptionBudget is enabled with replicaCount 1 and autoscaling disabled, which blocks node drains entirely. Raise replicaCount to 2+, enable autoscaling, or set podDisruptionBudget.allowSingleReplica=true if you accept that." .Chart.Name) }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "decision-support-system.fullname" . }}
  labels:
    {{- include "decision-support-system.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ . }}
  {{- end }}
  {{- with .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "decision-support-system.selectorLabels" . | nindent 6 }}
{{- end }}
