apiVersion: v1
kind: Service
metadata:
  name: {{ include "decision-support-system.fullname" . }}
  labels:
    {{- include "decision-support-system.labels" . | nindent 4 }}
  {{- with (merge (dict) .Values.service.annotations (.Values.commonAnnotations | default dict)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "decision-support-system.selectorLabels" . | nindent 4 }}
