{{- if .Values.tests.enabled }}
{{/*
`helm test` check: the service answers HTTP at all.

/openapi.json rather than a real readiness route - there is none (see the
probes comment in values.yaml). This confirms the ASGI app is up and FastAPI
is serving, nothing about the model/network wiring behind it. A turn that
comes back no_match because the network is unwired would pass this test just
as cleanly as one with real providers behind it - that is expected, not a gap
in this check.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "decision-support-system.fullname" . }}-test-connection
  labels:
    {{- include "decision-support-system.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: {{ printf "%s/%s:%s" .Values.tests.image.registry .Values.tests.image.repository .Values.tests.image.tag | quote }}
      command:
        - /bin/sh
        - -c
        - |
          set -e
          url="http://{{ include "decision-support-system.fullname" . }}:{{ .Values.service.port }}/openapi.json"
          echo "GET $url"
          wget -q -O- --timeout=10 "$url" >/dev/null
          echo "OK: decision-support-system is serving HTTP"
      resources:
        {{- toYaml .Values.tests.resources | nindent 8 }}
{{- end }}
