{{- if .Values.files }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "decision-support-system.filesConfigMapName" . }}
  labels:
    {{- include "decision-support-system.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- range $name, $content := .Values.files }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
