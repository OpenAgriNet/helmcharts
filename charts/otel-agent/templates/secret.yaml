{{/*
The ingestion key as a Secret rather than an env value in the DaemonSet, so it
is not readable from `kubectl describe daemonset`.

It is still only as private as a Secret in this namespace. The key is supplied
at install time and never written into a values file; giving it the same
Secrets Manager treatment as the rest needs support in the clickstack chart,
which generates the key's counterpart from a plain value today.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  api-key: {{ .Values.apiKey | quote }}
