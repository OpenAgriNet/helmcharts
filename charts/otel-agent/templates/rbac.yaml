{{/*
Its own ServiceAccount, unlike the collector-rbac release which grants the
account clickstack's collector already uses. This chart owns its workload, so it
owns its identity.

nodes/stats is what kubeletstats reads. nodes, pods and namespaces are for the
metadata the receiver attaches through k8s_api_config — without them the metrics
arrive with no pod or namespace name on them, which is the same as not having
them.

NO nodes/proxy. That verb reaches arbitrary kubelet endpoints, exec among them,
and this receiver never needs it: it dials the kubelet directly on :10250 rather
than through the API server proxy. It was granted here by copying a scrape that
did go through the proxy, and that scrape is gone.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/stats", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
