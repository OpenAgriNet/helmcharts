apiVersion: v2
name: otel-agent
description: >-
  A per-node OTel collector that reads each kubelet and emits pod and container
  metrics under the OpenTelemetry semantic conventions — the names HyperDX's
  Kubernetes dashboard queries. A DaemonSet because a kubelet can only be read
  from the node it runs on.
type: application
version: 0.1.2
appVersion: "0.161.0"
maintainers:
  - name: OpenAgriNet Engineering Team
    url: https://github.com/OpenAgriNet
keywords:
  - oan
  - openagrinet
  - observability
  - opentelemetry
  - metrics
home: https://github.com/OpenAgriNet/helmcharts
sources:
  - https://github.com/OpenAgriNet/helmcharts
dependencies:
  - name: common
    version: "0.2.x"
    repository: "file://../common"
