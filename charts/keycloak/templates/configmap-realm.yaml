{{- if include "keycloak.renderRealmConfigMap" . }}
{{/*
The realm the registry expects: realm `sunbird-rc`, the admin-api and
registry-frontend clients, and the roles the registry checks. Mounted at
realmImport.mountPath and imported on startup via KEYCLOAK_IMPORT.

The admin-api client secret is "${env.KEYCLOAK_ADMIN_CLIENT_SECRET}" here, not
a value: the import substitutes it from realmImport.adminClientSecret. This
ConfigMap therefore holds no credential, which is the point - a ConfigMap is
readable by anyone who can list them in this namespace.

Not rendered when realmImport.existingConfigMap points at a ConfigMap managed
outside the chart.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak.realmConfigMapName" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{ .Values.realmImport.fileName }}: |-
    {{- include "keycloak.realmJson" . | nindent 4 }}
{{- end }}
