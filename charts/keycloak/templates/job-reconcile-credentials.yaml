{{- if and .Values.realmImport.enabled .Values.realmImport.reconcileCredentials.enabled }}
{{- $rc := .Values.realmImport.reconcileCredentials }}
{{/*
Keycloak imports a realm ONLY when that realm does not already exist, so every
credential in it is a first-boot value. Rotate a Secret, or import once with a
wrong value, and the realm keeps what it has while the Secrets say otherwise.
Nothing reports the drift: the realm looks correct in the console, and the
failure surfaces as a 401 in a different service.

Fixing the import cannot repair a realm that is already there -- the import is
skipped. This writes to the running server instead, so the two credentials
converge on every sync rather than on first import, and the deploy fails when
they do not.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "keycloak.fullname" . }}-reconcile-credentials
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  annotations:
    # After Keycloak is rolled out, on install and on every upgrade. Argo CD
    # maps these to a PostSync hook.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    # Deliberately NOT hook-succeeded: a failed Job's logs are the only record
    # of which grant failed, and deleting it would take them with it.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ $rc.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "keycloak.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with (include "common.imagePullSecrets" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: reconcile-credentials
          image: {{ include "keycloak.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - bash
            - -euo
            - pipefail
            - -c
            - |
              KC=/opt/jboss/keycloak/bin/kcadm.sh
              # Keeps kcadm's config off $HOME, which need not be writable.
              # --config is an option OF each command, not a prefix before it:
              # `kcadm.sh --config X get ...` makes kcadm read --config as the
              # command name and fail with "Unknown command".
              CFG="/tmp/kcadm.config"
              URL={{ include "keycloak.url" . | quote }}
              REALM={{ $rc.realm | quote }}
              TOKEN_URL="$URL/realms/$REALM/protocol/openid-connect/token"

              deadline=$(( $(date +%s) + {{ $rc.timeoutSeconds }} ))
              until curl -sf "$URL/realms/$REALM" >/dev/null 2>&1; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "reconcile-credentials: realm $REALM did not answer within {{ $rc.timeoutSeconds }}s" >&2
                  exit 1
                fi
                echo "waiting for realm $REALM at $URL"
                sleep 3
              done

              $KC config credentials --config "$CFG" --server "$URL" --realm master \
                --user "$KEYCLOAK_ADMIN_USER" --password "$KEYCLOAK_ADMIN_PASSWORD"

              # Parsed out of the JSON rather than with --format csv: the csv
              # flags differ across kcadm versions, this does not.
              cid=$($KC get clients --config "$CFG" -r "$REALM" -q clientId={{ $rc.adminClientId }} --fields id \
                    | sed -n 's/.*"id"[^"]*"\([^"]*\)".*/\1/p' | head -1)
              if [ -z "$cid" ]; then
                echo "reconcile-credentials: client {{ $rc.adminClientId }} not found in realm $REALM" >&2
                exit 1
              fi
              $KC update "clients/$cid" --config "$CFG" -r "$REALM" -s "secret=$KEYCLOAK_ADMIN_CLIENT_SECRET"
              $KC set-password --config "$CFG" -r "$REALM" --username {{ $rc.seedUsername }} \
                --new-password "$REGISTRY_SEED_PASSWORD"

              # A valid token is not enough: the registry gates writes on the
              # realm roles in each schema's _osConfig, and a missing role fails
              # as "User is not allowed to perform the operation on this entity"
              # rather than as anything resembling auth. Create and assign are
              # allowed to fail -- both are no-ops when already done -- and the
              # check that follows is what actually decides.
              for role in {{ range $rc.seedUserRoles }}{{ . | quote }} {{ end }}; do
                $KC create roles --config "$CFG" -r "$REALM" -s name="$role" >/dev/null 2>&1 || true
                $KC add-roles --config "$CFG" -r "$REALM" \
                  --uusername {{ $rc.seedUsername }} --rolename "$role" >/dev/null 2>&1 || true
                if ! $KC get-roles --config "$CFG" -r "$REALM" \
                     --uusername {{ $rc.seedUsername }} | grep -q "\"$role\""; then
                  echo "reconcile-credentials: {{ $rc.seedUsername }} does not hold realm role $role -- the registry would reject its writes with 'User is not allowed to perform the operation on this entity'" >&2
                  exit 1
                fi
                echo "reconcile-credentials: {{ $rc.seedUsername }} holds $role"
              done

              # Prove it rather than trusting the writes took. These are the
              # exact two grants the registry and registry-seed make.
              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$TOKEN_URL" \
                -d grant_type=client_credentials -d client_id={{ $rc.adminClientId }} \
                --data-urlencode "client_secret=$KEYCLOAK_ADMIN_CLIENT_SECRET")
              if [ "$code" != "200" ]; then
                echo "reconcile-credentials: {{ $rc.adminClientId }} client_credentials grant returned $code -- the registry would fail with invalid_client_credentials" >&2
                exit 1
              fi

              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$TOKEN_URL" \
                -d grant_type=password -d client_id={{ $rc.verifyClientId }} \
                -d username={{ $rc.seedUsername }} \
                --data-urlencode "password=$REGISTRY_SEED_PASSWORD")
              if [ "$code" != "200" ]; then
                echo "reconcile-credentials: {{ $rc.seedUsername }} password grant returned $code -- registry-seed would fail with HTTP 401" >&2
                exit 1
              fi

              echo "reconcile-credentials: both grants succeed against realm $REALM"
          env:
            - name: KEYCLOAK_ADMIN_USER
              value: {{ .Values.admin.username | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.passwordSecret.name }}
                  key: {{ .Values.admin.passwordSecret.key }}
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.realmImport.adminClientSecret.name }}
                  key: {{ .Values.realmImport.adminClientSecret.key }}
            - name: REGISTRY_SEED_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.realmImport.seedUserSecret.name }}
                  key: {{ .Values.realmImport.seedUserSecret.key }}
          resources:
            {{- toYaml $rc.resources | nindent 12 }}
{{- end }}
