apiVersion: {{ include "oan-common.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ include "keycloak.fullname" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  # The legacy distribution is not clustered here, and the realm import runs on
  # startup, so replicas are rolled one at a time with the old pod gone first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "keycloak.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "keycloak.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/env-config: {{ include "oan-common.checksumAnnotation" . }}
        {{- if include "keycloak.renderRealmConfigMap" . }}
        {{/*
        Rolls the pod when the realm changes. Only possible while the chart owns
        the realm content - with realmImport.existingConfigMap, Helm cannot read
        cluster state to checksum it, so restart Keycloak yourself after editing
        that ConfigMap.
        */}}
        checksum/realm: {{ include "keycloak.realmJson" . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.serviceAccount.enabled }}
      serviceAccountName: {{ include "keycloak.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- end }}
      {{- with (include "oan-common.imagePullSecrets" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with (include "oan-common.podSecurityContext" .) }}
      securityContext:
        {{- . | nindent 8 }}
      {{- end }}
      {{- $init := include "keycloak.waitFor" . | trim }}
      {{- $extraInit := "" }}
      {{- with .Values.extraInitContainers }}
      {{- $extraInit = toYaml . | trim }}
      {{- end }}
      {{- if or $init $extraInit }}
      initContainers:
        {{- with $init }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with $extraInit }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "keycloak.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with (include "oan-common.securityContext" .) }}
          securityContext:
            {{- . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- include "keycloak.env" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "keycloak.envConfigMapName" . }}
            {{- range .Values.envFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- with (include "oan-common.probes" . | trim) }}
          {{- . | nindent 10 }}
          {{- end }}
          resources:
            {{- include "oan-common.resources" . | nindent 12 }}
          {{- if or .Values.realmImport.enabled .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.realmImport.enabled }}
            - name: realm
              mountPath: {{ .Values.realmImport.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.realmImport.enabled .Values.extraVolumes }}
      volumes:
        {{- if .Values.realmImport.enabled }}
        - name: realm
          configMap:
            name: {{ include "keycloak.realmConfigMapName" . }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
