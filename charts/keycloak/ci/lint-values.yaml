# Minimum values that let `helm template` run in CI.
#
# This chart deliberately fails the render when the database and password
# Secrets are unset, so bare defaults cannot be templated. These are dummy
# references, not real configuration - see examples/ for that.
database:
  host: registry-db-rw
  passwordSecret:
    name: registry-db-app
admin:
  passwordSecret:
    name: keycloak-admin
