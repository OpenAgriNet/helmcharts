{{- if not .Values.region }}
{{- fail (printf "%s: region is required. Secrets Manager is regional, and a store pointing at the wrong region fails with NotFound rather than a permissions error -- which sends you looking at IAM." .Chart.Name) }}
{{- end }}
{{- if not .Values.auth.serviceAccount.name }}
{{- fail (printf "%s: auth.serviceAccount.name is required. Left empty, the operator falls back to its pod credentials, which on EKS is the NODE role -- every pod on that node would share the access this store grants." .Chart.Name) }}
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: oan
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region | quote }}
      auth:
        {{- /* jwt/serviceAccountRef is IRSA: the operator assumes the role
               annotated on this ServiceAccount. No key, no secret, nothing
               to rotate, and nothing in the cluster that is worth stealing. */}}
        jwt:
          serviceAccountRef:
            name: {{ .Values.auth.serviceAccount.name | quote }}
            namespace: {{ .Values.auth.serviceAccount.namespace | quote }}
