# The other side of every switch, so lint covers the branches the default
# values never reach.
#
# Uses the consumer role on purpose: it is the one with a different handler role and
# a shorter step list, so this case renders the role branches that
# ci/lint-values.yaml (network) does not.
role: consumer
fullnameOverride: consumer-adapter

image:
  registry: ghcr.io
  repository: openagrinet/network-adapter
  tag: "v1.9.0"

keys:
  existingSecret:
    name: consumer-adapter-keys

registry:
  url: http://registry:8081/api/v1

# Routing is no longer a value: it comes from config/routing-<role>.yaml in
# the chart, like the adapter config. Set `routing.config` to a whole routing
# file only if this deployment must differ.

otel:
  enabled: true
  endpoint: otel-collector.observability.svc.cluster.local:4317

autoscaling:
  enabled: true
podDisruptionBudget:
  enabled: true

waitFor:
  enabled: true

ingress:
  enabled: true
  className: alb
  hosts:
    - host: network.oan.example.com
      paths:
        - path: /
          pathType: Prefix
