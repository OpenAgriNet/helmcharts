# A pack the adapter reads from disk: the render must mount it and point the
# validator at it.
role: provider-adapter
fullnameOverride: provider-adapter

image:
  registry: ghcr.io
  repository: openagrinet/network-adapter
  tag: "v1.9.0"

keys:
  existingSecret:
    name: provider-adapter-keys

registry:
  url: http://registry:8081/api/v1

schemaPacks:
  Grievance/v0.1/attributes.yaml: |
    openapi: 3.1.0
