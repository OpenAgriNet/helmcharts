# charts/adapter-service/ci/network-adapter-values.yaml
# CI only (scripts/lint-charts.sh lints and renders every ci/*-values.yaml).
# Not for installs: use examples/network-adapter.yaml.
#
# Renders the single deployment mode, role network-adapter-layer (the Network Adapter
# Layer): config/network-adapter-config.yaml, the generated routing,
# the three tier identities, and the PDB / spread / graceful-shutdown
# settings, so those templates are linted too. The HPA stays off, as in
# examples/network-adapter.yaml: autoscaling is opt-in. Pinned image tag so the render
# is reproducible.
#
# The Ingress is on so the path guard in templates/ingress.yaml runs in CI: the
# allowed path shape (one-segment /<action>, Exact and Prefix) must render.
# ingress.annotations is null on purpose, to cover the `| default dict` on the
# annotations merge.
role: network-adapter-layer
fullnameOverride: network-adapter

image:
  registry: ghcr.io
  repository: openagrinet/network-adapter
  tag: "v1.9.0"

# registry.url, otel.*, appName, logLevel, http.timeout.*, routing.* and
# handler.* are not used by this role: the adapter config is mounted from
# config/network-adapter-config.yaml as is (registry URL, OTLP endpoint and
# log level are set there), so they are left out here. Edit that file instead.

service:
  port: 9200
  targetPort: 9200

networkAdapterLayer:
  keys:
    consumer:
      existingSecret: consumer-adapter-keys
    network:
      existingSecret: network-adapter-keys
    provider:
      existingSecret: provider-adapter-keys
  extraSubstitutions:
    __VISTAAR_TOKEN_URL__: provider/vistaarTokenUrl

# Scale defaults for the Network Adapter Layer: roughly the three tiers'
# requests in one pod, at least one replica per node.
resources:
  requests:
    cpu: 300m
    memory: 384Mi
  limits:
    cpu: 1500m
    memory: 1Gi
goMemLimit: 900MiB
# Fixed replica count by default; the HPA is opt-in. Turning it on needs
# metrics-server in the cluster -- without it the HPA reports
# <unknown> CPU and never scales. With it off, replicaCount applies.
replicaCount: 3
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
terminationGracePeriodSeconds: 40
preStopSleepSeconds: 10

ingress:
  enabled: true
  className: nginx
  annotations: null
  hosts:
    - host: network-adapter.ci.example.com
      paths:
        - path: /discover
          pathType: Exact
        - path: /select
          pathType: Prefix
        - path: /status
          pathType: Exact
