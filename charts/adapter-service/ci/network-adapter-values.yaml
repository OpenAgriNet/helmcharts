# CI only: renders single mode (generated routing, tier identities, PDB, spread,
# shutdown) with ingress on and annotations null to exercise the path guard.
role: network
networkAdapterDeploymentMode: single
fullnameOverride: network-adapter

image:
  registry: ghcr.io
  repository: openagrinet/network-adapter
  tag: "v1.9.0"

# registry.url, otel.*, appName, logLevel, http.timeout.*, routing.* and handler.*
# are unused in single mode: set them in config/network-adapter-config.yaml.

service:
  port: 9201
  targetPort: 9201

networkAdapterLayer:
  keys:
    consumer:
      existingSecret: consumer-adapter-keys
    network:
      existingSecret: network-adapter-keys
    provider:
      existingSecret: provider-adapter-keys
  extraSubstitutions: {}

# Scale defaults for the Network Adapter Layer: roughly the three tiers'
# requests in one pod, at least one replica per node.
resources:
  requests:
    cpu: 300m
    memory: 384Mi
  limits:
    cpu: 1500m
    memory: 1Gi
goMemLimit: 900MiB
replicaCount: 3
podDisruptionBudget:
  enabled: true
  minAvailable: 1
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
terminationGracePeriodSeconds: 40
preStopSleepSeconds: 10   # needs Kubernetes 1.30+; 0 on older clusters

ingress:
  enabled: true
  className: nginx
  annotations: null
  hosts:
    - host: network-adapter.ci.example.com
      paths:
        - path: /discover
          pathType: Exact
        - path: /select
          pathType: Prefix
        - path: /status
          pathType: Exact
