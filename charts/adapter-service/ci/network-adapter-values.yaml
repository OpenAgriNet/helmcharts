# CI only: renders single-adapter mode (generated routing, tier identities)
# with ingress on and annotations null to exercise the path guard.
role: network-adapter
fullnameOverride: network-adapter

image:
  registry: ghcr.io
  repository: openagrinet/network-adapter
  tag: "v1.9.0"

# registry.url, otel.*, appName, logLevel, http.timeout.*, routing.* and handler.*
# are unused in single-adapter mode: set them in config/single-adapter/network-adapter-config.yaml.

service:
  port: 9201
  targetPort: 9201

ingress:
  enabled: true
  className: nginx
  annotations: null
  hosts:
    - host: network-adapter.ci.example.com
      paths:
        - path: /discover
          pathType: Exact
        - path: /select
          pathType: Prefix
        - path: /status
          pathType: Exact
