# charts/adapter-service/ci/network-adapter-ingress-values.yaml
# CI only (scripts/lint-charts.sh lints and renders every ci/*-values.yaml).
# Not for installs: use examples/network-adapter.yaml.
#
# Renders role network-adapter-layer with the Ingress on, so the path guard in
# templates/ingress.yaml runs in CI: the allowed path shape (one-segment
# /<action>, Exact and Prefix) must render. ingress.annotations
# is null on purpose, to cover the `| default dict` on the annotations merge.
role: network-adapter-layer
fullnameOverride: network-adapter

image:
  registry: ghcr.io
  repository: openagrinet/network-adapter
  tag: "v1.9.0"

service:
  port: 9200
  targetPort: 9200

networkAdapterLayer:
  keys:
    consumer:
      existingSecret: consumer-adapter-keys
    network:
      existingSecret: network-adapter-keys
    provider:
      existingSecret: provider-adapter-keys
  extraSubstitutions:
    __VISTAAR_TOKEN_URL__: provider/vistaarTokenUrl

ingress:
  enabled: true
  className: nginx
  annotations: null
  hosts:
    - host: network-adapter.ci.example.com
      paths:
        - path: /discover
          pathType: Exact
        - path: /select
          pathType: Prefix
        - path: /status
          pathType: Exact
