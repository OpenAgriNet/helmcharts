# Minimum that renders. Every value here is one the chart fails without, which
# makes this file a list of what a real deployment must decide.
#
# role is first among them: it has no default, because a default would hand one
# adapter another one's handler role and step list.
role: network
fullnameOverride: network-adapter

image:
  registry: ghcr.io
  repository: openagrinet/network-adapter
  tag: "v1.9.0"

keys:
  existingSecret:
    name: network-adapter-keys

registry:
  url: http://registry:8081/api/v1

# Routing is no longer a value: it comes from config/routing-<role>.yaml in
# the chart, like the adapter config. Set `routing.config` to a whole routing
# file only if this deployment must differ.
