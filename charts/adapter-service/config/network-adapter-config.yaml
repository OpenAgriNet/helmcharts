# Single mode: consumer at /, /publish, /_internal/network/, /_internal/provider/ in one
# process. Each module mirrors its tier file; keys are filled in at pod start (ADR-0001).
appName: "network-adapter"

log:
  level: info
  destinations:
    - type: stdout
  contextKeys: [transaction_id, message_id, subscriber_id, module_id]

http:
  # Also the port the generated routing uses: keep it equal to the
  # chart's service.targetPort.
  port: 9201
  timeout:
    read: 30
    write: 30
    idle: 30

pluginManager:
  root: ./plugins

plugins:
  # OTLP/gRPC metrics, traces and logs. Turn all three off where no collector
  # runs, or the exporter logs a failure every few seconds.
  otelsetup:
    id: otelsetup
    config:
      serviceName: "oan-network-adapter"
      environment: "dev"
      otlpEndpoint: "clickstack-otel-collector.observability.svc.cluster.local:4317"
      enableMetrics: "true"
      enableTracing: "true"
      enableLogs: "true"

modules:
  # consumer: unsigned app calls at / (the catch-all mount, on purpose: see ADR-0001);
  # discover to /_internal/network, transactions to /_internal/provider.
  - name: consumer
    path: /
    handler:
      type: std
      role: bap
      subscriberId: "__CONSUMER_SUBSCRIBER_ID__"
      # Outbound connection pool; responseHeaderTimeout includes the upstream
      # API call on the consumer -> provider hop.
      httpClientConfig:
        maxIdleConns: 512
        maxIdleConnsPerHost: 128
        idleConnTimeout: 90s
        responseHeaderTimeout: 30s
      plugins:
        registry:
          id: sunbirdRegistry
          config:
            url: http://registry.registry.svc.cluster.local:8081/api/v1
            entity: Participant
            providerEntity: ProviderSchema
            timeout: 2
            retry_max: 1
            retry_wait_min: 100ms
            retry_wait_max: 500ms
            maxResponseBytes: 1048576
            cacheTTL: 0
        keyManager:
          id: simplekeymanager
          config:
            subscriberId: "__CONSUMER_SUBSCRIBER_ID__"
            keyId: "__CONSUMER_KEY_ID__"
            signingPrivateKey: "__CONSUMER_SIGNING_PRIVATE__"
            signingPublicKey: "__CONSUMER_SIGNING_PUBLIC__"
            encrPrivateKey: "__CONSUMER_ENCR_PRIVATE__"
            encrPublicKey: "__CONSUMER_ENCR_PUBLIC__"
        schemaValidator:
          id: schemav2validator
          config:
            type: url
            location: "https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/tags/core-v2.0.0-lts/api/v2.0.0/beckn.yaml"
            cacheTTL: "3600"
            extendedSchema_enabled: "true"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "raw.githubusercontent.com,schema.beckn.io,schema.nfh.global,openagrinet.github.io"
        signValidator:
          id: signvalidator
        signer:
          id: signer
        router:
          id: router
          config:
            routingConfig: /app/config/routing-network-adapter-consumer.yaml
        middleware:
          - id: reqpreprocessor
            config:
              contextKeys: transaction_id,message_id
              role: bap
      steps:
        - validateSchema
        - addRoute
        - sign

  # network: verifies the caller, forwards discover and publish to discovery.
  # Internal: never expose it on an Ingress.
  - name: network
    path: /_internal/network/
    handler:
      type: std
      role: bpp
      subscriberId: "__NETWORK_SUBSCRIBER_ID__"
      httpClientConfig:
        maxIdleConns: 512
        maxIdleConnsPerHost: 128
        idleConnTimeout: 90s
        responseHeaderTimeout: 30s
      plugins:
        registry:
          id: sunbirdRegistry
          config:
            url: http://registry.registry.svc.cluster.local:8081/api/v1
            entity: Participant
            providerEntity: ProviderSchema
            timeout: 2
            retry_max: 1
            retry_wait_min: 100ms
            retry_wait_max: 500ms
            maxResponseBytes: 1048576
            cacheTTL: 0
        keyManager:
          id: simplekeymanager
          config:
            subscriberId: "__NETWORK_SUBSCRIBER_ID__"
            keyId: "__NETWORK_KEY_ID__"
            signingPrivateKey: "__NETWORK_SIGNING_PRIVATE__"
            signingPublicKey: "__NETWORK_SIGNING_PUBLIC__"
            encrPrivateKey: "__NETWORK_ENCR_PRIVATE__"
            encrPublicKey: "__NETWORK_ENCR_PUBLIC__"
        # Extended layer off: it fetches each resource's @context per payload.
        # The extendedSchema_* settings apply only when it is on.
        schemaValidator:
          id: schemav2validator
          config:
            type: url
            location: "https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/tags/core-v2.0.0-lts/api/v2.0.0/beckn.yaml"
            cacheTTL: "3600"
            extendedSchema_enabled: "false"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "raw.githubusercontent.com,schema.beckn.io,schema.nfh.global,openagrinet.github.io"
        signValidator:
          id: signvalidator
        signer:
          id: signer
        router:
          id: router
          config:
            # The multi-adapter network routing, unchanged: discover and
            # publish to discovery.
            routingConfig: /app/config/routing-network.yaml
        middleware:
          - id: reqpreprocessor
            config:
              contextKeys: transaction_id,message_id
              role: bpp
      steps:
        - validateSign
        - addRoute

  # provider: verifies the caller and answers from the upstream APIs (no router);
  # upstream credentials come from envFromSecrets: provider-upstream.
  - name: provider
    path: /_internal/provider/
    handler:
      type: std
      role: bpp
      subscriberId: "__PROVIDER_SUBSCRIBER_ID__"
      httpClientConfig:
        maxIdleConns: 512
        maxIdleConnsPerHost: 128
        idleConnTimeout: 90s
        responseHeaderTimeout: 30s
      plugins:
        registry:
          id: sunbirdRegistry
          config:
            url: http://registry.registry.svc.cluster.local:8081/api/v1
            entity: Participant
            providerEntity: ProviderSchema
            timeout: 2
            retry_max: 1
            retry_wait_min: 100ms
            retry_wait_max: 500ms
            maxResponseBytes: 1048576
            cacheTTL: 0
        keyManager:
          id: simplekeymanager
          config:
            subscriberId: "__PROVIDER_SUBSCRIBER_ID__"
            keyId: "__PROVIDER_KEY_ID__"
            signingPrivateKey: "__PROVIDER_SIGNING_PRIVATE__"
            signingPublicKey: "__PROVIDER_SIGNING_PUBLIC__"
            encrPrivateKey: "__PROVIDER_ENCR_PRIVATE__"
            encrPublicKey: "__PROVIDER_ENCR_PUBLIC__"
        schemaValidator:
          id: schemav2validator
          config:
            type: url
            location: "https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/tags/core-v2.0.0-lts/api/v2.0.0/beckn.yaml"
            cacheTTL: "3600"
            extendedSchema_enabled: "true"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "raw.githubusercontent.com,schema.beckn.io,schema.nfh.global,openagrinet.github.io"
        signValidator:
          id: signvalidator
        signer:
          id: signer
        mapper:
          id: jsonmapper
          config:
            fetchTimeout: 10s
            maxMappingBytes: 262144
            cacheTTL: 1m
            negativeTTL: 1m
            maxCacheEntries: 200
        middleware:
          - id: reqpreprocessor
            config:
              contextKeys: transaction_id,message_id
              role: bpp
        providerSteps:
          - id: WeatherObservation
            config:
              bindingKeys: "mausamgram|openagrinet:WeatherObservation"
              mausamgram:
                authScheme: header
                headerName: Authorization
                headerValueEnv: MAUSAMGRAM_AUTH

          - id: MandiPrice
            config:
              bindingKeys: "agmarknet|openagrinet:MandiPrice"
              agmarknet:
                authScheme: none

          - id: KnowledgeAdvisory
            config:
              bindingKeys: "bharat-vistaar|openagrinet:KnowledgeAdvisory"
              bharat-vistaar:
                authScheme: oauth2
                # Substituted from the provider Secret (vistaarTokenUrl) via
                # networkAdapterLayer.extraSubstitutions.
                tokenUrl: "__VISTAAR_TOKEN_URL__"
                clientIdEnv: VISTAAR_CLIENT_ID
                clientSecretEnv: VISTAAR_CLIENT_SECRET
              maxResponseBytes: 1048576

          - id: AgricultureFacility
            config:
              bindingKeys: "pocra|openagrinet:AgricultureFacility"
              pocra:
                authScheme: none
              searchConcurrency: 1
      steps:
        - validateSign
        - validateSchema
        - WeatherObservation
        - MandiPrice
        - KnowledgeAdvisory
        - AgricultureFacility

  # provider-publish: the catalogue system publishes at /publish, signed as the
  # provider. No validateSign: never expose it on an Ingress.
  - name: provider-publish
    path: /publish
    handler:
      type: std
      role: bap
      subscriberId: "__PROVIDER_SUBSCRIBER_ID__"
      httpClientConfig:
        maxIdleConns: 512
        maxIdleConnsPerHost: 128
        idleConnTimeout: 90s
        responseHeaderTimeout: 30s
      plugins:
        registry:
          id: sunbirdRegistry
          config:
            url: http://registry.registry.svc.cluster.local:8081/api/v1
            entity: Participant
            providerEntity: ProviderSchema
            timeout: 2
            retry_max: 1
            retry_wait_min: 100ms
            retry_wait_max: 500ms
            maxResponseBytes: 1048576
            cacheTTL: 0
        keyManager:
          id: simplekeymanager
          config:
            subscriberId: "__PROVIDER_SUBSCRIBER_ID__"
            keyId: "__PROVIDER_KEY_ID__"
            signingPrivateKey: "__PROVIDER_SIGNING_PRIVATE__"
            signingPublicKey: "__PROVIDER_SIGNING_PUBLIC__"
            encrPrivateKey: "__PROVIDER_ENCR_PRIVATE__"
            encrPublicKey: "__PROVIDER_ENCR_PUBLIC__"
        schemaValidator:
          id: schemav2validator
          config:
            type: url
            location: "https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/tags/core-v2.0.0-lts/api/v2.0.0/beckn.yaml"
            cacheTTL: "3600"
            extendedSchema_enabled: "true"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "raw.githubusercontent.com,schema.beckn.io,schema.nfh.global,openagrinet.github.io"
        signer:
          id: signer
        router:
          id: router
          config:
            routingConfig: /app/config/routing-network-adapter-provider.yaml
        middleware:
          - id: reqpreprocessor
            config:
              contextKeys: transaction_id,message_id
              role: bap
      steps:
        - validateSchema
        - addRoute
        - sign
