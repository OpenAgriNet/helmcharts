# OAN network adapter. The network layer: hands discovery to the discovery
# service and re-signs as itself on the way out.
#
# Mounted verbatim. The __ADAPTER_*__ placeholders are substituted by an init
# container from the mounted Secret at pod start -- that Secret is pulled from
# OpenBao by External Secrets Operator, so no key is in this file,
# in the ConfigMap, or in git.
appName: "network-adapter"

log:
  level: debug
  destinations:
    - type: stdout
  contextKeys: [transaction_id, message_id, subscriber_id, module_id]

http:
  port: 9201
  timeout:
    read: 30
    write: 30
    idle: 30

pluginManager:
  root: ./plugins

plugins:
  # Ships metrics, traces and logs over OTLP/gRPC. All three flags false builds
  # no exporter at all, which is the right setting for a stack with no
  # collector -- so these are on only because clickstack is deployed alongside.
  # Turn them back off for a cluster without it: the exporter dials on an
  # interval and logs a connection failure every few seconds when nothing
  # answers.
  otelsetup:
    id: otelsetup
    config:
      serviceName: "network-adapter"
      environment: "dev"
      otlpEndpoint: "clickstack-otel-collector.observability.svc.cluster.local:4317"
      enableMetrics: "true"
      enableTracing: "true"
      enableLogs: "true"

  # Scheduled catalog publishing (catalogcrawler). On every tick it lists the
  # registry's bindings, runs each `publish` pipeline that is due and POSTs the
  # catalogs to the provider adapter's /publish, which signs them as the provider and sends them on
  # to discovery. Needs a crawler-capable image, the run log database (its DSN
  # is a key in the keys Secret, see crawler.dbDsnKey) and the pipeline's
  # inputs as env (MANDI_*, APP_NETWORK_ID). Remove both blocks to turn it off.
  # This registry block is the crawler's own lookup; the modules' is separate.
  registry:
    id: sunbirdRegistry
    config:
      url: http://registry.registry.svc.cluster.local:8081/api/v1
      entity: Participant
      providerEntity: ProviderSchema

  crawler:
    id: catalogcrawler
    config:
      dbDsn: "__ADAPTER_CRAWLER_DB_DSN__"
      discoveryPushUrl: "http://provider-adapter.provider-adapter.svc.cluster.local:9200/publish"
      # Who the catalogs are published AS (context.senderId) and TO (receiverId).
      participantId: "provider.oan.dev"
      receiverId: "discovery.oan.dev"
      publishPipelines: "true"
      publishEnabled: "true"
      catalogIntervalSeconds: "3600"
      # The chart mounts an emptyDir here (read-only root filesystem).
      publishCatalogOutputDir: "/tmp/catalogs"
      # Per-pipeline overrides, by metadata.name. Agmarknet data lags 1-3 weeks:
      # a relative window, not the pipeline's default (yesterday).
      publish.mandi-price.schedule: "0 13 * * *"
      publish.mandi-price.fromDate: "21 days ago"

modules:
  - name: network-adapter
    # A subtree: every action lands here and the payload says which one it is.
    path: /
    handler:
      type: std
      # bpp because this adapter RECEIVES. role sets direction, not participant type.
      role: bpp
      subscriberId: "__ADAPTER_SUBSCRIBER_ID__"

      plugins:
        registry:
          id: sunbirdRegistry
          config:
            # In-cluster address. The compose stack reaches
            # sunbird-registry-service on the compose network; here the registry
            # runs in its own namespace.
            url: http://registry.registry.svc.cluster.local:8081/api/v1
            entity: Participant
            providerEntity: ProviderSchema
            # 0 because no cache plugin is configured. A non-zero TTL here only
            # warns at startup and caches nothing.
            cacheTTL: 0
            # Plain seconds, per attempt.
            timeout: 2
            retry_max: 1
            retry_wait_min: 100ms
            retry_wait_max: 500ms
            # A search response past this is refused, not truncated.
            maxResponseBytes: 1048576

        keyManager:
          id: simplekeymanager
          config:
            subscriberId: "__ADAPTER_SUBSCRIBER_ID__"
            # The key's osid, not a friendly name: the registry indexes on it.
            # Assigned when registry-seed writes the public key, and written
            # into the Secret afterwards by scripts/resolve-key-ids.sh.
            keyId: "__ADAPTER_KEY_ID__"
            signingPrivateKey: "__ADAPTER_SIGNING_PRIVATE__"
            signingPublicKey: "__ADAPTER_SIGNING_PUBLIC__"
            encrPrivateKey: "__ADAPTER_ENCR_PRIVATE__"
            encrPublicKey: "__ADAPTER_ENCR_PUBLIC__"

        signer:
          id: signer
        signValidator:
          id: signvalidator

        # Populates transaction_id and message_id on the context so every log
        # line carries them. subscriber_id is resolved separately, not listed.
        middleware:
          - id: reqpreprocessor
            config:
              contextKeys: transaction_id,message_id
              role: bpp

        # The extended layer is off: it fetches a resource's own @context per
        # payload, and nothing here needs it. The settings below only apply if
        # it is turned on.
        schemaValidator:
          id: schemav2validator
          config:
            type: url
            location: "https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/tags/core-v2.0.0-lts/api/v2.0.0/beckn.yaml"
            cacheTTL: "3600"
            extendedSchema_enabled: "false"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "raw.githubusercontent.com,schema.beckn.io,schema.nfh.global,openagrinet.github.io"

        router:
          id: router
          config:
            routingConfig: /app/config/routing-network.yaml

      # This tier VALIDATES the caller's signature and forwards unsigned.
      #
      # validateSign covers both callers: the consumer adapter on discover and
      # the provider adapter on publish, each of which signs. Removing `sign`
      # on either of those rejects every request arriving here.
      #
      # No `sign` on the way out, because the only thing downstream is the
      # discovery service and it verifies nothing -- its signature middleware
      # is parked, not mounted. Signing here would cost a keypair operation per
      # request that nobody checks.
      #
      # validateSchema is not listed, so this tier enforces no payload shape --
      # it checks who is calling and routes.
      steps:
        - validateSign
        - addRoute
