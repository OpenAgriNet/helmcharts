# OAN provider adapter. Answers Beckn actions synchronously: resolve the
# capability's call plan, call the provider, return the mapped result.
#
# Mounted verbatim. The __ADAPTER_*__ placeholders are substituted by an init
# container from the mounted Secret at pod start -- that Secret is pulled from
# AWS Secrets Manager by External Secrets Operator. Both modules below carry the
# same placeholders and both are substituted: the init container's sed is global.
#
# UPSTREAM CREDENTIALS ARE NOT HERE, and not placeholders either. The auth blocks
# name ENVIRONMENT VARIABLES -- MAUSAMGRAM_AUTH, AGMARKNET_ACCESS_NAME,
# AGMARKNET_PASSWORD, VISTAAR_CLIENT_ID, VISTAAR_CLIENT_SECRET -- which reach the
# pod through `envFromSecrets` on this release. See the values file.
appName: "provider-adapter"

log:
  level: debug
  destinations:
    - type: stdout
  contextKeys: [transaction_id, message_id, subscriber_id, module_id]

http:
  port: 9200
  timeout:
    read: 30
    write: 30
    idle: 30

pluginManager:
  root: ./plugins

plugins:
  # Ships metrics, traces and logs over OTLP/gRPC. All three flags false builds
  # no exporter at all, which is the right setting for a stack with no collector.
  otelsetup:
    id: otelsetup
    config:
      serviceName: "provider-adapter"
      environment: "dev"
      otlpEndpoint: "clickstack-otel-collector.observability.svc.cluster.local:4317"
      enableMetrics: "false"
      enableTracing: "false"
      enableLogs: "false"

modules:
  - name: oanProvider
    # "/" with the trailing slash is a prefix match, so every action lands here.
    # The action comes from the URL, not the payload: the mount path is stripped
    # and what remains ("select", "discover") is what routing matches on.
    path: /
    handler:
      type: std
      role: bpp
      subscriberId: __ADAPTER_SUBSCRIBER_ID__

      plugins:
        # Serves the sender's signing key and the capability call plans.
        registry:
          id: sunbirdRegistry
          config:
            url: http://registry.registry.svc.cluster.local:8081/api/v1
            entity: Participant
            providerEntity: ProviderSchema
            # 0 because no cache plugin is configured. A non-zero TTL here only
            # warns at startup and caches nothing.
            cacheTTL: 0
            # Plain seconds, per attempt. Two registry calls happen per request.
            timeout: 2
            retry_max: 1
            retry_wait_min: 100ms
            retry_wait_max: 500ms
            # A search response past this is refused, not truncated: half a JSON
            # document fails to decode with an error that says nothing useful.
            maxResponseBytes: 1048576

        keyManager:
          id: simplekeymanager
          config:
            subscriberId: __ADAPTER_SUBSCRIBER_ID__
            # The key's osid, not a friendly name: the registry indexes on it.
            keyId: __ADAPTER_KEY_ID__
            signingPrivateKey: "__ADAPTER_SIGNING_PRIVATE__"
            signingPublicKey: "__ADAPTER_SIGNING_PUBLIC__"
            encrPrivateKey: "__ADAPTER_ENCR_PRIVATE__"
            encrPublicKey: "__ADAPTER_ENCR_PUBLIC__"

        signValidator:
          id: signvalidator
        signer:
          id: signer

        # Populates transaction_id and message_id on the context so every log
        # line carries them. subscriber_id is resolved separately, not listed.
        middleware:
          - id: reqpreprocessor
            config:
              contextKeys: transaction_id,message_id
              role: bpp

        schemaValidator:
          id: schemav2validator
          config:
            type: url
            location: "https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/tags/core-v2.0.0-lts/api/v2.0.0/beckn.yaml"
            cacheTTL: "3600"
            # Resolves each resource's @context to its pack and validates
            # resourceAttributes. Base validation treats that object as
            # free-form, so this is the only layer checking capability fields.
            extendedSchema_enabled: "true"
            # The trust boundary: a payload chooses the @context URL, so every
            # host it and its $refs resolve to must be listed. Loading one pack
            # pulls 13-16 documents across these hosts -- drop any one and no
            # pack loads at all.
            extendedSchema_allowedDomains: "raw.githubusercontent.com,schema.beckn.io,schema.nfh.global,openagrinet.github.io"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"

        # Fetches and caches whatever the registry's mapping URLs point at.
        mapper:
          id: jsonmapper
          config:
            # A mapping host that accepts the connection then goes quiet must
            # not hold a request open.
            fetchTimeout: 10s
            # Also how long a corrected mapping takes to take effect.
            cacheTTL: 1m
            # How long a failed fetch is remembered. Without it a broken
            # reference turns every inbound request into an outbound one.
            negativeTTL: 1m
            # References come from the registry, so an unbounded read is an
            # unbounded allocation driven by whoever can write a registry row.
            maxMappingBytes: 262144
            maxCacheEntries: 200

        # One step per capability. Each recognises its own binding key and
        # passes anything else through.
        #
        # A binding key is "<participantId>|<capabilityCode>", read out of the
        # payload at two paths. Both are defaults and are NOT set below:
        #
        #   providerIdAt      message.contract.commitments[].offer.provider.id
        #   capabilityCodeAt  message.contract.commitments[].resources[].resourceAttributes.@type
        #
        # The grammar is segments split on "." plus a "[]" suffix meaning "look
        # in every element" -- no wildcards, filters or indices. Leave both
        # unset: they are a network convention, so overriding one here makes
        # this adapter stop matching everybody else. Set both or neither.
        #
        # ONE STEP CAN SERVE SEVERAL PROVIDERS OF THE SAME CAPABILITY.
        # bindingKeys is a comma-separated list and auth is a block per
        # participant id, so two providers of one capability can authenticate
        # differently. The payload's provider id picks which one answers.
        #
        # A second entry with the same plugin id would NOT work: the ids collide
        # in the handler's step map and one capability is lost with no error.
        #
        # Auth is per provider. A served provider with no block is refused at
        # startup. Credentials are never values here -- the block names the
        # environment variable.
        providerSteps:
          - id: WeatherObservation
            config:
              bindingKeys: "mausamgram|openagrinet:WeatherObservation"
              # header, not basic: IMD issues one opaque token, and basic would
              # build the header itself from a username and password pair.
              mausamgram:
                authScheme: header
                headerName: Authorization
                headerValueEnv: MAUSAMGRAM_AUTH

          - id: MandiPrice
            config:
              bindingKeys: "agmarknet|openagrinet:MandiPrice"
              # Agmarknet issues short-lived tokens. The field names are this
              # provider's spelling, not a standard. tokenTtl is an estimate --
              # the response carries no expiry -- and a 401 drops the held token.
              agmarknet:
                authScheme: tokenQuery
                tokenUrl: "__AGMARKNET_TOKEN_URL__"
                tokenUserField: access_name
                tokenUserEnv: AGMARKNET_ACCESS_NAME
                tokenSecretField: password
                tokenSecretEnv: AGMARKNET_PASSWORD
                tokenResponseField: token
                queryName: token
                tokenTtl: 10m

          - id: KnowledgeAdvisory
            config:
              bindingKeys: "bharat-vistaar|openagrinet:KnowledgeAdvisory"
              bharat-vistaar:
                authScheme: oauth2
                tokenUrl: "__VISTAAR_TOKEN_URL__"
                clientIdEnv: VISTAAR_CLIENT_ID
                clientSecretEnv: VISTAAR_CLIENT_SECRET
              # A retrieval answer is larger than a price row: four passages
              # measured 15.7 KB against the live corpus.
              maxResponseBytes: 1048576

          - id: AgricultureFacility
            config:
              bindingKeys: "pocra|openagrinet:AgricultureFacility"
              pocra:
                authScheme: none
              # Must stay 1. POCRA answers 200 with an empty catalogue after
              # roughly twenty calls in a few minutes. That is indistinguishable
              # from a genuine "nothing nearby", so raising this risks telling a
              # farmer there is no facility when there is.
              searchConcurrency: 1

      # Signing and signature validation are OFF: validateSign and signAck are
      # absent below, so this tier accepts unsigned traffic and answers
      # unsigned. Turning it back on means adding the step names here AND on the
      # other side of the hop at the same time.
      #
      # A plugin declared above but missing from this list is loaded and never runs.
      steps:
        - validateSchema
        - WeatherObservation
        - MandiPrice
        - KnowledgeAdvisory
        - AgricultureFacility

  # The outbound leg: this provider's catalogue system publishing to the network.
  #
  # A separate module, not another action above: the routing step fails any
  # action missing from its config, and listing select there would proxy it to
  # the network instead of answering it locally.
  #
  # Mounted on the exact path /publish while the module above takes /. Go's mux
  # prefers the exact pattern, so /select still reaches the module that answers it.
  - name: oanProviderPublish
    path: /publish
    handler:
      type: std
      # bap because this module SENDS. role sets direction, not participant type.
      role: bap
      subscriberId: __ADAPTER_SUBSCRIBER_ID__

      plugins:
        registry:
          id: sunbirdRegistry
          config:
            url: http://registry.registry.svc.cluster.local:8081/api/v1
            entity: Participant
            providerEntity: ProviderSchema
            # 0 because no cache plugin is configured; see the module above.
            cacheTTL: 0
            timeout: 2
            retry_max: 1
            retry_wait_min: 100ms
            retry_wait_max: 500ms
            maxResponseBytes: 1048576

        keyManager:
          id: simplekeymanager
          config:
            subscriberId: __ADAPTER_SUBSCRIBER_ID__
            keyId: __ADAPTER_KEY_ID__
            signingPrivateKey: "__ADAPTER_SIGNING_PRIVATE__"
            signingPublicKey: "__ADAPTER_SIGNING_PUBLIC__"
            encrPrivateKey: "__ADAPTER_ENCR_PRIVATE__"
            encrPublicKey: "__ADAPTER_ENCR_PUBLIC__"

        signer:
          id: signer

        # No subscriber_id here: a publish body names no party. Identity travels
        # in the Authorization keyId.
        middleware:
          - id: reqpreprocessor
            config:
              contextKeys: transaction_id,message_id
              role: bap

        schemaValidator:
          id: schemav2validator
          config:
            type: url
            location: "https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/tags/core-v2.0.0-lts/api/v2.0.0/beckn.yaml"
            cacheTTL: "3600"
            extendedSchema_enabled: "true"
            # Same trust boundary as the module above; see the note there.
            extendedSchema_allowedDomains: "raw.githubusercontent.com,schema.beckn.io,schema.nfh.global,openagrinet.github.io"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"

        router:
          id: router
          config:
            routingConfig: /app/config/routing-provider.yaml

      # No validateSign: the caller is this provider's own catalogue system,
      # inside its trust boundary. The adapter signs the forwarded request itself.
      steps:
        - validateSchema
        - addRoute
