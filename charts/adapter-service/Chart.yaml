apiVersion: v2
name: adapter-service
description: >-
  One chart for the OAN Beckn adapters. provider, network and experience are the same
  image and config format, so `role` selects the handler role, the step list
  and the routing target; install once per role. Stateless: an adapter's
  identity is a keypair held in a Secret, and everything else it reads from
  the registry.
type: application
version: 0.1.0
# The adapter binary, not this chart. `/health` reports the build it is
# actually running, which is the number to trust over this one.
appVersion: "v1.9.0"
maintainers:
  - name: OpenAgriNet Engineering Team
    url: https://github.com/OpenAgriNet
keywords:
  - oan
  - openagrinet
  - beckn
  - adapter
  - provider
  - network
  - experience
home: https://github.com/OpenAgriNet/helmcharts
sources:
  - https://github.com/OpenAgriNet/helmcharts
  - https://github.com/OpenAgriNet/network-adapter
dependencies:
  - name: oan-common
    version: "0.2.x"
    repository: "file://../oan-common"
