apiVersion: v2
name: adapter-service
description: >-
  One chart for the OAN Beckn adapters: provider, network and consumer (one
  release per tier, the multi topology), or network-adapter-layer: the Network
  Adapter Layer runs the consumer, network and provider tiers as four modules
  of one process (the single topology; tier-to-tier calls are loopback HTTP and
  each module keeps its own tier identity). Same image and config format; role
  selects the handler role, the step list and the routing target. Stateless: an adapter's
  identity is a keypair held in a Secret, and everything else it reads from
  the registry.
type: application
version: 0.5.3
# The adapter binary, not this chart. `/health` reports the build it is
# actually running, which is the number to trust over this one.
appVersion: "v1.9.0"
maintainers:
  - name: OpenAgriNet Engineering Team
    url: https://github.com/OpenAgriNet
keywords:
  - oan
  - openagrinet
  - beckn
  - adapter
  - provider
  - network
  - consumer
  - network-adapter-layer
home: https://github.com/OpenAgriNet/helmcharts
sources:
  - https://github.com/OpenAgriNet/helmcharts
  - https://github.com/OpenAgriNet/network-adapter
dependencies:
  - name: common
    version: "0.2.x"
    repository: "file://../common"
