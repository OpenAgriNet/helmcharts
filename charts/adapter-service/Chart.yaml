apiVersion: v2
name: adapter-service
description: >-
  One chart for the OAN Beckn adapters: provider, network and consumer (one
  release per tier), or single-network-layer (all three tiers in one adapter). Same
  image and config format; role selects the handler role, the step list and
  the routing target. Stateless: an adapter's
  identity is a keypair held in a Secret, and everything else it reads from
  the registry.
type: application
version: 0.5.3
# The adapter binary, not this chart. `/health` reports the build it is
# actually running, which is the number to trust over this one.
appVersion: "v1.9.0"
maintainers:
  - name: OpenAgriNet Engineering Team
    url: https://github.com/OpenAgriNet
keywords:
  - oan
  - openagrinet
  - beckn
  - adapter
  - provider
  - network
  - consumer
  - single-network-layer
home: https://github.com/OpenAgriNet/helmcharts
sources:
  - https://github.com/OpenAgriNet/helmcharts
  - https://github.com/OpenAgriNet/network-adapter
dependencies:
  - name: common
    version: "0.2.x"
    repository: "file://../common"
