{{/*
The adapter's two config files.

adapter.yaml carries PLACEHOLDERS where the keypair goes, not the keypair --
this is a ConfigMap, and a ConfigMap is world-readable to anything with get on
the namespace. The init container substitutes the real values from the Secret
into an emptyDir at start-up.

Everything that differs between the provider, network and consumer adapters is a
value: they are one image with one config format, and the role decides the
identity, the handler role, the step list and where requests are routed.

role single-network-layer reads config/single-network-layer-config.yaml; its routing
files are generated from the tier routing files (_single-network-layer.tpl), and it
renders more than one routing file.
*/}}
{{/*
RAW CONFIG OVERRIDE.

`config` takes an adapter config verbatim, for the cases this chart's templated
form cannot express -- the provider adapter's per-capability plugins above all,
where each capability carries its own binding key, auth block and mapping.
Modelling those in values would mean the chart learning what a capability is.

KEY MATERIAL MUST STAY AS PLACEHOLDERS. The init container substitutes
__ADAPTER_SIGNING_PRIVATE__ and friends from the mounted Secret into an emptyDir
at pod start, which is why no rendered config ever holds a key. A raw config
with a literal private key in it would put that key in git, in a ConfigMap, and
in `helm get values` -- so the render refuses it.
*/}}
{{- $singleNetworkLayer := include "adapter-service.isSingleNetworkLayer" . }}
{{- $nlCfg := "" }}
{{- if $singleNetworkLayer }}
{{- /* role single-network-layer: the config is config/single-network-layer-config.yaml,
       unless `config` replaces it whole. Either way every private key must be a
       tier placeholder; checked on the parsed config. */}}
{{- $nlCfg = .Values.config | default (.Files.Get "config/single-network-layer-config.yaml") }}
{{- if not $nlCfg }}
{{- fail (printf "%s: role single-network-layer reads config/single-network-layer-config.yaml, which is missing from the chart." .Chart.Name) }}
{{- end }}
{{- $nlParsed := $nlCfg | fromYaml }}
{{- if or (not $nlParsed) (hasKey $nlParsed "Error") }}
{{- fail (printf "%s: the single-network-layer adapter config (`config` override or config/single-network-layer-config.yaml) does not parse as YAML, so its private keys cannot be checked." .Chart.Name) }}
{{- end }}
{{- include "adapter-service.singleNetworkLayer.checkKeys" (dict "ctx" . "cfg" $nlParsed) }}
{{- if ne (toString (dig "http" "port" "" $nlParsed)) (toString .Values.service.targetPort) }}
{{- fail (printf "%s: the single-network-layer config listens on http.port %v but service.targetPort is %v. The generated routing sends tier hops to localhost:<targetPort>, so the two must match." .Chart.Name (dig "http" "port" "unset" $nlParsed) .Values.service.targetPort) }}
{{- end }}
{{- else }}
{{- $cfgFile := printf "config/%s-config.yaml" (include "adapter-service.role" .) }}
{{- $cfg := .Values.config | default (.Files.Get $cfgFile) }}
{{- if $cfg }}
{{- range $ph, $field := dict "__ADAPTER_SIGNING_PRIVATE__" "signingPrivateKey" "__ADAPTER_ENCR_PRIVATE__" "encrPrivateKey" }}
{{- if and (contains (printf "%s:" $field) $cfg) (not (contains $ph $cfg)) }}
{{- fail (printf "%s: config sets %s but does not use %s.\n\n  A private key written here reaches git, the ConfigMap, and `helm get values`.\n  Replace the value with %s -- the init container substitutes it from\n  Secret/%s at pod start, so the key exists only in the pod." $.Chart.Name $field $ph $ph ($.Values.keys.existingSecret.name | default "<keys.existingSecret.name>")) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "adapter-service.fullname" . }}-config
  labels:
    {{- include "adapter-service.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- if $singleNetworkLayer }}
  adapter.yaml: |
    {{- $nlCfg | nindent 4 }}
  {{- if .Values.routing.config }}
  {{- fail (printf "%s: routing.config is not used by the single-network-layer role. Its routing files are generated from config/routing-{consumer,network,provider}.yaml. To change a route edit those files; to replace the whole adapter config set `config`." .Chart.Name) }}
  {{- end }}
  {{- range $file, $doc := include "adapter-service.singleNetworkLayer.routing" . | fromYaml }}
  {{ $file }}: |
    # GENERATED by adapter-service from config/routing-*.yaml. Do not edit; edit those files.
    {{- toYaml $doc | nindent 4 }}
  {{- end }}
  {{- else }}
  adapter.yaml: |
    {{- /* The config comes from a FILE, not from this template.

           An adapter config is a plugin graph -- the provider one carries a
           plugin per capability, each with its own binding key, auth block and
           mapping. Expressing that in Helm values would mean this chart
           learning what a capability is, and every new provider becoming a
           chart change. A file per role is edited directly and synced.

           `config` in values wins when set, for an environment that needs to
           differ without a new file. */}}
    {{- $file := printf "config/%s-config.yaml" (include "adapter-service.role" .) }}
    {{- $raw := .Values.config | default ($.Files.Get $file) }}
    {{- if not $raw }}
    {{- fail (printf "%s: no config. Expected %s in the chart, or `config` set in values. The role decides the filename, so a new role needs a new file." .Chart.Name $file) }}
    {{- end }}
    {{- $raw | nindent 4 }}

  {{ include "adapter-service.routingFile" . }}: |
    {{- /* Routing comes from a FILE, for the same reason the config above does:
           it is topology rather than environment. The in-cluster names follow
           the namespace-per-component convention and are identical in every
           environment -- none has ever overridden them. Keeping them in values
           meant a step change was a helmcharts PR while a route change was an
           infra-automation PR, for the same adapter.

           `routing.config` in values wins when set, for an environment that
           genuinely has to differ. */}}
    {{- $routeFile := printf "config/routing-%s.yaml" (include "adapter-service.role" .) }}
    {{- $routes := .Values.routing.config | default ($.Files.Get $routeFile) }}
    {{- if not $routes }}
    {{- fail (printf "%s: no routing. Expected %s in the chart, or `routing.config` set in values. An adapter with no route accepts requests and has nowhere to send them." .Chart.Name $routeFile) }}
    {{- end }}
    {{- /* targetType "url" appends the action to the base, so a trailing slash
           produces //discover -- which routes nowhere and reads as a bad
           gateway rather than as a typo. A path is legitimate alongside
           excludeAction, which is why this tests the slash and not the path.

           PARSED, NOT GREPPED. A line test on `url:` missed every form the
           value can legitimately take: a quoted url ends in the quote, a
           list-item `- url:` fails the prefix, and a trailing comment fails
           the suffix. Each of those is a slash that reaches the router. */}}
    {{- $source := ternary "`routing.config` in values" $routeFile (not (empty .Values.routing.config)) }}
    {{- $parsed := $routes | fromYaml }}
    {{- if not $parsed.routingRules }}
    {{- fail (printf "%s: %s parsed to no routingRules. Either it is not valid YAML or the key is misspelt; an adapter with no route accepts requests and has nowhere to send them." $.Chart.Name $source) }}
    {{- end }}
    {{- range $i, $rule := $parsed.routingRules }}
    {{- $url := "" }}
    {{- if $rule.target }}{{ $url = $rule.target.url | default "" }}{{ end }}
    {{- if hasSuffix "/" $url }}
    {{- fail (printf "%s: %s routingRules[%d].target.url ends in a slash (%q). The router appends the action to it, so that produces //discover." $.Chart.Name $source $i $url) }}
    {{- end }}
    {{- end }}
    {{- $routes | nindent 4 }}
  {{- end }}
