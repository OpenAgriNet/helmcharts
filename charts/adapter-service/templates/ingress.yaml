{{- if .Values.ingress.enabled }}
{{- $ann := merge (dict) (.Values.ingress.annotations | default dict) (.Values.commonAnnotations | default dict) }}
{{- $single := eq (include "adapter-service.deploymentMode" .) "single-adapter" }}
{{- if $single }}
{{- /* Single mode: only literal one-segment /<action> paths (Prefix/Exact, no regex or
       rewrite); never /, /publish or /_internal* (ADR-0001). */}}
{{- if eq (index $ann "nginx.ingress.kubernetes.io/use-regex" | default "" | toString | trim | lower) "true" }}
{{- fail (printf "%s: ingress annotation nginx.ingress.kubernetes.io/use-regex is not allowed in the single deployment mode. A regex path can match /_internal or /publish." .Chart.Name) }}
{{- end }}
{{- if hasKey $ann "nginx.ingress.kubernetes.io/rewrite-target" }}
{{- fail (printf "%s: ingress annotation nginx.ingress.kubernetes.io/rewrite-target is not allowed in the single deployment mode. It turns paths into regexes and can rewrite a request onto /_internal or /publish." .Chart.Name) }}
{{- end }}
{{- range .Values.ingress.hosts }}
{{- range .paths }}
{{- $p := .path | default "" }}
{{- $pt := .pathType | default "Prefix" }}
{{- if not (has $pt (list "Prefix" "Exact")) }}
{{- fail (printf "%s: ingress path %q has pathType %s, which is not allowed in the single deployment mode. Use Prefix or Exact." $.Chart.Name $p $pt) }}
{{- end }}
{{- if or (not (regexMatch "^/[A-Za-z0-9_.-]+$" $p)) (hasPrefix "/_internal" $p) (eq $p "/publish") }}
{{- fail (printf "%s: ingress path %q is not allowed in the single deployment mode. Allowed: one literal segment, /<action> (e.g. /discover, /select). /, /publish and /_internal* are never public." $.Chart.Name $p) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{/*
Off by default, and worth a thought before turning on.

The provider and network roles take SIGNED requests -- validateSign is their
first step -- so publishing them is not the same risk as publishing an adapter
that does not. The consumer role, and the single-mode consumer module
at /, take UNSIGNED requests (NOTES says so when ingress is on). Either way
it is still a Beckn peer endpoint, and the thing that makes it safe is that
every caller must hold a key the registry publishes. That is a property of the
registry's contents, not of this Ingress.
*/}}
apiVersion: {{ include "common.ingress.apiVersion" . }}
kind: Ingress
metadata:
  name: {{ include "adapter-service.fullname" . }}
  labels:
    {{- include "adapter-service.labels" . | nindent 4 }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "adapter-service.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
