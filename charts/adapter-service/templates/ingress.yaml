{{- /*
One Ingress per entry in .Values.ingress.routes, plus the legacy single
.Values.ingress when no routes are given.

Several, rather than one with a list of paths, because a rewrite is an
annotation on the Ingress and holds ONE target. Single mode serves /discover
from the /network/ mount and /select from /provider/ -- two targets, so two
objects (ADR-0002).
*/ -}}
{{- define "adapter-service.ingress.guard" -}}
{{- $root := .root -}}
{{- $route := .route -}}
{{- if eq (include "adapter-service.deploymentMode" $root) "single-adapter" -}}
{{- /* Single mode: literal one-segment /<action> paths (Prefix/Exact), and a
       rewrite onto any mount except the two that take unsigned calls. */ -}}
{{- range $k, $v := $route.annotations }}
{{- if regexMatch "(?i)(snippet|rewrite|regex)" $k }}
{{- if regexMatch "(?i)(^|[^A-Za-z0-9])(publish|consumer)([^A-Za-z0-9]|$)" (toString $v) }}
{{- fail (printf "%s: ingress annotation %s targets /publish or /consumer/.\n\n  Those two mounts take UNSIGNED calls -- their caller is this deployment's own\n  software, inside the trust boundary. Reachable from outside, /publish writes\n  anything into the catalogue and /consumer/ answers anyone. Rewrite onto\n  /network/ or /provider/, which check the signature and the admission." $root.Chart.Name $k) }}
{{- end }}
{{- end }}
{{- end }}
{{- range $route.hosts }}
{{- range .paths }}
{{- $p := .path | default "" }}
{{- $pt := .pathType | default "Prefix" }}
{{- if not (has $pt (list "Prefix" "Exact")) }}
{{- fail (printf "%s: ingress path %q has pathType %s, which is not allowed in the single deployment mode. Use Prefix or Exact." $root.Chart.Name $p $pt) }}
{{- end }}
{{- if or (not (regexMatch "^/[A-Za-z0-9_.-]+$" $p)) (eq $p "/publish") (eq $p "/consumer") }}
{{- fail (printf "%s: ingress path %q is not allowed in the single deployment mode. Allowed: one literal segment, /<action> (e.g. /discover, /select). / , /publish and /consumer are never public." $root.Chart.Name $p) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- if .Values.ingress.enabled }}
{{- $base := dict "name" "" "annotations" (.Values.ingress.annotations | default dict) "hosts" .Values.ingress.hosts "tls" .Values.ingress.tls -}}
{{- $routes := .Values.ingress.routes | default (list $base) -}}
{{- range $i, $route := $routes }}
{{- $ann := merge (dict) ($route.annotations | default dict) ($.Values.commonAnnotations | default dict) -}}
{{- include "adapter-service.ingress.guard" (dict "root" $ "route" (dict "annotations" $ann "hosts" $route.hosts)) }}
---
apiVersion: {{ include "common.ingress.apiVersion" $ }}
kind: Ingress
metadata:
  name: {{ printf "%s%s" (include "adapter-service.fullname" $) (ternary "" (printf "-%s" ($route.name | default (printf "%d" $i))) (empty $route.name)) }}
  labels:
    {{- include "adapter-service.labels" $ | nindent 4 }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $route.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $route.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "adapter-service.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
