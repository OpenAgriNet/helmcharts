apiVersion: {{ include "common.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ include "adapter-service.fullname" . }}
  labels:
    {{- include "adapter-service.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "adapter-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "adapter-service.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{/*
        Rolls the pods when the config changes. Deliberately does NOT cover the
        keys: that Secret is not rendered here, so its content is unknowable at
        template time. Rotating a key needs `kubectl rollout restart`.
        */}}
        checksum/config: {{ include "adapter-service.configChecksum" . }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.serviceAccount.enabled }}
      serviceAccountName: {{ include "adapter-service.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- end }}
      {{- with (include "common.imagePullSecrets" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with (include "common.podSecurityContext" .) }}
      securityContext:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - {{- toYaml (omit . "labelSelector") | nindent 10 }}
          labelSelector:
            {{- if .labelSelector }}
            {{- toYaml .labelSelector | nindent 12 }}
            {{- else }}
            matchLabels:
              {{- include "adapter-service.selectorLabels" $ | nindent 14 }}
            {{- end }}
        {{- end }}
      {{- end }}
      initContainers:
        {{- include "common.waitFor" (dict "ctx" . "tcp" list "http" list) | nindent 8 }}
        {{/*
        Substitutes the keypair into the config.

        Why an init container at all: the adapter reads one file and wants the
        keys inline in it, so the alternative is a ConfigMap holding private
        keys. This keeps them in a Secret, mounted as files rather than env
        vars so they are not readable from /proc/<pid>/environ, and writes the
        result to an emptyDir that dies with the pod.

        `|` as the sed delimiter, not `/`: these values are base64 and base64
        contains `/`. It does not contain `|`.
        */}}
        - name: render-config
          image: "{{ .Values.configRenderer.image.registry }}/{{ .Values.configRenderer.image.repository }}:{{ .Values.configRenderer.image.tag }}"
          imagePullPolicy: {{ .Values.configRenderer.image.pullPolicy }}
          {{- with (include "common.securityContext" .) }}
          securityContext:
            {{- . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              {{- if include "adapter-service.isSingleNetworkLayer" . }}
              # single-network-layer: adapter.yaml plus one routing file per routed module.
              cp /config-template/*.yaml /rendered/
              {{- else }}
              cp /config-template/adapter.yaml /rendered/adapter.yaml
              cp /config-template/{{ include "adapter-service.routingFile" . }} /rendered/{{ include "adapter-service.routingFile" . }}
              {{- end }}

              subst() {
                # $1 placeholder, $2 file holding the value
                if [ ! -s "$2" ]; then
                  {{- if include "adapter-service.isSingleNetworkLayer" . }}
                  # three tier Secrets share key names: name the tier too (e.g. network/keyId)
                  echo "render-config: ${2#/keys/} is missing or empty in its tier's keys Secret" >&2
                  {{- else }}
                  echo "render-config: $(basename "$2") is missing or empty in the keys Secret" >&2
                  {{- end }}
                  exit 1
                fi
                # A value the registry has not assigned yet. keyId is the osid it
                # mints when registry-seed writes the public key, so before that the
                # Secret holds a sentinel. Substituting it yields either invalid YAML
                # -- the sentinel contains a colon -- or an adapter signing with an
                # identity nothing can verify.
                if head -c 9 "$2" | grep -q "<<PENDING"; then
                  {{- if include "adapter-service.isSingleNetworkLayer" . }}
                  echo "render-config: ${2#/keys/} is still unresolved." >&2
                  {{- else }}
                  echo "render-config: $(basename "$2") is still unresolved." >&2
                  {{- end }}
                  echo "  The registry assigns it when registry-seed writes this" >&2
                  echo "  adapter's public key. Run that, then:" >&2
                  echo "    ./scripts/resolve-key-ids.sh -e <env>" >&2
                  exit 1
                fi
                sed -i "s|$1|$(cat "$2")|g" /rendered/adapter.yaml
              }
              {{- if include "adapter-service.isSingleNetworkLayer" . }}

              {{- /* Three identities: each tier's module signs as that tier, from
                     that tier's Secret mounted at /keys/<tier>. */}}
              {{- $k := .Values.keys.existingSecret }}
              {{- range $tier := list "consumer" "network" "provider" }}
              {{- $T := upper $tier }}
              subst __{{ $T }}_SUBSCRIBER_ID__ /keys/{{ $tier }}/{{ $k.subscriberIdKey }}
              subst __{{ $T }}_KEY_ID__ /keys/{{ $tier }}/{{ $k.keyIdKey }}
              subst __{{ $T }}_SIGNING_PRIVATE__ /keys/{{ $tier }}/{{ $k.signingPrivateKey }}
              subst __{{ $T }}_SIGNING_PUBLIC__ /keys/{{ $tier }}/{{ $k.signingPublicKey }}
              subst __{{ $T }}_ENCR_PRIVATE__ /keys/{{ $tier }}/{{ $k.encrPrivateKey }}
              subst __{{ $T }}_ENCR_PUBLIC__ /keys/{{ $tier }}/{{ $k.encrPublicKey }}
              {{- end }}
              {{- range $ph, $path := .Values.singleNetworkLayer.extraSubstitutions }}
              subst {{ $ph }} /keys/{{ $path }}
              {{- end }}
              {{- else }}

              subst __ADAPTER_SUBSCRIBER_ID__   /keys/{{ .Values.keys.existingSecret.subscriberIdKey }}
              subst __ADAPTER_KEY_ID__          /keys/{{ .Values.keys.existingSecret.keyIdKey }}
              subst __ADAPTER_SIGNING_PRIVATE__ /keys/{{ .Values.keys.existingSecret.signingPrivateKey }}
              subst __ADAPTER_SIGNING_PUBLIC__  /keys/{{ .Values.keys.existingSecret.signingPublicKey }}
              subst __ADAPTER_ENCR_PRIVATE__    /keys/{{ .Values.keys.existingSecret.encrPrivateKey }}
              subst __ADAPTER_ENCR_PUBLIC__     /keys/{{ .Values.keys.existingSecret.encrPublicKey }}
              {{- /* Anything else the config needs substituted from a Secret: upstream
                     token endpoints, for instance, which are deployment facts rather than
                     chart facts and in one case a bare IP. Same mechanism, same failure
                     mode if the key is absent. */}}
              {{- range $ph, $key := .Values.keys.existingSecret.extraSubstitutions }}
              subst {{ $ph }} /keys/{{ $key }}
              {{- end }}
              {{- end }}

              # A placeholder that survived means a key was substituted with
              # nothing. Catch it here rather than at the far end, in a peer's
              # logs, as a signature that will not verify.
              if grep -qE '__[A-Z][A-Z0-9_]*__' /rendered/adapter.yaml; then
                echo "render-config: placeholders remain after substitution:" >&2
                grep -oE '__[A-Z][A-Z0-9_]*__' /rendered/adapter.yaml | sort -u >&2
                exit 1
              fi
              echo "render-config: config rendered for the {{ include "adapter-service.role" . }} role"
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            {{- if include "adapter-service.isSingleNetworkLayer" . }}
            {{- range $tier := list "consumer" "network" "provider" }}
            - name: keys-{{ $tier }}
              mountPath: /keys/{{ $tier }}
              readOnly: true
            {{- end }}
            {{- else }}
            - name: keys
              mountPath: /keys
              readOnly: true
            {{- end }}
            - name: config
              mountPath: /rendered
          resources:
            {{- toYaml .Values.configRenderer.resources | nindent 12 }}
        {{- with .Values.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "adapter-service.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.preStopSleepSeconds }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          {{- end }}
          {{- with (include "common.securityContext" .) }}
          securityContext:
            {{- . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{/*
            The image's CMD is `./server --config=${CONFIG_FILE}`, so this is
            not decoration -- unset, the binary is handed an empty --config.
            */}}
            - name: CONFIG_FILE
              value: {{ include "adapter-service.configDir" . }}/adapter.yaml
            {{- with .Values.goMemLimit }}
            - name: GOMEMLIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFromSecrets }}
          envFrom:
            {{- range . }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          {{- with (include "common.probes" . | trim) }}
          {{- . | nindent 10 }}
          {{- end }}
          resources:
            {{- include "common.resources" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: {{ include "adapter-service.configDir" . }}
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config-template
          configMap:
            name: {{ include "adapter-service.fullname" . }}-config
        {{- if include "adapter-service.isSingleNetworkLayer" . }}
        {{- range $tier := list "consumer" "network" "provider" }}
        - name: keys-{{ $tier }}
          secret:
            secretName: {{ include "adapter-service.singleNetworkLayer.tierSecret" (dict "ctx" $ "tier" $tier) }}
            defaultMode: 0400
        {{- end }}
        {{- else }}
        - name: keys
          secret:
            secretName: {{ include "adapter-service.keysSecretName" . }}
            defaultMode: 0400
        {{- end }}
        {{/*
        The rendered config. emptyDir rather than anything durable: it is
        derived from a ConfigMap and a Secret and is rebuilt on every start,
        so persisting it would only let a stale copy outlive a key rotation.
        */}}
        - name: config
          emptyDir:
            sizeLimit: 1Mi
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
