# ===========================================================================
# network role, multi deployment mode -- the network tier alone.
#
# Verifies that the caller's signature checks out against the key the registry
# publishes for them, hands discover and publish to the discovery service, and
# signs on the way out. It answers neither action itself.
#
#   helm install network-adapter . -n network-adapter -f examples/network.yaml
#
# Keep the release name `network-adapter`: consumer routes to this Service by name.
# ===========================================================================
role: network
# Required for the network tier: the default, single, runs all three tiers.
networkAdapterDeploymentMode: multi

# The Service name, and therefore the in-cluster DNS name other adapters use.
# Set explicitly because fullname is otherwise "<release>-<chart>" -- release
# network-adapter plus chart adapter-service would render
# network-adapter-adapter-service, which is not what anything routes to.
fullnameOverride: network-adapter

image:
  registry: ghcr.io
  repository: openagrinet/network-adapter
  tag: "latest"

keys:
  existingSecret:
    name: network-adapter-keys

registry:
  url: http://registry:8081/api/v1

service:
  port: 9201
  targetPort: 9201

# Both actions share one rule because they share a target: publish arrives
# from the provider adapter, discover from the consumer adapter, and neither
# is answered here.
# Routing is no longer a value: it comes from config/routing-<role>.yaml in
# the chart, like the adapter config. Set `routing.config` to a whole routing
# file only if this deployment must differ.

# The upstreams this adapter cannot serve a request without.
waitFor:
  enabled: false

otel:
  enabled: false
  endpoint: ""
