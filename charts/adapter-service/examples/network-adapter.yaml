# Single deployment mode (default): the consumer, network and provider tiers in
# one release. Install: helm install network-adapter . -n network-adapter -f examples/network-adapter.yaml
role: network
networkAdapterDeploymentMode: single

# The Service name and DNS name callers use:
# network-adapter.network-adapter.svc.cluster.local:9201
fullnameOverride: network-adapter

image:
  registry: ghcr.io
  repository: openagrinet/network-adapter
  tag: "latest"

# registry.url, otel.*, appName, logLevel, http.timeout.*, routing.* and handler.*
# are unused in single mode: set them in config/network-adapter-config.yaml.

# targetPort must equal http.port in config/network-adapter-config.yaml (the
# render checks); the generated routing uses it.
service:
  port: 9201
  targetPort: 9201

networkAdapterLayer:
  # The three tier Secrets the multi-adapter releases use. openbao-secrets
  # reflects them into this namespace.
  keys:
    consumer:
      existingSecret: consumer-adapter-keys
    network:
      existingSecret: network-adapter-keys
    provider:
      existingSecret: provider-adapter-keys
  # Set per environment, e.g. __VISTAAR_TOKEN_URL__: provider/vistaarTokenUrl,
  # or the init container stops on the leftover placeholder.
  extraSubstitutions: {}

# The provider tier reads its upstream credentials (MAUSAMGRAM_AUTH,
# AGMARKNET_*, VISTAAR_CLIENT_*) from the environment.
envFromSecrets:
  - provider-upstream

resources:
  requests:
    cpu: 300m
    memory: 384Mi
  limits:
    cpu: 1500m
    memory: 1Gi
goMemLimit: 900MiB

replicaCount: 3

podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

terminationGracePeriodSeconds: 40
preStopSleepSeconds: 10   # needs Kubernetes 1.30+; 0 on older clusters

# Off here. When on, only single-segment /<action> paths (the consumer) are
# accepted: /, /publish and /_internal* fail the render.
ingress:
  enabled: false
  className: ""
  hosts:
    - host: network-adapter.oan.example.com
      paths:
        - path: /discover
          pathType: Exact
        - path: /select
          pathType: Exact
        - path: /init
          pathType: Exact
        - path: /confirm
          pathType: Exact
        - path: /status
          pathType: Exact

waitFor:
  enabled: false
