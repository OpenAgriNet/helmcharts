# ============================================================================
# knowledge-provider-worker - default values
#
# Temporal worker for the Bharat Vistaar Docs Pipeline. Same application image
# as knowledge-provider-api, running `python -m pipeline.worker` instead of
# uvicorn - no HTTP port, no Service, no Ingress, no probes (compose defines
# none for this service either).
#
# Shares PostgreSQL, the object store and Qdrant with knowledge-provider-api;
# keep database/objectStore/vectorStore identical in both charts.
# ============================================================================

replicaCount: 1

image:
  registry: ghcr.io
  repository: openagrinet/knowledge-provider
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# Same image as knowledge-provider-api; only the process differs.
command:
  - python
  - -m
  - pipeline.worker

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  enabled: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

# The default embedder (sentence_transformers, multilingual-e5-large) loads
# about 2.5Gi into this process; below 3Gi the pod is OOMKilled on first use.
resources:
  limits:
    cpu: "1"
    memory: 4Gi
  requests:
    cpu: 250m
    memory: 1Gi

# No HTTP server in this process - compose defines no healthcheck for worker
# either. Revisit if the app adds a worker health-check mechanism.
livenessProbe:
  enabled: false
readinessProbe:
  enabled: false
startupProbe:
  enabled: false

# The image runs as 65532 (Docker Hardened Image); fsGroup makes the
# hf-cache volume writable for it.
podSecurityContext:
  enabled: true
  fsGroup: 65532
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  enabled: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
podLabels: {}
podAnnotations: {}

# ---------------------------------------------------------------------------
# Dependency waiting - see knowledge-provider-api/values.yaml for rationale.
# ---------------------------------------------------------------------------
waitFor:
  enabled: true
  image:
    registry: docker.io
    repository: busybox
    tag: "1.37"
    pullPolicy: IfNotPresent
  timeoutSeconds: 300
  intervalSeconds: 3
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi
  database: true
  temporal: true
  # TCP check on objectStore.endpoint; skipped for GCS.
  objectStore: true
  qdrant: true
  extraTcp: []
  extraHttp: []

extraInitContainers: []
extraVolumes: []
extraVolumeMounts: []

# ---------------------------------------------------------------------------
# Backing services. Must match the knowledge-provider-api release - see that
# chart's values.yaml for what each one sets.
# ---------------------------------------------------------------------------
database:
  host: knowledge-provider-db-rw
  port: 5432
  name: knowledge_provider
  user: knowledge_provider
  sslmode: disable
  passwordSecret:
    name: knowledge-provider-db-app
    key: password

temporal:
  host: knowledge-provider-temporal
  port: 7233

objectStore:
  type: s3
  endpoint: http://minio:9000
  bucket: documents
  credentialsType: static
  region: ""
  createBucket: false

vectorStore:
  host: qdrant
  port: 6333
  collectionName: documents-index
  timeoutSeconds: 30

prodVectorStore:
  # Required only to promote documents to prod; set per environment.
  url: ""
  collectionName: test_doc_pipeline_prod
  timeoutSeconds: 30

# ---------------------------------------------------------------------------
# Persistence. Only the Hugging Face model cache, and this chart's own: with
# existingClaim empty it creates <release>-hf-cache, so the worker no longer
# has to run on the api's node.
# ---------------------------------------------------------------------------
persistence:
  hfCache:
    enabled: true
    existingClaim: ""
    size: 20Gi
    storageClassName: ""
    accessMode: ReadWriteOnce

# ============================================================================
# ENVIRONMENT CONFIGURATION - non-secret, non-derived config.
# Mirrors knowledge-provider-api's envConfig: compose loads the identical
# .env file into both api and worker, so this chart keeps parity.
# Full annotated reference: knowledge-provider/ENV.md in the app repo.
# ============================================================================
envConfig:
  LOG_LEVEL: "info"
  # Names the process in traces and logs; api and worker are one image.
  OTEL_SERVICE_NAME: "knowledge-provider-worker"
  PYTHONUNBUFFERED: "1"
  DEFAULT_INSTANCE: "default"
  DISABLE_PROD_SETTING: "false"

  EMBEDDING_PROVIDER: "sentence_transformers"
  EMBEDDING_MODEL: "intfloat/multilingual-e5-large"
  EMBEDDING_DIM: "1024"
  EMBEDDING_VECTOR_SIZE: "1024"
  # e5, embeddinggemma or plain. Changing it or the model needs a new collection.
  EMBEDDING_PROMPT_STYLE: "e5"
  EMBEDDING_BASE_URL: ""

  HF_HOME: "/opt/hf-cache"
  HF_HUB_CACHE: "/opt/hf-cache"

  OCR_PROVIDER: "mistral"
  OCR_MODEL: "mistral-ocr-latest"
  MISTRAL_OCR_MODEL: "mistral-ocr-latest"
  MISTRAL_OCR_API_URL: "https://api.mistral.ai/v1/ocr"
  OCR_SEGMENT_PAGES: "20"
  OCR_REQUEST_TIMEOUT_SECONDS: "300"
  # OCR_PROVIDER=chandra: an OpenAI-compatible endpoint ("vllm") or the HF
  # page API ("hf"). The vllm client takes its key from VLLM_API_KEY.
  CHANDRA_INFERENCE_MODE: "hf"
  CHANDRA_VLLM_BASE_URL: ""
  VLLM_MODEL_NAME: "chandra"

  AGRINET_GEMMA_BASE_URL: ""
  AGRINET_GEMMA_MODEL_NAME: "google/gemma-4-31b-it"

  TRANSLATION_PROVIDER: "gemma_vllm"
  TRANSLATION_MODEL: "google/gemma-4-31b-it"
  TRANSLATION_VLLM_BASE_URL: ""
  TRANSLATION_PAGE_CONCURRENCY: "1"
  TRANSLATION_USE_MAX_COMPLETION_TOKENS: "false"
  TRANSLATION_TEMPERATURE: "0.0"
  TRANSLATION_SCRIPT_GATE_ENABLED: "true"
  TRANSLATION_SCRIPT_MIN_CHARS: "15"
  TRANSLATION_SCRIPT_MIN_RATIO: "0.05"

  CHUNKING_PROVIDER: "recursive_splitter"
  CHUNKING_MODEL: "recursive_splitter"
  CHUNKING_TARGET_CHUNK_TOKENS: "450"

  TEMPORAL_MAX_CONCURRENT_ACTIVITIES: "4"

  # true: index all intake into vectorStore.collectionName, with no approval
  # or network publishing.
  KP_INDEX_ONLY: "false"

  # Publish to Network (Discovery Service) - worker-only.
  DISCOVERY_SERVICE_ENDPOINT: ""
  # Off unless set: publishing needs DISCOVERY_SERVICE_ENDPOINT and a sender.
  ENABLE_PUBLISH_TO_NETWORK: "false"
  # The network's own subscriberId. Also sent as context.networkId, so it is
  # what Discovery scopes the published catalogs to.
  NETWORK_SENDER_ID: ""

envFromSecrets: []

# Same Secret names as knowledge-provider-api's secretEnv - point both charts
# at the same Secrets rather than creating duplicates.
secretEnv:
  # Static S3 credentials (objectStore.credentialsType: static).
  AWS_ACCESS_KEY_ID:
    name: knowledge-provider-minio-credentials
    key: access-key
  AWS_SECRET_ACCESS_KEY:
    name: knowledge-provider-minio-credentials
    key: secret-key
  # Required by any Qdrant that is not local; the qdrant chart reads the same key.
  VECTOR_DB_API_KEY:
    name: knowledge-provider-qdrant
    key: api-key
    optional: true
  PROD_VECTOR_DB_API_KEY:
    name: knowledge-provider-provider-keys
    key: prod-vector-db-api-key
    optional: true
  EMBEDDING_API_KEY:
    name: knowledge-provider-provider-keys
    key: embedding-api-key
    optional: true
  HF_TOKEN:
    name: knowledge-provider-provider-keys
    key: hf-token
    optional: true
  MISTRAL_API_KEY:
    name: knowledge-provider-provider-keys
    key: mistral-api-key
    optional: true
  AGRINET_GEMMA_API_KEY:
    name: knowledge-provider-provider-keys
    key: gemma-api-key
    optional: true
  TRANSLATION_API_KEY:
    name: knowledge-provider-provider-keys
    key: translation-api-key
    optional: true
  # Read by the chandra-ocr library itself (CHANDRA_INFERENCE_MODE=vllm).
  VLLM_API_KEY:
    name: knowledge-provider-provider-keys
    key: vllm-api-key
    optional: true

extraEnv: []
