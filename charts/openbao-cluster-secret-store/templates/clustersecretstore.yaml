{{- if not .Values.server }}
{{- fail (printf "%s: server is required -- the OpenBao API address the operator pod can reach, e.g. http://openbao.openbao.svc.cluster.local:8200" .Chart.Name) }}
{{- end }}
{{- if not (has .Values.version (list "v1" "v2")) }}
{{- fail (printf "%s: version must be v1 or v2, got %q. It must match the KV engine mounted at %q; a mismatch fails as \"secret not found\", not as a version error." .Chart.Name .Values.version .Values.path) }}
{{- end }}
{{- if not .Values.auth.role }}
{{- fail (printf "%s: auth.role is required -- the OpenBao Kubernetes-auth role the operator logs in as" .Chart.Name) }}
{{- end }}
{{- if not .Values.auth.serviceAccount.name }}
{{- fail (printf "%s: auth.serviceAccount.name is required. The OpenBao role is bound to one ServiceAccount; a token from any other is refused." .Chart.Name) }}
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: oan
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  provider:
    vault:
      server: {{ .Values.server | quote }}
      path: {{ .Values.path | quote }}
      version: {{ .Values.version | quote }}
      auth:
        {{- /* The operator presents this ServiceAccount's token, and OpenBao
               checks it against the Kubernetes API. Nothing is stored in the
               cluster for this, so there is nothing here to rotate or steal. */}}
        kubernetes:
          mountPath: {{ .Values.auth.mountPath | quote }}
          role: {{ .Values.auth.role | quote }}
          serviceAccountRef:
            name: {{ .Values.auth.serviceAccount.name | quote }}
            namespace: {{ .Values.auth.serviceAccount.namespace | quote }}
