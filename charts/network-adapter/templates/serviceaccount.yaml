{{- if .Values.serviceAccount.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "network-adapter.serviceAccountName" . }}
  labels:
    {{- include "network-adapter.labels" . | nindent 4 }}
  {{- with (merge (dict) .Values.serviceAccount.annotations (.Values.commonAnnotations | default dict)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{/*
false by default. This adapter calls the registry and the discovery service
over HTTP and never talks to the API server, so a projected token here would
be a credential nothing uses and anything reading the filesystem could take.
*/}}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
