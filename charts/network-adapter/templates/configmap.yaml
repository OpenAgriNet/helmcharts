{{/*
The adapter's two config files.

adapter.yaml carries PLACEHOLDERS where the keypair goes, not the keypair --
this is a ConfigMap, and a ConfigMap is world-readable to anything with get on
the namespace. The init container substitutes the real values from the Secret
into an emptyDir at start-up. The placeholder names match the .tmpl in the
compose stack so the two stay legible against each other.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "network-adapter.fullname" . }}-config
  labels:
    {{- include "network-adapter.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  adapter.yaml: |
    # Rendered by the network-adapter chart. Do not edit in place: the init
    # container rewrites a copy of this, and this object is replaced on every
    # helm upgrade.
    appName: "network-adapter"

    log:
      level: {{ .Values.logLevel | quote }}
      destinations:
        - type: stdout
      contextKeys: [transaction_id, message_id, subscriber_id, module_id]

    http:
      port: {{ .Values.service.targetPort }}
      timeout:
        read: 30
        write: 30
        idle: 30

    pluginManager:
      root: ./plugins

    plugins:
      otelsetup:
        id: otelsetup
        config:
          serviceName: {{ .Values.otel.serviceName | quote }}
          environment: {{ .Values.otel.environment | quote }}
          otlpEndpoint: {{ include "network-adapter.otlpEndpoint" . | quote }}
          enableMetrics: {{ .Values.otel.enabled | quote }}
          enableTracing: {{ .Values.otel.enabled | quote }}
          enableLogs: {{ .Values.otel.enabled | quote }}

    modules:
      - name: network-adapter
        # A subtree: every action lands here and the payload says which one.
        path: /
        handler:
          type: std
          # bpp because this adapter RECEIVES rather than originates. The role
          # decides which declared identity validateSign would compare a signer
          # against -- but no payload here declares one, so that check is
          # skipped and what is verified is the signature itself, against the
          # key the registry publishes for whoever signed.
          role: bpp
          subscriberId: __NETWORK_SUBSCRIBER_ID__

          plugins:
            registry:
              id: oanregistry
              config:
                url: {{ include "network-adapter.registryUrl" . | quote }}
                entity: {{ .Values.registry.entity | quote }}
                providerEntity: {{ .Values.registry.providerEntity | quote }}

            keyManager:
              id: simplekeymanager
              config:
                subscriberId: __NETWORK_SUBSCRIBER_ID__
                # The KEY's osid, not a friendly name: that is what the
                # registry indexes keys by, and what a verifier looks up.
                keyId: __NETWORK_KEY_ID__
                signingPrivateKey: "__NETWORK_SIGNING_PRIVATE__"
                signingPublicKey: "__NETWORK_SIGNING_PUBLIC__"
                encrPrivateKey: "__NETWORK_ENCR_PRIVATE__"
                encrPublicKey: "__NETWORK_ENCR_PUBLIC__"

            signer:
              id: signer
            signValidator:
              id: signvalidator

            schemaValidator:
              id: schemav2validator
              config:
                type: url
                location: {{ .Values.becknSpec.url | quote }}
                cacheTTL: {{ .Values.becknSpec.cacheTTL | quote }}
                extendedSchema_enabled: {{ .Values.becknSpec.extendedSchema.enabled | quote }}
                extendedSchema_cacheTTL: {{ .Values.becknSpec.extendedSchema.cacheTTL | quote }}
                extendedSchema_maxCacheSize: {{ .Values.becknSpec.extendedSchema.maxCacheSize | quote }}
                extendedSchema_downloadTimeout: {{ .Values.becknSpec.extendedSchema.downloadTimeout | quote }}
                extendedSchema_allowedDomains: {{ .Values.becknSpec.extendedSchema.allowedDomains | quote }}

            router:
              id: router
              config:
                routingConfig: {{ include "network-adapter.configDir" . }}/routing-network.yaml

          steps:
            - validateSign
            - addRoute
            - sign

  routing-network.yaml: |
    # One job: hand the catalogue actions to the discovery service.
    #
    # targetType "url" appends the action to whatever base is given, so the
    # base is the bare host and port with no path.
    routingRules:
      - version: {{ .Values.routing.version | quote }}
        targetType: "url"
        target:
          url: {{ include "network-adapter.discoveryUrl" . | quote }}
        endpoints:
          {{- range .Values.routing.endpoints }}
          - {{ . }}
          {{- end }}
