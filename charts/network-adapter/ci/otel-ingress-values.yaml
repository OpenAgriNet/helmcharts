# The other side of every switch, so lint covers the branches the default
# values never reach.
image:
  registry: ghcr.io
  repository: openagrinet/network-adapter
  tag: "v1.9.0"

keys:
  existingSecret:
    name: network-adapter-keys

registry:
  url: http://registry:8081/api/v1
discovery:
  url: http://discovery:8080

otel:
  enabled: true
  endpoint: otel-collector.observability.svc.cluster.local:4317

autoscaling:
  enabled: true
podDisruptionBudget:
  enabled: true

waitFor:
  enabled: true

ingress:
  enabled: true
  className: alb
  hosts:
    - host: network.oan.example.com
      paths:
        - path: /
          pathType: Prefix
