apiVersion: v2
name: network-adapter
description: >-
  The OAN network-layer Beckn adapter. Verifies the caller's signature against
  the registry, hands discover and publish to the discovery service, and
  re-signs as itself on the way out. Stateless: its identity is a keypair held
  in a Secret, and everything else it needs it reads from the registry.
type: application
version: 0.1.0
# The adapter binary, not this chart. `/health` reports the build it is
# actually running, which is the number to trust over this one.
appVersion: "v1.9.0"
maintainers:
  - name: OpenAgriNet Engineering Team
    url: https://github.com/OpenAgriNet
keywords:
  - oan
  - openagrinet
  - beckn
  - adapter
  - network
home: https://github.com/OpenAgriNet/helmcharts
sources:
  - https://github.com/OpenAgriNet/helmcharts
  - https://github.com/OpenAgriNet/network-adapter
dependencies:
  - name: oan-common
    version: "0.2.x"
    repository: "file://../oan-common"
