# network-adapter, dev.
#
# helm upgrade --install network-adapter charts/network-adapter \
#   -n oan -f charts/network-adapter/examples/network-adapter.dev.yaml
#
# The Secret comes first, and it is not optional. From what bin/setup.py wrote
# into keys/keys.json in the compose stack:
#
#   kubectl -n oan create secret generic network-adapter-keys \
#     --from-literal=subscriberId="$(jq -r .network.subscriberId keys/keys.json)" \
#     --from-literal=keyId="$(jq -r .network.keyId keys/keys.json)" \
#     --from-literal=signingPrivateKey="$(jq -r .network.signingPrivate keys/keys.json)" \
#     --from-literal=signingPublicKey="$(jq -r .network.signingPublic keys/keys.json)" \
#     --from-literal=encrPrivateKey="$(jq -r .network.encrPrivate keys/keys.json)" \
#     --from-literal=encrPublicKey="$(jq -r .network.encrPublic keys/keys.json)"
#
# Check the field names against your keys.json before running that -- setup.py
# owns that shape, not this chart.

image:
  registry: ghcr.io
  repository: openagrinet/network-adapter
  tag: "v1.9.0"
  # The package is private. Without a docker-registry secret named here the
  # deploy looks clean and the pod sits in ImagePullBackOff.
  pullSecrets: []

keys:
  existingSecret:
    name: network-adapter-keys

# In-cluster Services. These are the compose service names as they land in
# Kubernetes -- adjust to whatever your releases are actually called.
registry:
  url: http://registry:8081/api/v1

discovery:
  url: http://discovery:8080

logLevel: debug

# Off until a collector exists. On with no endpoint reachable, the exporter
# logs a failure every interval and buries everything else.
otel:
  enabled: false
  environment: dev

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
