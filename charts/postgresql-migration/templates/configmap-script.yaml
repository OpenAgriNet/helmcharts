{{- include "postgresql-migration.validate" . }}
{{- $targets := include "postgresql-migration.enabledTargets" . | fromJsonArray }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgresql-migration.fullname" . }}-script
  labels:
    {{- include "postgresql-migration.labels" . | nindent 4 }}
  annotations:
    {{- include "postgresql-migration.hookAnnotations" . | nindent 4 }}
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  migrate.sh: |-
    #!/bin/sh
    # Generated by the postgresql-migration chart. Do not edit in the cluster -
    # change values.yaml and upgrade instead.
    #
    # POSIX sh, not bash: the flyway alpine image has no bash.
    #
    # One `flyway migrate` per target, in the order declared in values.yaml.
    # Flyway records what it has applied in each database's own
    # flyway_schema_history, so re-running this is safe: applied migrations are
    # skipped, not repeated.
    set -eu

    fail=0

    run_target() {
      name="$1"
      url="$2"
      dir="/migrations/$name"

      echo "=========================================================="
      echo "target: $name"
      echo "url:    $url"

      if [ ! -d "$dir" ]; then
        echo "  SKIP: $dir is not mounted"
        return 0
      fi
      # A target with no .sql is a placeholder for a database whose schema is
      # managed elsewhere (Keycloak's Liquibase, Sunbird RC's own DDL).
      if [ -z "$(find "$dir" -maxdepth 1 -name '*.sql' -print -quit)" ]; then
        echo "  SKIP: no .sql files in $dir"
        return 0
      fi

      echo "  migrations:"
      for f in "$dir"/*.sql; do
        echo "    $(basename "$f")"
      done

      if flyway -url="$url" -locations="filesystem:$dir" migrate; then
        echo "  OK: $name"
        return 0
      fi

    {{- if .Values.repairOnFailure }}
      echo "  migrate failed for $name - running repair and retrying once"
      if ! flyway -url="$url" -locations="filesystem:$dir" repair; then
        echo "  FAILED: repair failed for $name"
        return 1
      fi
      if flyway -url="$url" -locations="filesystem:$dir" migrate; then
        echo "  OK: $name (after repair)"
        return 0
      fi
      echo "  FAILED: $name still failing after repair"
      return 1
    {{- else }}
      echo "  FAILED: $name (repairOnFailure is disabled, so not retrying)"
      return 1
    {{- end }}
    }

    {{- range $targets }}
    run_target {{ .name | quote }} {{ include "postgresql-migration.jdbcUrl" (dict "ctx" $ "database" .database) | quote }} || fail=1
    {{- end }}

    echo "=========================================================="
    if [ "$fail" -ne 0 ]; then
      echo "one or more targets FAILED"
      exit 1
    fi
    echo "all targets completed"
