apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgresql-migration.envConfigMapName" . }}
  labels:
    {{- include "postgresql-migration.labels" . | nindent 4 }}
  annotations:
    {{- include "postgresql-migration.hookAnnotations" . | nindent 4 }}
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  # Flyway settings. The password is NOT here - it comes from a Secret, injected
  # as FLYWAY_PASSWORD in the Job.
  FLYWAY_USER: {{ .Values.postgresql.user | quote }}
  FLYWAY_BASELINE_ON_MIGRATE: {{ .Values.flyway.baselineOnMigrate | quote }}
  FLYWAY_BASELINE_VERSION: {{ .Values.flyway.baselineVersion | quote }}
  FLYWAY_VALIDATE_ON_MIGRATE: {{ .Values.flyway.validateOnMigrate | quote }}
  FLYWAY_OUT_OF_ORDER: {{ .Values.flyway.outOfOrder | quote }}
  {{- range $k, $v := .Values.flyway.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- range $k, $v := .Values.envConfig }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
