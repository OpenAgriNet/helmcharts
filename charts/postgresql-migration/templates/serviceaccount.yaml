{{- if include "oan-common.serviceAccount.enabled" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "postgresql-migration.serviceAccountName" . }}
  labels:
    {{- include "postgresql-migration.labels" . | nindent 4 }}
  annotations:
    {{- include "postgresql-migration.hookAnnotations" . | nindent 4 }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
