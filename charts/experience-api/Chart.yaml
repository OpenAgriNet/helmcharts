apiVersion: v2
name: experience-api
description: >-
  The Experience API: the HTTP service between the OpenAgriNet web client and
  the DSS. Takes one chat turn on POST /v1/chat, calls the DSS, and streams
  the answer back.
type: application
version: 0.1.0
# The app has cut no release yet. CI tags every image with its commit, so
# appVersion is the commit of main this chart was written against.
appVersion: "42964a26423b4b21aa206eba324fcec329aafe6c"
maintainers:
  - name: OpenAgriNet Engineering Team
    url: https://github.com/OpenAgriNet
keywords:
  - oan
  - openagrinet
  - experience
  - chat
home: https://github.com/OpenAgriNet/helmcharts
sources:
  - https://github.com/OpenAgriNet/helmcharts
  - https://github.com/OpenAgriNet/experience-api
dependencies:
  - name: common
    version: "0.2.x"
    repository: "file://../common"
