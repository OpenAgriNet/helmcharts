       sub-charts, so their deploy switches no longer deploy anything. */ -}}
{{- if .Values.postgresql.deploy }}
{{- fail "langfuse: postgresql.deploy is no longer supported - the database is the `postgresCluster` sub-chart (CloudNativePG). Leave postgresql.deploy false." }}
{{- end }}
{{- if .Values.s3.deploy }}
{{- fail "langfuse: s3.deploy is no longer supported - object storage is the `objectStorage` sub-chart (MinIO). Leave s3.deploy false." }}
{{- end }}
