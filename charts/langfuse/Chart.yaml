apiVersion: v2
name: langfuse
version: 3.0.1
description: Open source LLM engineering platform - LLM observability, metrics, evaluations, prompt management.
type: application
keywords:
  - langfuse
  - llm
  - observability
  - prompt management
  - metrics
home: https://langfuse.com/
sources:
  - https://github.com/langfuse/langfuse
  - https://github.com/langfuse/langfuse-k8s
# Everything Langfuse needs is vendored under charts/: nothing is fetched at
# render time (Argo CD renders from git with no dependency build).
#   common, postgresql-cnpg, minio  copies of this repo's own charts
#   valkey, seaweedfs, clickhouse-operator-helm  upstream, committed whole
dependencies:
  - name: common
    version: 0.2.0
    repository: ""
  - name: postgresql-cnpg
    version: 0.2.1
    repository: ""
    condition: postgresCluster.enabled
    alias: postgresCluster
  - name: minio
    version: 0.2.0
    repository: ""
    condition: objectStorage.enabled
    alias: objectStorage
  - name: valkey
    version: 0.9.4
    repository: ""
    condition: redis.deploy
    alias: redis
  - name: seaweedfs
    version: 4.23.0
    repository: ""
    condition: s3.deploy
    alias: s3
  - name: clickhouse-operator-helm
    version: 0.0.8
    repository: ""
    condition: clickhouse-operator.enabled
    alias: clickhouse-operator
maintainers:
  - name: langfuse
    email: contact@langfuse.com
    url: https://langfuse.com/
icon: https://langfuse.com/langfuse_logo.png
appVersion: "4.35.0"
annotations:
  # This chart forked from upstream langfuse-k8s at 3.0.0; see CHANGELOG.md.
  oan.in/upstream-version: "2.2.0"
