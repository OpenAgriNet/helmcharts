# Not upstream - added so this repo's offline CI can render this chart.
#
# Bare defaults call `lookup` against a live cluster to confirm the ClickHouse
# operator's CRDs are installed and fail loudly when they are not found.
# `helm template` in CI has no cluster; `clickhouse.crdCheck: false` is
# upstream's documented escape hatch.
clickhouse:
  crdCheck: false

# The MinIO sub-chart renders no Secrets and needs the name of one.
objectStorage:
  credentialsSecret:
    name: langfuse-minio-credentials
s3:
  accessKeyId:
    secretKeyRef:
      name: langfuse-minio-credentials
      key: access-key
  secretAccessKey:
    secretKeyRef:
      name: langfuse-minio-credentials
      key: secret-key
