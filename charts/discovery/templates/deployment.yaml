apiVersion: {{ include "oan-common.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ include "discovery.fullname" . }}
  labels:
    {{- include "discovery.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "discovery.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "discovery.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/env-config: {{ include "oan-common.checksumAnnotation" . }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.serviceAccount.enabled }}
      serviceAccountName: {{ include "discovery.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- end }}
      {{- with (include "oan-common.imagePullSecrets" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with (include "oan-common.podSecurityContext" .) }}
      securityContext:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "discovery.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with (include "oan-common.securityContext" .) }}
          securityContext:
            {{- . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- include "discovery.env" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "discovery.envConfigMapName" . }}
            {{- range .Values.envFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- with (include "oan-common.probes" . | trim) }}
          {{- . | nindent 10 }}
          {{- end }}
          resources:
            {{- include "oan-common.resources" . | nindent 12 }}
          volumeMounts:
            {{- /*
            The Beckn spec cache. Mounted either way, and not only for the
            air-gapped case: with readOnlyRootFilesystem the fetch path has
            nowhere to write its cache without a volume here, and /app is not
            writable by uid 65532 in any case.
            */}}
            - name: beckn-spec
              mountPath: {{ include "discovery.specCacheDir" . }}
              readOnly: {{ if include "discovery.specFromConfigMap" . }}true{{ else }}false{{ end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: beckn-spec
          {{- if include "discovery.specFromConfigMap" . }}
          configMap:
            name: {{ .Values.becknSpec.existingConfigMap }}
            items:
              - key: {{ .Values.becknSpec.key }}
                path: {{ .Values.becknSpec.key }}
          {{- else }}
          emptyDir:
            sizeLimit: 16Mi
          {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
