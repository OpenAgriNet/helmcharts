# The other half of the matrix: the DSN comes whole from a Secret key, the spec
# from a ConfigMap rather than a URL, and the optional resources are all on.
#
# Rendering this is what keeps the alternative paths honest - a chart that only
# ever renders its defaults has untested branches that fail on the day someone
# uses them.
image:
  registry: ghcr.io
  repository: openagrinet/discovery-service
  tag: "0.1.0"

replicaCount: 2

app:
  networkId: local-network

database:
  urlSecret:
    name: discovery-db-app
    key: uri
  autoMigrate: true

becknSpec:
  existingConfigMap: discovery-beckn-spec

embeddings:
  provider: ollama
  endpoint: http://ollama:11434

otel:
  exporter: otlp
  endpoint: http://otel-collector:4317

replicationTargets:
  - https://peer-a.example.invalid/publish
  - https://peer-b.example.invalid/publish

ingress:
  enabled: true
  className: alb
  hosts:
    - host: discovery.example.invalid
      paths:
        - path: /
          pathType: Prefix

podDisruptionBudget:
  enabled: true
  minAvailable: 1

envConfig:
  RATE_LIMIT_RPS: "50"
  RATE_LIMIT_BURST: "100"
