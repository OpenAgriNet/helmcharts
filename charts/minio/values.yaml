# ============================================================================
# minio - default values
#
# Single-node MinIO for the Bharat Vistaar Docs Pipeline - blob storage for
# original uploads, normalized files, and stage artifacts. Matches
# docker-compose.yml's single-container `minio server /data
# --console-address :9001` setup, not a distributed/HA MinIO deployment.
# ============================================================================

replicaCount: 1

image:
  # MinIO no longer publishes images anyone can pull: quay.io/minio/minio and
  # docker.io/minio/minio both answer 401. Chainguard's build is public. Pinned
  # by digest because Chainguard's free tier publishes only `latest`; this is
  # the digest langfuse-minio runs.
  registry: cgr.dev
  repository: chainguard/minio
  tag: ""
  digest: sha256:ad4a4c0a39ad7b71408124fe3df07b1b2e9d2959a369fac8754d2ef3311b5c20
  pullPolicy: IfNotPresent
  pullSecrets: []

# Empty: the chart runs `mkdir -p /data/<bucket> && exec minio server /data
# --console-address :9001`. A bucket is a directory under /data, so making it
# before the server starts replaces the bucket-init Job (whose minio/mc image
# is gone the same way). Set to override.
command: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  enabled: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

service:
  type: ClusterIP
  # S3 API port. consolePort (9001) is the browser console - also exposed on
  # this Service, in-cluster only; add an Ingress if you need external access.
  port: 9000
  targetPort: 9000
  consolePort: 9001
  annotations: {}

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /minio/health/live
    port: http
  initialDelaySeconds: 20
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 5

readinessProbe:
  enabled: true
  httpGet:
    path: /minio/health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  enabled: false
  httpGet:
    path: /minio/health/live
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30

# Chainguard runs as 65532; fsGroup makes the volume writable by it.
podSecurityContext:
  enabled: true
  fsGroup: 65532
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  enabled: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
podLabels: {}
podAnnotations: {}

extraInitContainers: []
extraVolumes: []
extraVolumeMounts: []

# ---------------------------------------------------------------------------
# Persistence for /data. Single-node, so this must be ReadWriteOnce and this
# Deployment must stay at replicaCount 1 - there is no clustering here.
# ---------------------------------------------------------------------------
persistence:
  enabled: true
  existingClaim: ""
  size: 50Gi
  storageClassName: ""
  accessMode: ReadWriteOnce

# The bucket knowledge-provider-api/worker read/write (MINIO_BUCKET). Made as
# a directory before the server starts (see command above).
bucket: documents

# ---------------------------------------------------------------------------
# Bucket-init Job (helm.sh/hook: post-install,post-upgrade). Runs `mc mb` for
# `bucket` above and exits. Off: the default command already makes the bucket,
# and quay.io/minio/mc answers 401. Enable only with an mc image you can pull.
# ---------------------------------------------------------------------------
bucketInit:
  enabled: false
  image:
    registry: quay.io
    repository: minio/mc
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# ---------------------------------------------------------------------------
# Root credentials. This chart renders no Secret - create it before
# installing (see README.md, "Secrets"). Same Secret name/keys as
# knowledge-provider-api/-worker's MINIO_ACCESS_KEY/MINIO_SECRET_KEY, so all
# three charts share one Secret rather than three copies of the same values.
# ---------------------------------------------------------------------------
credentialsSecret:
  name: knowledge-provider-minio-credentials
  accessKeyKey: access-key
  secretKeyKey: secret-key

envConfig: {}
envFromSecrets: []
secretEnv: {}
extraEnv: []
