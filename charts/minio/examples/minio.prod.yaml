# Example: minio, prod environment.
#
#   helm install minio charts/minio \
#     -n knowledge-provider -f charts/minio/examples/minio.prod.yaml
#
# Create knowledge-provider-minio-credentials before installing (see
# README.md, "Secrets").

persistence:
  size: 200Gi
  storageClassName: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

commonLabels:
  oan.in/environment: prod
