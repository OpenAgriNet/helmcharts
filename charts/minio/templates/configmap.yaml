apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "minio.envConfigMapName" . }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- include "common.envConfigMapData" . | trim | nindent 2 }}
