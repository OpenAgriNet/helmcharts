# Example: qdrant, prod environment.
#
#   kubectl create secret generic qdrant-api-key \
#     --from-literal=api-key=<key>
#   helm install qdrant charts/qdrant \
#     -n knowledge-provider -f charts/qdrant/examples/qdrant.prod.yaml
#
# Remember: this is still the DEV index even in a "prod" cluster - PROD
# Qdrant (knowledge-provider-api's prodVectorStore.*) is always a separately
# managed deployment outside this chart.

apiKeySecret:
  name: qdrant-api-key

persistence:
  size: 50Gi

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "4"
    memory: 4Gi

commonLabels:
  oan.in/environment: prod
