# Example: qdrant, dev environment.
#
#   helm install qdrant charts/qdrant \
#     -n knowledge-provider -f charts/qdrant/examples/qdrant.dev.yaml
#
# No API key, matching docker-compose.yml's dev default.

persistence:
  size: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

commonLabels:
  oan.in/environment: dev
