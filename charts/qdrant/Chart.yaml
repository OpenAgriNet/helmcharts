apiVersion: v2
name: qdrant
description: >-
  Qdrant (single-node) - shared OAN vector index infrastructure. Currently
  consumed by knowledge-provider as its DEV vector store; PROD Qdrant is
  always a separately managed deployment, never this chart.
type: application
version: 0.2.0
appVersion: "latest"
maintainers:
  - name: OpenAgriNet Engineering Team
    url: https://github.com/OpenAgriNet
keywords:
  - oan
  - openagrinet
  - qdrant
  - vector-database
home: https://github.com/OpenAgriNet/helmcharts
sources:
  - https://github.com/OpenAgriNet/helmcharts
  - https://github.com/qdrant/qdrant
dependencies:
  - name: common
    version: "0.2.x"
    repository: "file://../common"
