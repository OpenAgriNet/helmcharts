{{/*
Its own ServiceAccount, never `default`, per CONVENTIONS.md - even though this
Job needs no Kubernetes API access at all. automountServiceAccountToken is false
on the pod for the same reason: it talks to the registry over HTTP and has no
business holding a token for the API server.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "registry-seed.fullname" . }}
  labels:
    {{- include "registry-seed.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
