# Example: seed the registry, dev environment.
#
#   helm install registry-seed charts/registry-seed \
#     -n registry -f charts/registry-seed/examples/seed.dev.yaml
#
# Install LAST, after the registry is serving. Its log reports the key osid each
# adapter must be configured with.
#
# This mirrors what quick-start/bin/setup.py seeds on the compose stack: three
# adapter identities, four upstream providers, four capability bindings and four
# capability schemas. Seven participants in total.
#
# ANGLE-BRACKETED VALUES BELOW ARE PLACEHOLDERS and the chart refuses to render
# while any remain. They are the values that cannot be derived from this
# repository: the addresses peers reach this deployment at, and the real
# upstream hosts. Filling one in wrong is not recoverable - the registry cannot
# update a record and its delete is soft, so the row keeps whatever it was
# seeded with, for good.

registry:
  url: http://registry.registry.svc.cluster.local:8081

keycloak:
  # Must equal the issuer Keycloak puts in its tokens, including /auth.
  url: http://keycloak.keycloak.svc.cluster.local:8080/auth
  realm: sunbird-rc
  clientId: registry-frontend

seedUser:
  username: no-user
  passwordSecret:
    name: registry-seed
    key: registrySeedPassword

# ---------------------------------------------------------------------------
# The three adapter identities
#
# signingPublicKey is the PUBLIC half from `scripts/gen-secrets.py` - bare
# base64, no `base64:` label. It is what every signature this participant makes
# is verified against.
#
# baseUrl is the address a PEER posts to, not an in-cluster address: nothing
# here resolves it, so a wrong value costs nothing locally and everything on a
# shared network.
# ---------------------------------------------------------------------------
adapters:
  - role: consumer
    participantId: consumer.oan.dev
    name: OAN consumer layer adapter
    networkRole: consumer
    baseUrl: <https://consumer.oan.example.com>
    signingPublicKey: <consumer-adapter-keys signingPublicKey>
  - role: network
    participantId: network.oan.dev
    name: OAN network layer adapter
    networkRole: network
    baseUrl: <https://network.oan.example.com>
    signingPublicKey: <network-adapter-keys signingPublicKey>
  - role: provider
    participantId: provider.oan.dev
    name: OAN provider layer adapter
    networkRole: provider
    baseUrl: <https://provider.oan.example.com>
    signingPublicKey: <provider-adapter-keys signingPublicKey>

# ---------------------------------------------------------------------------
# The four upstreams
#
# All four are REAL external providers - no mock is in use by any capability -
# so this stack needs egress to each, and every base URL is a deployment fact
# that cannot come from this repository.
#
# No role, no keys and no credential: an upstream has never heard of Beckn. The
# adapter presents any credential from its own config.
# ---------------------------------------------------------------------------
upstreams:
  - participantId: mausamgram
    name: IMD Mausamgram NWP
    baseUrl: <mausamgram base url>
  - participantId: agmarknet
    name: Agmarknet Vistaar
    baseUrl: <agmarknet base url>
  - participantId: bharat-vistaar
    name: Bharat Vistaar knowledge retrieval
    baseUrl: <vistaar base url>
  - participantId: pocra
    name: POCRA agriculture facilities
    baseUrl: <pocra base url>

# ---------------------------------------------------------------------------
# Who answers what
#
# The binding key is participantId|capability, and it must match what the
# provider adapter is rendered with - in compose both come from the same .env,
# which is what keeps them from disagreeing. Here, this file and the provider
# adapter's values are the two halves to keep true.
#
# method is the provider's contract: Mausamgram and Agmarknet answer a GET whose
# query the mapping builds, the knowledge provider and POCRA take a POST.
#
# mappingUrl is fetched by the ADAPTER, not the registry, and describes one
# upstream's wire format. The ref in the URL is the branch it is read from -
# check it points at the branch you deploy.
# ---------------------------------------------------------------------------
bindings:
  - participantId: mausamgram
    capability: openagrinet:WeatherObservation
    path: /get-daily
    method: GET
    mappingUrl: https://raw.githubusercontent.com/OpenAgriNet/helmcharts/release-0.0.1/quick-start/config/mappings/mausamgram/weather-observation.select.yaml
  - participantId: agmarknet
    capability: openagrinet:MandiPrice
    path: /v1/fetch-agmarknet-vistaar
    method: GET
    mappingUrl: https://raw.githubusercontent.com/OpenAgriNet/helmcharts/release-0.0.1/quick-start/config/mappings/agmarknet/mandi-price.select.yaml
  - participantId: bharat-vistaar
    capability: openagrinet:KnowledgeAdvisory
    # No default in setup.py either - it comes from VISTAAR_PATH in .env.
    path: <vistaar path>
    method: POST
    mappingUrl: https://raw.githubusercontent.com/OpenAgriNet/helmcharts/release-0.0.1/quick-start/config/mappings/knowledge/knowledge-advisory.select.yaml
  - participantId: pocra
    capability: openagrinet:AgricultureFacility
    # POCRA_PATH in .env; no default.
    path: <pocra path>
    method: POST
    mappingUrl: https://raw.githubusercontent.com/OpenAgriNet/helmcharts/release-0.0.1/quick-start/config/mappings/pocra/agriculture-facility.select.yaml

# ---------------------------------------------------------------------------
# What each capability MEANS - one row per capability, not per binding.
#
# The version is per capability rather than one setting for all four, because a
# capability can move to v0.2 while the others stay. The schemaUrl is built from
# the capability code, which already names the pack directory, so the two cannot
# drift.
# ---------------------------------------------------------------------------
schemas:
  - capability: openagrinet:WeatherObservation
    name: Weather Observation
    version: v0.1
  - capability: openagrinet:MandiPrice
    name: Mandi Price
    version: v0.1
  - capability: openagrinet:KnowledgeAdvisory
    name: Knowledge Advisory
    version: v0.1
  - capability: openagrinet:AgricultureFacility
    name: Agriculture Facility
    version: v0.1

# Ref in OpenAgriNet/network-specs the packs are read from. THE REGISTRY NEVER
# FETCHES THIS - it only checks the URL's shape - so a ref that does not serve
# the pack stores happily and fails later, at whoever resolves it. And it cannot
# be corrected afterwards.
schemaPackRef: main

commonLabels:
  oan.in/environment: dev
