apiVersion: {{ include "oan-common.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ include "registry.fullname" . }}
  labels:
    {{- include "registry.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "registry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "registry.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/env-config: {{ include "oan-common.checksumAnnotation" . }}
        checksum/schemas: {{ include "registry.schemasData" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.serviceAccount.enabled }}
      serviceAccountName: {{ include "registry.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- end }}
      {{- with (include "oan-common.imagePullSecrets" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with (include "oan-common.podSecurityContext" .) }}
      securityContext:
        {{- . | nindent 8 }}
      {{- end }}
      {{- $init := include "registry.waitFor" . | trim }}
      {{- $extraInit := "" }}
      {{- with .Values.extraInitContainers }}
      {{- $extraInit = toYaml . | trim }}
      {{- end }}
      {{- if or $init $extraInit }}
      initContainers:
        {{- with $init }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with $extraInit }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "registry.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with (include "oan-common.securityContext" .) }}
          securityContext:
            {{- . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- include "registry.env" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "registry.envConfigMapName" . }}
            {{- range .Values.envFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- with (include "oan-common.probes" . | trim) }}
          {{- . | nindent 10 }}
          {{- end }}
          resources:
            {{- include "oan-common.resources" . | nindent 12 }}
          volumeMounts:
            - name: schemas
              mountPath: {{ .Values.schemas.mountPath }}
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: schemas
          configMap:
            name: {{ include "registry.schemasConfigMapName" . }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
