{{- if include "registry.renderSchemasConfigMap" . }}
{{/*
Entity definitions, mounted at schemas.mountPath. The registry treats every
.json here as an entity it serves APIs for.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "registry.schemasConfigMapName" . }}
  labels:
    {{- include "registry.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- include "registry.schemasData" . | trim | nindent 2 }}
{{- end }}
