{{- if .Values.tests.enabled }}
{{/*
`helm test` check: the registry answers on /health.

Deliberately does not test an authenticated endpoint: that needs a real token,
and a failure there would be ambiguous between "registry is broken" and
"Keycloak wiring is wrong". Health tells you the pod is serving; the NOTES
explain how to check the auth chain.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "registry.fullname" . }}-test-connection
  labels:
    {{- include "registry.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: {{ printf "%s/%s:%s" .Values.tests.image.registry .Values.tests.image.repository .Values.tests.image.tag | quote }}
      command:
        - /bin/sh
        - -c
        - |
          set -e
          url="http://{{ include "registry.fullname" . }}:{{ .Values.service.port }}/health"
          echo "GET $url"
          wget -q -O- --timeout=10 "$url"
          echo ""
          echo "OK: registry is serving /health"
      resources:
        {{- toYaml .Values.tests.resources | nindent 8 }}
{{- end }}
