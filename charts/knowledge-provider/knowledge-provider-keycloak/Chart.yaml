apiVersion: v2
name: knowledge-provider-keycloak
description: >-
  Keycloak for the Bharat Vistaar Docs Pipeline, on a custom modern
  (Quarkus-based) Keycloak image with a baked-in email-OTP 2FA provider and
  realm import. Not the same Keycloak distribution as this repo's `keycloak`
  chart - see README.md.
type: application
version: 0.1.0
appVersion: "latest"
maintainers:
  - name: OpenAgriNet Engineering Team
    url: https://github.com/OpenAgriNet
keywords:
  - oan
  - openagrinet
  - knowledge-provider
  - docs-pipeline
  - keycloak
  - authentication
home: https://github.com/OpenAgriNet/helmcharts
sources:
  - https://github.com/OpenAgriNet/helmcharts
  - https://github.com/OpenAgriNet/knowledge-provider
dependencies:
  - name: common
    version: "0.2.x"
    repository: "file://../../common"
