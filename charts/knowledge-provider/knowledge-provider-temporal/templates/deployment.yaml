apiVersion: {{ include "common.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ include "knowledge-provider-temporal.fullname" . }}
  labels:
    {{- include "knowledge-provider-temporal.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, not the Deployment default RollingUpdate: temporalio/auto-setup
  # registers itself in a Postgres-backed cluster membership ring even as a
  # single "all-in-one" process. A RollingUpdate briefly runs old and new
  # pods together, and the two independently try to route to each other as
  # ring members - one nearly always already gone - producing repeated
  # dial-timeout/connection-refused loops that can stall the new pod's own
  # readiness for many minutes (found by installing this chart against a
  # real cluster). Recreate guarantees only one member ever exists.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "knowledge-provider-temporal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "knowledge-provider-temporal.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/env-config: {{ include "common.checksumAnnotation" . }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.serviceAccount.enabled }}
      serviceAccountName: {{ include "knowledge-provider-temporal.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- end }}
      {{- with (include "common.imagePullSecrets" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with (include "common.podSecurityContext" .) }}
      securityContext:
        {{- . | nindent 8 }}
      {{- end }}
      {{- $init := include "knowledge-provider-temporal.waitFor" . | trim }}
      {{- $extraInit := "" }}
      {{- with .Values.extraInitContainers }}
      {{- $extraInit = toYaml . | trim }}
      {{- end }}
      {{- if or $init $extraInit }}
      initContainers:
        {{- with $init }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with $extraInit }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "knowledge-provider-temporal.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with (include "common.securityContext" .) }}
          securityContext:
            {{- . | nindent 12 }}
          {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- /*
            temporalio/auto-setup's --env docker preset binds the frontend
            gRPC listener to the container's own routable IP, not 0.0.0.0 or
            127.0.0.1 (verified against a real cluster: `ss`/`/proc/net/tcp`
            showed 7233 LISTEN only on the pod IP). The Service still routes
            fine either way - only a probe run from inside the pod needs
            this, since "localhost" resolves to loopback, which nothing
            listens on here.
            */}}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- include "knowledge-provider-temporal.env" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "knowledge-provider-temporal.envConfigMapName" . }}
            {{- range .Values.envFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- with (include "common.probes" . | trim) }}
          {{- . | nindent 10 }}
          {{- end }}
          resources:
            {{- include "common.resources" . | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
