apiVersion: v1
kind: Service
metadata:
  name: {{ include "knowledge-provider-minio.fullname" . }}
  labels:
    {{- include "knowledge-provider-minio.labels" . | nindent 4 }}
  {{- with (merge (dict) .Values.service.annotations (.Values.commonAnnotations | default dict)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.consolePort }}
      targetPort: console
      protocol: TCP
      name: console
  selector:
    {{- include "knowledge-provider-minio.selectorLabels" . | nindent 4 }}
