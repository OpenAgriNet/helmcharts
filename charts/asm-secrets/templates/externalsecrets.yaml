{{/*
One ExternalSecret per entry in .Values.secrets.

THE FLOW. ESO writes the Kubernetes Secret into THIS release's namespace, and
Reflector mirrors it into the namespaces that read it. Not ESO writing directly
into each: one source object, mirrored, means there is exactly one place the
value arrives and one place to look when it is wrong.

WHOLE ENTRY, NOT PER-KEY. Each Secrets Manager entry holds a JSON object whose
keys become the Secret's keys -- `dataFrom.extract` takes all of them. That
matches what manage-secrets.py pushes: one entry per secret, keys inside it.

REFLECTOR NAMESPACES ARE REGEXES, and that is a trap rather than a convenience:
`registry` would also match `registry-staging` on a cluster that had one. Each
is anchored with ^...$ below.
*/}}
{{- $root := . -}}
{{- range $idx, $s := .Values.secrets }}
{{- if not $s.name }}
{{- fail (printf "%s: secrets[%d].name is required -- it is both the Secrets Manager entry and the Kubernetes Secret name" $root.Chart.Name $idx) }}
{{- end }}
{{- if not $s.namespaces }}
{{- fail (printf "%s: secrets[%d] (%s) lists no namespaces. A Secret nothing reads is a Secret nobody notices is wrong; if it is genuinely unused, remove it." $root.Chart.Name $idx $s.name) }}
{{- end }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $s.name }}
  labels:
    app.kubernetes.io/name: {{ $root.Chart.Name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
    app.kubernetes.io/part-of: oan
spec:
  {{- /* How often ESO re-reads the store. A rotation in Secrets Manager reaches
         the cluster within this window -- and no sooner, so a rotation is not
         instant however urgent it feels. */}}
  refreshInterval: {{ $s.refreshInterval | default $root.Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $root.Values.secretStoreRef.name | quote }}
    kind: {{ $root.Values.secretStoreRef.kind | quote }}
  target:
    name: {{ $s.name }}
    {{- /* Owner: ESO creates the Secret and deletes it when this object goes.
           Merge would leave an orphan behind that nothing reconciles. */}}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: {{ printf "^%s$" (join "$,^" $s.namespaces) | quote }}
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: {{ printf "^%s$" (join "$,^" $s.namespaces) | quote }}
  dataFrom:
    - extract:
        key: {{ printf "%s/%s" $root.Values.prefix $s.name | quote }}
{{- end }}
