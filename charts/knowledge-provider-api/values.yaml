# ============================================================================
# knowledge-provider-api - default values
#
# FastAPI service for the Bharat Vistaar Docs Pipeline (review-driven document
# ingestion: OCR -> translation -> chunking -> vector indexing).
#
# PostgreSQL holds documents and review state, MinIO/S3 the blobs. The API
# applies SQL migrations on startup under an advisory lock.
# ============================================================================

replicaCount: 1

image:
  registry: ghcr.io
  repository: openagrinet/knowledge-provider
  # Leave empty to fall back to Chart.appVersion.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  enabled: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

service:
  type: ClusterIP
  port: 8001
  targetPort: 8001
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: docs-pipeline-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# The default embedder (sentence_transformers, multilingual-e5-large) loads
# about 2.5Gi into this process; below 3Gi the pod is OOMKilled on first use.
resources:
  limits:
    cpu: "1"
    memory: 4Gi
  requests:
    cpu: 250m
    memory: 1Gi

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

# The image runs as 65532 (Docker Hardened Image); fsGroup makes the
# hf-cache volume writable for it.
podSecurityContext:
  enabled: true
  fsGroup: 65532
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  enabled: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
podLabels: {}
podAnnotations: {}

# ---------------------------------------------------------------------------
# Dependency waiting
#
# Kubernetes has no equivalent of compose's `depends_on: condition:
# service_healthy`. Without these init containers the pod starts before
# PostgreSQL/Temporal/MinIO/Qdrant are up, fails, and crashloops with backoff.
# ---------------------------------------------------------------------------
waitFor:
  enabled: true
  image:
    registry: docker.io
    repository: busybox
    tag: "1.37"
    pullPolicy: IfNotPresent
  timeoutSeconds: 300
  intervalSeconds: 3
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi
  database: true
  temporal: true
  # TCP check on objectStore.endpoint; skipped for GCS.
  objectStore: true
  qdrant: true
  extraTcp: []
  extraHttp: []

extraInitContainers: []
extraVolumes: []
extraVolumeMounts: []

# ---------------------------------------------------------------------------
# Backing services. Defaults assume the sibling charts installed with the
# release names in config/: knowledge-provider-db (postgresql-cnpg),
# knowledge-provider-temporal, minio and qdrant, all in this namespace.
# ---------------------------------------------------------------------------
# DATABASE_URL is built from these; the password goes in PGPASSWORD. CNPG
# writes it into <cluster>-app.
database:
  host: knowledge-provider-db-rw
  port: 5432
  name: knowledge_provider
  user: knowledge_provider
  sslmode: disable
  passwordSecret:
    name: knowledge-provider-db-app
    key: password

temporal:
  host: knowledge-provider-temporal
  port: 7233

# OBJECT_STORE_*. type s3 covers MinIO and AWS; gcs drops the endpoint.
# Credentials: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in secretEnv (static),
# or credentialsType aws_web_identity / google_adc with a service account.
objectStore:
  type: s3
  endpoint: http://minio:9000
  bucket: documents
  credentialsType: static
  region: ""
  # Off: provision the bucket first (config/ creates it in the MinIO volume).
  createBucket: false

# DEV Qdrant only - PROD Qdrant is always external, see prodVectorStore below.
vectorStore:
  host: qdrant
  port: 6333
  collectionName: documents-index
  timeoutSeconds: 30

# PROD Qdrant (Approval-for-Prod promotion target) - never bundled, always a
# separately managed deployment.
prodVectorStore:
  # Required only to promote documents to prod; set per environment.
  url: ""
  collectionName: test_doc_pipeline_prod
  timeoutSeconds: 30

# ---------------------------------------------------------------------------
# Persistence. Documents live in PostgreSQL and the object store; the only
# volume left is the Hugging Face model cache, needed when
# EMBEDDING_PROVIDER is sentence_transformers (downloaded on first use).
# knowledge-provider-worker keeps its own cache, so the two pods no longer
# have to share a node.
# ---------------------------------------------------------------------------
persistence:
  hfCache:
    enabled: true
    existingClaim: ""
    size: 20Gi
    storageClassName: ""
    accessMode: ReadWriteOnce

# ---------------------------------------------------------------------------
# Keycloak (auth). url is the private base URL (JWKS, backchannel, admin API);
# issuerUrl is the public one Keycloak puts in tokens' `iss`, if different.
# Realm and client default to the ones knowledge-provider-keycloak imports
# (keycloak/import/docs-pipeline-realm.json in the app repo). clientId is the
# confidential console client; its secret is KEYCLOAK_CLIENT_SECRET below.
# ---------------------------------------------------------------------------
keycloak:
  # true needs runtimeProfile: local - the app refuses to start otherwise.
  authDisabled: false
  url: ""
  issuerUrl: ""
  realm: docs-pipeline
  # Required with auth: the API audience the client mapper adds to tokens.
  audience: ""
  jwtLeewaySeconds: 30
  clientId: docs-pipeline-ui
  # Exact redirect registered on the console client.
  consoleRedirectUri: ""
  # Set to the console login URL to offer Google sign-in.
  googleConsoleUrl: ""
  providerGroupRoot: providers
  verifyLiveGroups: false
  # Provider/user management, through a realm service account.
  adminBaseUrl: ""
  adminRealm: ""
  # Empty: the managed realm issues the service account's token.
  adminTokenRealm: ""
  adminClientId: ""

# KP_RUNTIME_PROFILE. local is a disposable, loopback-only stack and the only
# profile that may disable auth.
runtimeProfile: production

# ============================================================================
# ENVIRONMENT CONFIGURATION - non-secret, non-derived config.
# Full annotated reference: knowledge-provider/ENV.md in the app repo.
# NEVER put secrets here - see secretEnv below.
# ============================================================================
envConfig:
  LOG_LEVEL: "info"
  # Names the process in traces and logs; api and worker are one image.
  OTEL_SERVICE_NAME: "knowledge-provider-api"
  DEFAULT_INSTANCE: "default"
  DISABLE_PROD_SETTING: "false"

  CORS_ORIGINS: ""
  RATE_LIMIT_DEFAULT: "100/minute"
  RATE_LIMIT_UPLOAD: "10/minute"
  RATE_LIMIT_SIGN_IN: "10/minute"

  EMBEDDING_PROVIDER: "sentence_transformers"
  EMBEDDING_MODEL: "intfloat/multilingual-e5-large"
  EMBEDDING_DIM: "1024"
  EMBEDDING_VECTOR_SIZE: "1024"
  # e5, embeddinggemma or plain. Changing it or the model needs a new collection.
  EMBEDDING_PROMPT_STYLE: "e5"
  EMBEDDING_BASE_URL: ""

  HF_HOME: "/opt/hf-cache"
  HF_HUB_CACHE: "/opt/hf-cache"

  OCR_PROVIDER: "mistral"
  OCR_MODEL: "mistral-ocr-latest"
  MISTRAL_OCR_MODEL: "mistral-ocr-latest"
  MISTRAL_OCR_API_URL: "https://api.mistral.ai/v1/ocr"
  OCR_SEGMENT_PAGES: "20"
  OCR_REQUEST_TIMEOUT_SECONDS: "300"
  # OCR_PROVIDER=chandra: an OpenAI-compatible endpoint ("vllm") or the HF
  # page API ("hf"). The vllm client takes its key from VLLM_API_KEY.
  CHANDRA_INFERENCE_MODE: "hf"
  CHANDRA_VLLM_BASE_URL: ""
  VLLM_MODEL_NAME: "chandra"

  AGRINET_GEMMA_BASE_URL: ""
  AGRINET_GEMMA_MODEL_NAME: "google/gemma-4-31b-it"

  TRANSLATION_PROVIDER: "gemma_vllm"
  TRANSLATION_MODEL: "google/gemma-4-31b-it"
  TRANSLATION_VLLM_BASE_URL: ""
  TRANSLATION_PAGE_CONCURRENCY: "1"
  TRANSLATION_USE_MAX_COMPLETION_TOKENS: "false"
  TRANSLATION_TEMPERATURE: "0.0"
  TRANSLATION_SCRIPT_GATE_ENABLED: "true"
  TRANSLATION_SCRIPT_MIN_CHARS: "15"
  TRANSLATION_SCRIPT_MIN_RATIO: "0.05"

  CHUNKING_PROVIDER: "recursive_splitter"
  CHUNKING_MODEL: "recursive_splitter"
  CHUNKING_TARGET_CHUNK_TOKENS: "450"

  TEMPORAL_MAX_CONCURRENT_ACTIVITIES: "4"

  DOCS_PIPELINE_API_URL: ""
  DOCS_PIPELINE_UI_URL: ""

  # true: index all intake into vectorStore.collectionName, with no approval
  # or network publishing.
  KP_INDEX_ONLY: "false"

  # Publish to Network (Discovery Service) - worker-only in practice, but
  # shipped from the same envConfig as api for a single source of truth.
  DISCOVERY_SERVICE_ENDPOINT: ""
  # Off unless set: publishing needs DISCOVERY_SERVICE_ENDPOINT and a sender.
  ENABLE_PUBLISH_TO_NETWORK: "false"
  # The network's own subscriberId. Also sent as context.networkId, so it is
  # what Discovery scopes the published catalogs to.
  NETWORK_SENDER_ID: ""

# Names of pre-existing Secrets to inject wholesale via envFrom.
envFromSecrets: []

# Individual env vars sourced from specific Secret keys. Defaults name the
# Secrets this chart expects - create them out-of-band before installing (see
# README.md), or point these at your own existing Secrets/keys.
secretEnv:
  # Static S3 credentials (objectStore.credentialsType: static).
  AWS_ACCESS_KEY_ID:
    name: knowledge-provider-minio-credentials
    key: access-key
  AWS_SECRET_ACCESS_KEY:
    name: knowledge-provider-minio-credentials
    key: secret-key
  # Required by any Qdrant that is not local; the qdrant chart reads the same key.
  VECTOR_DB_API_KEY:
    name: knowledge-provider-qdrant
    key: api-key
    optional: true
  PROD_VECTOR_DB_API_KEY:
    name: knowledge-provider-provider-keys
    key: prod-vector-db-api-key
    optional: true
  EMBEDDING_API_KEY:
    name: knowledge-provider-provider-keys
    key: embedding-api-key
    optional: true
  HF_TOKEN:
    name: knowledge-provider-provider-keys
    key: hf-token
    optional: true
  MISTRAL_API_KEY:
    name: knowledge-provider-provider-keys
    key: mistral-api-key
    optional: true
  AGRINET_GEMMA_API_KEY:
    name: knowledge-provider-provider-keys
    key: gemma-api-key
    optional: true
  TRANSLATION_API_KEY:
    name: knowledge-provider-provider-keys
    key: translation-api-key
    optional: true
  # Read by the chandra-ocr library itself (CHANDRA_INFERENCE_MODE=vllm).
  VLLM_API_KEY:
    name: knowledge-provider-provider-keys
    key: vllm-api-key
    optional: true
  KEYCLOAK_CLIENT_SECRET:
    name: knowledge-provider-keycloak-client
    key: client-secret
    optional: true
  # Secret of keycloak.adminClientId (realm service account).
  KEYCLOAK_ADMIN_CLIENT_SECRET:
    name: knowledge-provider-keycloak-admin-client
    key: client-secret
    optional: true

extraEnv: []
