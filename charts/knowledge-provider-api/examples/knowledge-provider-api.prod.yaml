# Example: knowledge-provider-api, prod environment.
#
#   helm install knowledge-provider-api charts/knowledge-provider-api \
#     -n knowledge-provider -f charts/knowledge-provider-api/examples/knowledge-provider-api.prod.yaml
#
# All secret values below are referenced by name only - create the Secrets
# out-of-band before installing (see README.md, "Secrets"). Nothing here is a
# committed secret.

image:
  registry: ghcr.io
  repository: openagrinet/knowledge-provider
  tag: "v0.1.0"
  pullSecrets:
    - ghcr-pull-secret

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: registry-sandbox-vistaar.da.gov.in
      paths:
        - path: /knowledge-provider-api
          pathType: Prefix

keycloak:
  authDisabled: false
  url: "https://dev-auth-vistaar.da.gov.in/auth"
  realm: docs-pipeline
  audience: docs-pipeline-api
  clientId: docs-pipeline-ui
  consoleRedirectUri: "https://registry-sandbox-vistaar.da.gov.in/knowledge-provider/auth/sso-callback"
  adminClientId: docs-pipeline-api

envConfig:
  LOG_LEVEL: "info"
  CORS_ORIGINS: "https://registry-sandbox-vistaar.da.gov.in"
  DOCS_PIPELINE_API_URL: "https://registry-sandbox-vistaar.da.gov.in/knowledge-provider-api"
  DOCS_PIPELINE_UI_URL: "https://registry-sandbox-vistaar.da.gov.in/knowledge-provider"
  AGRINET_GEMMA_BASE_URL: "https://dev-vistaar.da.gov.in/gemma4"
  TRANSLATION_VLLM_BASE_URL: "https://dev-vistaar.da.gov.in/gemma4"

prodVectorStore:
  url: "https://dev-vistaar.da.gov.in/qdrant"
  collectionName: test_doc_pipeline_prod

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi

persistence:
  hfCache:
    size: 30Gi

commonLabels:
  oan.in/environment: prod
