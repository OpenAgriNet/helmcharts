apiVersion: v2
name: dashboards
description: >-
  The OAN Grafana dashboards — Infra, Network API and Providers — as
  ConfigMaps that the Grafana chart's dashboard sidecar loads into the OAN
  folder. Deploys no workload.
type: application
version: 0.1.0
appVersion: "0.1.0"
maintainers:
  - name: OpenAgriNet Engineering Team
    url: https://github.com/OpenAgriNet
keywords:
  - oan
  - openagrinet
  - grafana
  - dashboards
  - observability
home: https://github.com/OpenAgriNet/helmcharts
sources:
  - https://github.com/OpenAgriNet/helmcharts
dependencies:
  - name: common
    version: "0.2.x"
    repository: "file://../common"
