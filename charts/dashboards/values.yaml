# ============================================================================
# dashboards — the OAN Grafana dashboards, as ConfigMaps
# ============================================================================
# Install this in the namespace Grafana runs in. The Grafana chart's dashboard
# sidecar watches its own namespace by default, picks up every ConfigMap that
# carries `sidecar.label`, and writes it into the folder named by the
# `sidecar.folderAnnotation` annotation. README.md has the Grafana values this
# needs.

# How Grafana finds the ConfigMaps. Must match `sidecar.dashboards.label`,
# `labelValue` and `folderAnnotation` in the Grafana release.
sidecar:
  label: grafana_dashboard
  labelValue: "1"
  folderAnnotation: grafana_folder

# The Grafana folder the dashboards land in.
folder: OAN

nameOverride: ""
fullnameOverride: ""
commonLabels: {}
commonAnnotations: {}
