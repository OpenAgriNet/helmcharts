{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "federation.serviceAccountName" . }}
  labels:
    {{- include "federation.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- /* One ConfigMap, by name. The Job writes the signed documents into it and
       the server mounts it; nothing else in the namespace is reachable. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "federation.fullname" . }}-documents
  labels:
    {{- include "federation.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ include "federation.documentsConfigMap" . | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "federation.fullname" . }}-documents
  labels:
    {{- include "federation.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "federation.fullname" . }}-documents
subjects:
  - kind: ServiceAccount
    name: {{ include "federation.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
