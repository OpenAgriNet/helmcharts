{{/*
The desired state: which model each named step resolves to, and which vendor
account it uses. This is the file a change is reviewed in.

It is read by the reconcile Job, not by the gateway. Editing it changes nothing
on its own - and neither does editing the rendered ConfigMap with kubectl. Only
a Helm upgrade or an Argo sync runs the Job that applies it.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "litellm.modelsConfigMapName" . }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
data:
  models.json: |
    {{- include "litellm.modelsJSON" . | nindent 4 }}
  credentials.json: |
    {{- include "litellm.credentialsJSON" . | nindent 4 }}
