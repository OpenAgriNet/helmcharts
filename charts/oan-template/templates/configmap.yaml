apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oan-template.envConfigMapName" . }}
  labels:
    {{- include "oan-template.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- include "oan-common.envConfigMapData" . | trim | nindent 2 }}
